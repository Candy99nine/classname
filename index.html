<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>班级打卡 · 谁还没交一眼看清</title>

<script async src="https://cdn.jsdelivr.net/npm/pinyin-pro@3/dist/index.js" onload="window.__pyLoadOk=true" onerror="window.__pyLoadFail=true"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
/* ==========================================================================
   1. 设计变量 —— 糖果暖色系
   ========================================================================== */
:root{
    --bg:         #FFF9F3;
    --ink:        #5A4A42;
    --ink-soft:   #8A7568;
    --muted:      #B3A094;

    --pink:       #FF8FA3;
    --pink-soft:  #FFD9E0;
    --orange:     #FFB86B;
    --green:      #7ED9A0;
    --green-soft: #E2F8EA;

    --card:       #FFFFFF;
    --line:       #F2E8DE;
    --danger:     #E5674E;

    --radius:     18px;
    --shadow:     0 2px 6px rgba(255,143,163,.10), 0 6px 18px rgba(255,143,163,.08);
    --shadow-sm:  0 1px 3px rgba(140,110,90,.10);
}

/* ==========================================================================
   2. 基础重置
   ========================================================================== */
*{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

html, body{
    height: 100%;
    overflow: hidden;
}

body{
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB",
                 "Source Han Sans SC", "Noto Sans CJK SC", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-font-smoothing: antialiased;
    background-color: var(--bg);
    background-image:
        radial-gradient(circle at 8% 12%,  rgba(255,214,224,.55) 0%, transparent 38%),
        radial-gradient(circle at 92% 14%, rgba(255,228,196,.45) 0%, transparent 34%),
        radial-gradient(circle at 88% 88%, rgba(201,228,255,.45) 0%, transparent 38%),
        radial-gradient(circle at 12% 92%, rgba(214,245,214,.40) 0%, transparent 34%);
    background-attachment: fixed;
}

button, input, textarea{
    font-family: inherit;
    color: inherit;
    -webkit-user-select: auto;
    user-select: auto;
}

button{
    border: none;
    background: none;
    cursor: pointer;
    touch-action: manipulation;
}

/* ==========================================================================
   3. 整体骨架
   ========================================================================== */
.app{
    width: 100%;
    max-width: 1920px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px 14px 12px;
    overflow: hidden;
}

/* ---------- 3.1 顶栏 ---------- */
.topbar{
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 48px;
}

.tabs-wrap{
    flex: none;
    display: flex;
    gap: 5px;
    align-items: center;
}
.tabs{
    display: flex;
    gap: 4px;
    padding: 4px;
    background: #FFF1E6;
    border-radius: 16px;
    box-shadow: inset 0 1px 2px rgba(255,184,107,.18);
    overflow-x: auto;
    scrollbar-width: none;
    max-width: 60vw;
}
.tabs::-webkit-scrollbar{ display: none; }

.tab{
    height: 42px;
    padding: 0 20px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 800;
    color: var(--muted);
    letter-spacing: .5px;
    transition: background .18s ease, color .18s ease, transform .12s ease;
    white-space: nowrap;
}
.tab:active{ transform: scale(.95); }
.tab.active{
    background: linear-gradient(135deg, #FF9FAE 0%, #FF8FA3 100%);
    color: #fff;
    box-shadow: 0 3px 10px rgba(255,143,163,.40);
}

.add-tab-btn{
    width: 42px;
    height: 42px;
    flex: none;
    border-radius: 12px;
    background: #FFF1E6;
    color: var(--pink);
    font-size: 22px;
    font-weight: bold;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-sm);
}
.add-tab-btn:active{ transform: scale(.92); }

.progress-wrap{
    flex: 1;
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    padding: 0 6px;
}

.prog-text{
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .5px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
}
.prog-text .num{ color: var(--pink); font-size: 24px; }

.prog-bar{
    flex: 1;
    min-width: 60px;
    height: 16px;
    background: #FFEBE0;
    border-radius: 99px;
    overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(255,143,163,.15);
}
.prog-fill{
    height: 100%;
    width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, #FFB86B 0%, #FF8FA3 60%, #FF7E96 100%);
    transition: width .5s cubic-bezier(.34,.9,.32,1);
    box-shadow: 0 0 8px rgba(255,143,163,.5);
}

.icon-btn{
    flex: none;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: #fff;
    box-shadow: var(--shadow-sm);
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .12s ease, background .18s ease;
}
.icon-btn:active{ transform: scale(.9); }
.icon-btn.off{ background: #F5ECE4; opacity: .7; }

/* ---------- 3.2 棋盘：左右两列 ---------- */
.board{
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 12px;
    flex-direction: row;
}

.column{
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    border-radius: 24px;
    padding: 10px 12px 12px;
    transition: background .2s ease;
}

.pending-col{
    background: #FFFFFF;
    box-shadow: inset 0 0 0 2.5px #FFE3E9, 0 6px 20px rgba(255,143,163,.10);
}
.passed-col{
    background: #F4FCF6;
    box-shadow: inset 0 0 0 2.5px #CFF0D9, 0 6px 20px rgba(126,217,160,.12);
}

.col-head{
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 6px 8px;
    margin-bottom: 6px;
    border-bottom: 2px dashed;
}
.pending-col .col-head{ border-color: #FFE3E9; }
.passed-col .col-head{ border-color: #D6F0DE; }

.col-title{
    font-size: 16px;
    font-weight: 800;
    letter-spacing: .5px;
    display: flex;
    align-items: center;
    gap: 6px;
}
.pending-col .col-title{ color: #E76B87; }
.passed-col .col-title{ color: #3E9E68; }

.col-count{
    font-size: 15px;
    font-weight: 800;
    padding: 2px 12px;
    border-radius: 99px;
    font-variant-numeric: tabular-nums;
}
.pending-col .col-count{ background: #FFE9EE; color: #E76B87; }
.passed-col .col-count{ background: #D8F4E1; color: #3E9E68; }

/* 网格 */
.grid{
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
    gap: 8px;
    align-content: start;
    padding: 2px;
    scrollbar-width: none;
}
.grid::-webkit-scrollbar{ display: none; }

/* ---------- 3.3 卡片（变大版） ---------- */
.card{
    position: relative;
    height: 92px;
    border-radius: 20px;
    background: var(--card);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 8px 6px;
    transition: transform .12s ease, box-shadow .16s ease;
    will-change: transform;
    overflow: hidden;
}
.card:active{ transform: scale(.93); }

.card::before{
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: var(--stripe, #FFD9E0);
    opacity: .9;
}

.avatar{
    width: 40px;
    height: 40px;
    border-radius: 50%;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    overflow: hidden;
    background: #FFD9E0;
    box-shadow: inset 0 -2px 4px rgba(0,0,0,.06);
}
.avatar img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.avatar.txt{
    color: #6A5548;
    font-size: 18px;
    letter-spacing: 0;
}

.cname{
    font-size: 17px;
    font-weight: 800;
    color: var(--ink);
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    letter-spacing: .2px;
}
.cname.long{ font-size: 14px; }

.passed-col .card{
    height: 82px;
    background: #FFFFFF;
    box-shadow: 0 1px 3px rgba(126,217,160,.18), 0 3px 10px rgba(126,217,160,.10);
}
.passed-col .card::before{ background: var(--green); height: 4px; }
.passed-col .avatar{ width: 34px; height: 34px; font-size: 17px; }
.passed-col .cname{ font-size: 15px; color: #3E7A55; }
.passed-col .cname.long{ font-size: 13px; }

/* 前三名奖牌 */
.medal{
    position: absolute;
    top: 9px;
    right: 6px;
    font-size: 15px;
    line-height: 1;
    pointer-events: none;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.16));
    animation: medalIn .45s cubic-bezier(.2,1.4,.4,1);
}
@keyframes medalIn{
    from{ transform: scale(0) rotate(-40deg); opacity: 0; }
    to  { transform: scale(1) rotate(0deg); opacity: 1; }
}

body.edit-mode .pending-col .card{
    box-shadow: 0 0 0 3px var(--orange), var(--shadow);
}
body.edit-mode .passed-col .card{
    box-shadow: 0 0 0 3px var(--orange), var(--shadow-sm);
}

.empty-tip{
    grid-column: 1 / -1;
    padding: 48px 12px;
    text-align: center;
    color: var(--muted);
    font-size: 16px;
    font-weight: 700;
    line-height: 1.8;
}
.empty-tip .big{ font-size: 40px; display: block; margin-bottom: 8px; }

/* ---------- 3.4 右侧底部控制台 ---------- */
.right-dash{
    flex: none;
    margin-top: 10px;
    background: rgba(255,255,255,0.72);
    border-radius: 20px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: var(--shadow-sm);
    border: 1px solid #E6F6EC;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
}

.dash-top{
    display: flex;
    align-items: center;
    gap: 10px;
}

.clock-box{
    flex: 1;
    display: flex;
    align-items: baseline;
    gap: 10px;
    min-width: 0;
}
.big-clock{
    font-size: clamp(26px, 2.6vw, 44px);
    font-weight: 900;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    letter-spacing: 1.2px;
    line-height: 1;
    text-shadow: 0 2px 6px rgba(90,74,66,.10);
}
.clock-date{
    font-size: 12px;
    font-weight: 800;
    color: var(--muted);
    letter-spacing: .4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.mic-side{
    display: flex;
    gap: 6px;
    flex: none;
}
.mic-btn{
    width: 44px;
    height: 44px;
    border-radius: 13px;
    background: #FFF1E6;
    color: #C97B4E;
    font-size: 19px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .12s ease, background .2s ease, box-shadow .2s ease;
}
.mic-btn:active{ transform: scale(.92); }
.mic-btn.active{
    background: linear-gradient(135deg, #FF9FAE 0%, #FF8FA3 100%);
    color: #fff;
    box-shadow: 0 4px 14px rgba(255,143,163,.45);
    animation: micPulse 1.8s ease-in-out infinite;
}
@keyframes micPulse{
    0%,100%{ box-shadow: 0 4px 14px rgba(255,143,163,.45); }
    50%    { box-shadow: 0 4px 24px rgba(255,143,163,.90); }
}

/* 舞台 */
.wave-stage{
    position: relative;
    width: 100%;
    height: 150px;
    border-radius: 16px;
    overflow: hidden;
    background: radial-gradient(130% 150% at 50% 115%, #FFEFF4 0%, #FFFBF7 65%, #FFFFFF 100%);
    box-shadow: inset 0 0 0 2px #FFE9EE, inset 0 -18px 26px rgba(255,143,163,.06);
    transition: box-shadow .25s ease;
}
.wave-stage.live{
    box-shadow: inset 0 0 0 2px #FFC9D6, inset 0 -18px 26px rgba(255,143,163,.12);
}
#waveCanvas{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}
.stage-dom{
    position: absolute;
    inset: 0;
    pointer-events: none;
}
.stage-dom > *{ position: absolute; }
.stage-dom button{ pointer-events: auto; }

.wave-badge{
    position: absolute;
    left: 10px;
    top: 9px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .4px;
    color: #C97B4E;
    background: rgba(255,255,255,.82);
    padding: 4px 11px;
    border-radius: 99px;
    pointer-events: none;
    white-space: nowrap;
    transition: background .25s ease, color .25s ease, box-shadow .25s ease;
    z-index: 6;
}
.wave-stage.live .wave-badge{
    color: #fff;
    background: linear-gradient(135deg, #FF9FAE 0%, #FF8FA3 100%);
    box-shadow: 0 3px 10px rgba(255,143,163,.42);
}

/* 模式切换 */
.mode-picker{
    position: absolute;
    left: 50%;
    bottom: 7px;
    transform: translateX(-50%);
    display: flex;
    gap: 3px;
    background: rgba(255,255,255,.78);
    padding: 4px;
    border-radius: 99px;
    z-index: 8;
    box-shadow: 0 2px 8px rgba(140,110,90,.12);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
}
.mode-btn{
    width: 30px;
    height: 26px;
    border-radius: 99px;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s ease, transform .12s ease, opacity .15s ease;
    opacity: .55;
    pointer-events: auto;
}
.mode-btn.active{
    background: linear-gradient(135deg, #FF9FAE 0%, #FF8FA3 100%);
    opacity: 1;
    box-shadow: 0 2px 6px rgba(255,143,163,.4);
    transform: scale(1.05);
}

/* 双模式 */
.dual-layer{ position: absolute; inset: 0; }
.dual-stars{ position: absolute; inset: 0; }
.dual-stars i{
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #FFE08A;
    box-shadow: 0 0 8px #FFE08A;
    opacity: .15;
    transition: opacity .25s ease, transform .25s ease;
}
.dual-moon{
    position: absolute;
    left: 50%;
    top: 54%;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 35% 32%, #fffdf0, #f2e2a0);
    box-shadow: 0 0 40px rgba(255,238,176,.5);
    opacity: .1;
    transition: opacity .25s ease;
}
.dual-val{
    position: absolute;
    left: 0;
    right: 0;
    top: 8px;
    text-align: center;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: .5px;
    color: #C97B4E;
    text-shadow: 0 1px 0 #fff;
    z-index: 4;
}
.dual-sub{
    position: absolute;
    right: 10px;
    top: 8px;
    display: flex;
    gap: 4px;
    z-index: 8;
    background: rgba(255,255,255,.78);
    padding: 3px;
    border-radius: 99px;
    box-shadow: 0 2px 8px rgba(140,110,90,.10);
}
.dual-sub button{
    width: 30px;
    height: 26px;
    border-radius: 99px;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: .55;
    transition: background .15s ease, opacity .15s ease;
}
.dual-sub button.active{
    background: linear-gradient(135deg, #FF9FAE 0%, #FF8FA3 100%);
    opacity: 1;
    box-shadow: 0 2px 6px rgba(255,143,163,.4);
}

/* 声控进度 */
.prog-layer{ position: absolute; inset: 0; }
.prog-track{
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(180deg, #EAF4FF, #D6E9FF);
    overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.06);
}
.prog-fill{
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 0;
    background: linear-gradient(90deg, rgba(110,198,255,.5), rgba(139,92,246,.5));
    border-radius: 12px;
    transition: width .3s linear;
}
.prog-swimmer{
    position: absolute;
    bottom: -2px;
    left: 3%;
    font-size: 26px;
    transform: translateX(-50%);
    transition: left .3s linear;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.15));
    z-index: 3;
}
.prog-goal{
    position: absolute;
    right: 4px;
    bottom: -2px;
    font-size: 24px;
    opacity: .8;
    z-index: 2;
}
.prog-reset{
    position: absolute;
    right: 10px;
    top: 8px;
    width: 30px;
    height: 26px;
    border-radius: 99px;
    font-size: 14px;
    background: rgba(255,255,255,.78);
    color: #8A7568;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 8;
    box-shadow: 0 2px 8px rgba(140,110,90,.10);
    pointer-events: auto;
}
.prog-reset:active{ transform: scale(.92); }

/* 气球 */
.balloon-layer{
    position: absolute;
    inset: 0;
    overflow: hidden;
}
.balloon{
    position: absolute;
    font-size: 22px;
    bottom: -30px;
    will-change: transform;
    pointer-events: none;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.06));
}

/* ---------- 3.5 底部工具栏 ---------- */
.bottombar{
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
}

.tb{
    height: 50px;
    padding: 0 22px;
    border-radius: 15px;
    background: #fff;
    box-shadow: var(--shadow-sm);
    font-size: 16px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: .3px;
    white-space: nowrap;
    transition: transform .12s ease, background .16s ease;
}
.tb:active{ transform: scale(.95); }
.tb.primary{
    background: linear-gradient(135deg, #FF9FAE 0%, #FF8FA3 100%);
    color: #fff;
    box-shadow: 0 3px 12px rgba(255,143,163,.40);
}
.tb.more{
    width: 50px;
    padding: 0;
    font-size: 24px;
    margin-left: auto;
    line-height: 1;
}

/* ==========================================================================
   4. 点击特效层
   ========================================================================== */
#fxLayer{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    overflow: hidden;
}

.fx-item{
    position: fixed;
    pointer-events: none;
    will-change: transform, opacity;
    font-size: 20px;
    line-height: 1;
    z-index: 9999;
}

/* ==========================================================================
   5. 弹窗通用
   ========================================================================== */
.modal{
    position: fixed;
    inset: 0;
    background: rgba(90,74,66,.42);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
}
.modal.active{ display: flex; }

.modal-card{
    width: 100%;
    max-width: 520px;
    max-height: 88vh;
    background: #fff;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 24px 70px rgba(90,74,66,.32);
    animation: popIn .22s cubic-bezier(.2,1.2,.4,1);
}
@keyframes popIn{
    from{ transform: scale(.94); opacity: 0; }
    to  { transform: scale(1);   opacity: 1; }
}

.modal-head{
    flex: none;
    padding: 18px 20px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}
.modal-head h3{
    font-size: 18px;
    font-weight: 800;
    letter-spacing: .3px;
    color: var(--ink);
}
.modal-head .x{
    width: 40px;
    height: 40px;
    flex: none;
    border-radius: 50%;
    background: #FFF1E6;
    color: var(--ink-soft);
    font-size: 22px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-body{
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 4px 20px 16px;
    -webkit-overflow-scrolling: touch;
}

.modal-foot{
    flex: none;
    display: flex;
    gap: 10px;
    padding: 12px 20px 18px;
    border-top: 1px solid var(--line);
}

.btn-main, .btn-ghost{
    flex: 1;
    height: 50px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: .3px;
}
.btn-main{
    background: linear-gradient(135deg, #FF9FAE 0%, #FF8FA3 100%);
    color: #fff;
    box-shadow: 0 3px 10px rgba(255,143,163,.35);
}
.btn-ghost{ background: #FFF1E6; color: var(--ink); }
.btn-main:active, .btn-ghost:active{ transform: scale(.98); }

.field{ margin-bottom: 14px; }
.field label{
    display: block;
    font-size: 14px;
    font-weight: 800;
    color: var(--ink-soft);
    margin-bottom: 6px;
    letter-spacing: .3px;
}
.field input[type=text],
.field input[type=date],
.field textarea{
    width: 100%;
    padding: 12px 14px;
    border: 2px solid var(--line);
    border-radius: 13px;
    font-size: 16px;
    background: #FFFCF9;
    outline: none;
    transition: border-color .16s ease;
}
.field input:focus, .field textarea:focus{ border-color: var(--pink); }
.field textarea{ resize: vertical; min-height: 90px; line-height: 1.5; }

/* ==========================================================================
   6. 菜单弹层
   ========================================================================== */
.menu{
    position: fixed;
    inset: 0;
    background: rgba(90,74,66,.32);
    display: none;
    z-index: 90;
}
.menu.active{ display: block; }

.menu-panel{
    position: absolute;
    right: 14px;
    bottom: 76px;
    width: 244px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 18px 50px rgba(90,74,66,.32);
    padding: 8px;
    overflow: hidden;
    animation: menuIn .18s cubic-bezier(.2,1.1,.4,1);
}
@keyframes menuIn{
    from{ transform: translateY(10px) scale(.96); opacity: 0; }
    to  { transform: translateY(0) scale(1); opacity: 1; }
}

.menu-item{
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    height: 50px;
    padding: 0 14px;
    border-radius: 13px;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    overflow: hidden;
    text-align: left;
}
.menu-item:active{ background: #FFF1E6; }
.menu-item .ico{
    width: 22px;
    font-size: 18px;
    text-align: center;
    flex: none;
}
.menu-item.danger{ color: var(--danger); }

.reset-fill{
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 0%;
    background: #FDE6E1;
    pointer-events: none;
    transition: width .1s linear;
}
.menu-item.pressing .reset-fill{
    width: 100%;
    transition: width 1.5s linear;
}
.menu-item > *:not(.reset-fill){ position: relative; z-index: 1; }

/* ==========================================================================
   7. 名单编辑
   ========================================================================== */
.roster-list{
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 10px;
}
.roster-row{
    display: flex;
    gap: 6px;
    align-items: center;
}
.roster-row input{
    height: 44px;
    padding: 0 10px;
    border: 2px solid var(--line);
    border-radius: 11px;
    font-size: 15px;
    background: #FFFCF9;
    outline: none;
    min-width: 0;
}
.roster-row input:focus{ border-color: var(--pink); }
.roster-row .ri-sid{ width: 66px; text-align: center; flex: none; font-variant-numeric: tabular-nums; }
.roster-row .ri-name{ flex: 1; }
.roster-row .del{
    width: 44px;
    height: 44px;
    flex: none;
    border-radius: 11px;
    background: #FDEDEA;
    color: var(--danger);
    font-size: 22px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
}

.add-row{
    width: 100%;
    height: 48px;
    border-radius: 13px;
    background: #FFF1E6;
    color: #C97B4E;
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 14px;
}

.bulk-box{
    background: #FFFAF5;
    border-radius: 13px;
    padding: 12px;
    margin-bottom: 6px;
    border: 1.5px dashed #FFE3C4;
}
.bulk-box summary{
    font-size: 14px;
    font-weight: 800;
    color: #C97B4E;
    cursor: pointer;
    outline: none;
    margin-bottom: 2px;
}
.bulk-box textarea{
    width: 100%;
    min-height: 120px;
    margin-top: 10px;
    padding: 10px;
    border: 2px solid var(--line);
    border-radius: 11px;
    font-size: 15px;
    line-height: 1.6;
    background: #fff;
    outline: none;
    resize: vertical;
}
.bulk-box button{
    margin-top: 8px;
    height: 44px;
    padding: 0 20px;
    border-radius: 11px;
    background: linear-gradient(135deg, #FF9FAE 0%, #FF8FA3 100%);
    color: #fff;
    font-size: 15px;
    font-weight: 800;
}

/* ==========================================================================
   8. 记录 / 历史 / 头像 / 备份
   ========================================================================== */
.report-box{
    background: #FFFAF5;
    border-radius: 16px;
    padding: 16px;
}
.report-title{
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 10px;
}
.report-meta{
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.8;
    padding-bottom: 10px;
    border-bottom: 2px dashed var(--line);
    margin-bottom: 12px;
}
.report-meta b{ color: var(--ink); font-weight: 800; }

.report-sec{ margin-bottom: 14px; }
.report-sec h4{
    font-size: 14px;
    font-weight: 800;
    margin-bottom: 8px;
    letter-spacing: .3px;
}
.report-sec.ok h4{ color: #3E9E68; }
.report-sec.no h4{ color: #E76B87; }
.tags{ display: flex; flex-wrap: wrap; gap: 6px; }
.tag{
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    background: #F4ECE4;
    color: var(--ink);
}
.report-sec.ok .tag{ background: #E2F8EA; color: #3E8A5C; }
.report-sec.no .tag{ background: #FFE9EE; color: #D9567A; }
.tag img{ width: 18px; height: 18px; border-radius: 50%; object-fit: cover; }

/* 历史 */
.his-row{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 6px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background .2s;
    border-radius: 8px;
}
.his-row:active{ background: #FFF1E6; }
.his-row:last-child{ border-bottom: none; }
.his-date{
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    width: 85px;
    flex: none;
}
.his-name{
    flex: 1;
    font-size: 16px;
    font-weight: 800;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.his-num{
    font-size: 15px;
    font-weight: 800;
    color: #3E9E68;
    font-variant-numeric: tabular-nums;
    flex: none;
}
.empty-hint{
    text-align: center;
    color: var(--muted);
    font-size: 15px;
    padding: 30px 0;
    font-weight: 700;
    line-height: 1.9;
}

/* 头像编辑 */
.upload-label{
    display: block;
    width: 100%;
    height: 50px;
    line-height: 50px;
    text-align: center;
    background: linear-gradient(135deg, #FF9FAE 0%, #FF8FA3 100%);
    color: #fff;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(255,143,163,.30);
}
#avatarCamera, #avatarFile{ display: none; }

.emoji-grid{
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
}
.emoji-item{
    aspect-ratio: 1;
    border-radius: 13px;
    background: #FFF6EE;
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid transparent;
}
.emoji-item.selected{
    border-color: var(--pink);
    background: #FFE9EE;
}

/* 轻提示 */
#toast{
    position: fixed;
    left: 50%;
    bottom: 92px;
    transform: translateX(-50%) translateY(12px);
    background: rgba(90,74,66,.93);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    padding: 10px 22px;
    border-radius: 24px;
    max-width: 78%;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s ease, transform .22s ease;
    z-index: 300;
}
#toast.show{
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* ==========================================================================
   9. 响应式
   ========================================================================== */
@media (max-width: 768px){
    .app{ padding: 8px; gap: 8px; }

    .topbar{ flex-wrap: wrap; row-gap: 8px; }
    .tabs-wrap{ width: 100%; }
    .tabs{ max-width: 85vw; }
    .progress-wrap{
        order: 3;
        flex-basis: 100%;
        width: 100%;
        padding: 0;
    }
    .icon-btn{ order: 2; margin-left: auto; width: 44px; height: 44px; font-size: 18px; }
    .tab{ padding: 0 14px; font-size: 15px; height: 38px; }
    .prog-text{ font-size: 16px; }
    .prog-text .num{ font-size: 18px; }

    .board{ flex-direction: column; gap: 8px; }
    .column{ border-radius: 20px; padding: 8px 10px 10px; }
    .col-title{ font-size: 14px; }

    .grid{ grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 6px; }
    .card{ height: 76px; border-radius: 16px; }
    .avatar{ width: 30px; height: 30px; font-size: 16px; }
    .cname{ font-size: 14px; }
    .cname.long{ font-size: 12px; }
    .passed-col .card{ height: 70px; }
    .passed-col .avatar{ width: 26px; height: 26px; font-size: 14px; }
    .passed-col .cname{ font-size: 13px; }
    .medal{ font-size: 13px; top: 7px; right: 5px; }

    .right-dash{ padding: 8px; gap: 6px; border-radius: 16px; }
    .dash-top{ gap: 6px; }
    .big-clock{ font-size: 24px; letter-spacing: .8px; }
    .clock-date{ display: none; }
    .mic-btn{ width: 38px; height: 38px; font-size: 16px; border-radius: 11px; }
    .wave-stage{ height: 118px; border-radius: 13px; }
    .wave-badge{ font-size: 11px; padding: 3px 9px; top: 7px; left: 8px; }
    .mode-picker{ bottom: 5px; padding: 3px; gap: 2px; }
    .mode-btn{ width: 26px; height: 23px; font-size: 12px; }
    .dual-val{ font-size: 16px; top: 6px; }
    .dual-moon{ width: 46px; height: 46px; }
    .dual-sub{ right: 8px; top: 6px; padding: 2px; }
    .dual-sub button{ width: 26px; height: 23px; font-size: 12px; }
    .prog-track{ bottom: 34px; height: 34px; left: 10px; right: 10px; }
    .prog-swimmer{ font-size: 22px; }
    .prog-goal{ font-size: 20px; }
    .prog-reset{ top: 6px; right: 8px; width: 26px; height: 23px; font-size: 12px; }
    .balloon{ font-size: 18px; }

    .tb{ height: 46px; padding: 0 14px; font-size: 15px; flex: 1; }
    .tb.more{ flex: none; width: 46px; }
    .menu-panel{ right: 8px; left: 8px; width: auto; bottom: 66px; }
}

@media (min-width: 1600px){
    .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    .card{ height: 100px; }
    .avatar{ width: 44px; height: 44px; font-size: 22px; }
    .cname{ font-size: 18px; }
    .cname.long{ font-size: 16px; }
    .passed-col .card{ height: 90px; }
    .passed-col .avatar{ width: 38px; height: 38px; font-size: 18px; }
    .passed-col .cname{ font-size: 16px; }
    .wave-stage{ height: 170px; }
    .mic-btn{ width: 50px; height: 50px; font-size: 22px; }
}

@media (prefers-reduced-motion: reduce){
    *{ animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>

<body>

<div class="app">

    <!-- 顶栏 -->
    <header class="topbar">
        <div class="tabs-wrap">
            <div class="tabs" id="tabs"></div>
            <button class="add-tab-btn" id="addTabBtn" title="自定义新任务">＋</button>
        </div>

        <div class="progress-wrap">
            <div class="prog-text" id="progText">已交 <span class="num">0</span> / 0</div>
            <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
        </div>

        <button class="icon-btn" id="soundBtn" title="声音开关">🔊</button>
    </header>

    <!-- 左右两列 -->
    <main class="board">
        <section class="column pending-col">
            <div class="col-head">
                <span class="col-title">🐣 还没交</span>
                <span class="col-count" id="pendingCount">0</span>
            </div>
            <div class="grid" id="pendingGrid"></div>
        </section>

        <section class="column passed-col">
            <div class="col-head">
                <span class="col-title">✅ 已经交啦</span>
                <span class="col-count" id="passedCount">0</span>
            </div>
            <div class="grid" id="passedGrid"></div>

            <!-- 右侧控制台 -->
            <div class="right-dash">
                <div class="dash-top">
                    <div class="clock-box">
                        <div class="big-clock" id="bigClock">08:00:00</div>
                        <div class="clock-date" id="clockDate">—</div>
                    </div>
                    <div class="mic-side">
                        <button class="mic-btn" id="micBtn" title="开启 / 关闭麦克风">🎤</button>
                        <button class="mic-btn" id="micThemeBtn" title="切换音浪配色">🎨</button>
                    </div>
                </div>

                <div class="wave-stage" id="waveStage" data-mode="wave">
                    <canvas id="waveCanvas"></canvas>
                    <div class="stage-dom" id="stageDom">

                        <!-- 双模式 -->
                        <div class="dual-layer" id="dualLayer" style="display:none;">
                            <div class="dual-stars" id="dualStars"></div>
                            <div class="dual-moon" id="dualMoon"></div>
                            <div class="dual-val" id="dualVal">0%</div>
                            <div class="dual-sub" id="dualSub">
                                <button data-dual="read" class="active" title="读书模式">📣</button>
                                <button data-dual="quiet" title="安静模式">🌙</button>
                            </div>
                        </div>

                        <!-- 声控进度 -->
                        <div class="prog-layer" id="progLayer" style="display:none;">
                            <div class="prog-track">
                                <div class="prog-fill" id="progFillBar"></div>
                                <div class="prog-swimmer" id="progSwimmer">🐋</div>
                                <div class="prog-goal">🏝</div>
                            </div>
                            <button class="prog-reset" id="progReset" title="重置进度">↺</button>
                        </div>

                        <!-- 气球 -->
                        <div class="balloon-layer" id="balloonLayer" style="display:none;"></div>

                    </div>

                    <!-- 模式切换 -->
                    <div class="mode-picker" id="modePicker">
                        <button class="mode-btn active" data-mode="wave" title="音浪">🌊</button>
                        <button class="mode-btn" data-mode="dual" title="双模式">🌙</button>
                        <button class="mode-btn" data-mode="progress" title="声控进度">🐋</button>
                        <button class="mode-btn" data-mode="firework" title="烟花">🎆</button>
                        <button class="mode-btn" data-mode="balloon" title="气球">🎈</button>
                    </div>

                    <span class="wave-badge" id="waveBadge">🎤 点击开启音浪</span>
                </div>
            </div>
        </section>
    </main>

    <!-- 底部工具栏 -->
    <footer class="bottombar">
        <button class="tb" id="undoBtn">↩ 撤销</button>
        <button class="tb primary" id="saveTodayBtn">存今天</button>
        <button class="tb" id="csvBtn">导出 CSV</button>
        <button class="tb more" id="moreBtn">⋯</button>
    </footer>

</div>

<!-- 更多菜单 -->
<div class="menu" id="menu">
    <div class="menu-panel">
        <button class="menu-item" data-action="roster">
            <span class="ico">👥</span><span>名单管理</span>
        </button>
        <button class="menu-item" data-action="avatar">
            <span class="ico">🖼</span><span>换头像</span>
        </button>
        <button class="menu-item" data-action="record">
            <span class="ico">📋</span><span>今日记录</span>
        </button>
        <button class="menu-item" data-action="history">
            <span class="ico">🕘</span><span>历史存档</span>
        </button>
        <button class="menu-item" data-action="qrcode">
            <span class="ico">🔳</span><span>分享 / 扫码</span>
        </button>
        <button class="menu-item" data-action="backup">
            <span class="ico">💾</span><span>备份 / 恢复</span>
        </button>
        <button class="menu-item danger" id="resetItem">
            <span class="reset-fill"></span>
            <span class="ico">⚠️</span><span>长按 1.5 秒重置</span>
        </button>
    </div>
</div>

<!-- 弹窗：自定义新任务 -->
<div class="modal" id="addTabModal">
    <div class="modal-card">
        <div class="modal-head">
            <h3>新建自定义任务</h3>
            <button class="x" data-close="addTabModal">×</button>
        </div>
        <div class="modal-body">
            <div class="field">
                <label>任务名称</label>
                <input type="text" id="newTabName" maxlength="10" placeholder="例如：数学作业、英语听写">
            </div>
            <p style="font-size:14px;color:#8A7568;line-height:1.6;">新任务将独立记录打卡状态，名单默认复制自“早读”。</p>
        </div>
        <div class="modal-foot">
            <button class="btn-ghost" data-close="addTabModal">取消</button>
            <button class="btn-main" id="confirmAddTabBtn">创建</button>
        </div>
    </div>
</div>

<!-- 弹窗：存今天 -->
<div class="modal" id="saveModal">
    <div class="modal-card">
        <div class="modal-head">
            <h3>存入今天的打卡记录</h3>
            <button class="x" data-close="saveModal">×</button>
        </div>
        <div class="modal-body">
            <div class="field">
                <label>项目名称</label>
                <input type="text" id="projectName" maxlength="20" placeholder="例如：早读课文背诵">
            </div>
            <div class="field">
                <label>日期</label>
                <input type="text" id="saveDate" readonly style="background:#FFF6EE;color:#B3A094;">
            </div>
        </div>
        <div class="modal-foot">
            <button class="btn-ghost" data-close="saveModal">取消</button>
            <button class="btn-main" id="confirmSaveBtn">确认存档</button>
        </div>
    </div>
</div>

<!-- 弹窗：名单管理 -->
<div class="modal" id="rosterModal">
    <div class="modal-card">
        <div class="modal-head">
            <h3>名单管理 · <span id="rosterTabName">早读</span></h3>
            <button class="x" data-close="rosterModal">×</button>
        </div>
        <div class="modal-body">
            <div class="roster-list" id="rosterList"></div>
            <button class="add-row" id="addStudentBtn">＋ 添加学生</button>

            <details class="bulk-box">
                <summary>批量导入（覆盖当前名单）</summary>
                <textarea id="bulkInput" placeholder="每行一个学生，支持以下两种写法：&#10;张三&#10;02 李四&#10;&#10;带学号时会使用你填的学号"></textarea>
                <button id="bulkImportBtn">导入名单</button>
            </details>
        </div>
        <div class="modal-foot">
            <button class="btn-ghost" data-close="rosterModal">取消</button>
            <button class="btn-main" id="saveRosterBtn">保存名单</button>
        </div>
    </div>
</div>

<!-- 弹窗：换头像 -->
<div class="modal" id="avatarModal">
    <div class="modal-card">
        <div class="modal-head">
            <h3 id="avatarTitle">更换头像</h3>
            <button class="x" data-close="avatarModal">×</button>
        </div>
        <div class="modal-body">
            <div style="display: flex; gap: 10px; margin-bottom: 16px;">
                <label class="upload-label" for="avatarCamera" style="margin-bottom:0;">📷 现场拍照</label>
                <label class="upload-label" for="avatarFile" style="margin-bottom:0;background:#FFB86B;">🖼️ 从相册选</label>
            </div>
            <input type="file" id="avatarCamera" accept="image/*" capture="environment">
            <input type="file" id="avatarFile" accept="image/*">

            <div class="field"><label>或者选一个表情</label></div>
            <div class="emoji-grid" id="emojiGrid"></div>
        </div>
        <div class="modal-foot">
            <button class="btn-ghost" id="avatarResetBtn">恢复默认</button>
            <button class="btn-main" data-close="avatarModal">完成</button>
        </div>
    </div>
</div>

<!-- 弹窗：今日记录 / 历史详情 -->
<div class="modal" id="recordModal">
    <div class="modal-card">
        <div class="modal-head">
            <h3 id="recordTitle">今日记录</h3>
            <button class="x" data-close="recordModal">×</button>
        </div>
        <div class="modal-body">
            <div class="report-box" id="recordBody"></div>
        </div>
        <div class="modal-foot">
            <button class="btn-main" data-close="recordModal">关闭</button>
        </div>
    </div>
</div>

<!-- 弹窗：历史列表 -->
<div class="modal" id="historyModal">
    <div class="modal-card">
        <div class="modal-head">
            <h3>历史存档</h3>
            <button class="x" data-close="historyModal">×</button>
        </div>
        <div class="modal-body">
            <div id="historyList"></div>
        </div>
        <div class="modal-foot">

<div id="toast"></div>

<script>
(function () {
'use strict';

/* ==========================================================================
   1. 常量与数据结构
   ========================================================================== */
const STORAGE_KEY  = 'daka_v5';
const DATA_VERSION = 5;
const PROG_KEY     = 'daka_prog_v1';

const DEFAULT_TABS = [
    { id: 'morning',    name: '早读' },
    { id: 'homework',   name: '作业' },
    { id: 'recitation', name: '背诵' }
];

const DEFAULT_NAMES = [
    '郭津杭', '李思蕊', '刘承晔', '刘恩山', '刘翰璋',
    '刘昊哲', '刘铭浩', '刘依牧', '刘怡甯', '刘羽默',
    '刘振凯', '刘子霖', '刘梓颖桦', '王溪芮', '许钰涵',
    '杨淇淋', '杨熙硕', '杨惜雅', '张晨旭', '张美兰',
    '张恬伊', '张熙若霖', '张栩飒', '张钰澍', '张悦晴',
    '张运达', '张泽航', '张梓栋', '张梓濠'
];

const EMOJIS = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮',
                '🐷','🐸','🐵','🐔','🐧','🐦','🐤','🦄','🐝','🦋','🐞','🐢',
                '🐬','🐳','🦖','🦕','🐙','🦉'];

const CANDY = [
    '#FFB3C1', '#FFC98F', '#FFE08A', '#9BE3B4',
    '#9CCEFF', '#C6B2F0', '#8FE0D8', '#FF9E9E'
];

let state = null;
let pinyinReady = false;
const pinyinCache = new Map();
const undoStack = [];
let editMode = false;
let editingStudentId = null;
let audioCtx = null;

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

const elPendingGrid = $('#pendingGrid');
const elPassedGrid  = $('#passedGrid');
const elPendingCnt  = $('#pendingCount');
const elPassedCnt   = $('#passedCount');
const elProgText    = $('#progText');
const elProgFill    = $('#progFill');
const elBigClock    = $('#bigClock');
const elTabs        = $('#tabs');
const elSoundBtn    = $('#soundBtn');

/* ==========================================================================
   2. 通用工具
   ========================================================================== */
function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' +
           String(d.getMonth() + 1).padStart(2, '0') + '-' +
           String(d.getDate()).padStart(2, '0');
}

function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

let toastTimer = null;
function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

function reduceMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function openModal(id)  { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

function currentTab() {
    return state.tabs[state.activeTab] || Object.values(state.tabs)[0];
}

function candyOf(id) {
    return CANDY[(Math.max(1, id) - 1) % CANDY.length];
}

/* ==========================================================================
   3. 状态初始化 / 持久化
   ========================================================================== */
function createTab(def, names) {
    return {
        id: def.id,
        name: def.name,
        students: names.map((n, i) => ({
            id: i + 1,
            name: n,
            sid: String(i + 1).padStart(2, '0'),
            avatarType: 'text',
            avatarData: ''
        })),
        passed: {},
        seq: 0
    };
}

function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
    } catch (e) { return null; }
}

function initState() {
    let s = loadState();

    if (!s || !s.tabs) {
        s = {
            version: DATA_VERSION,
            activeTab: DEFAULT_TABS[0].id,
            soundOn: true,
            date: todayStr(),
            tabs: {},
            history: []
        };
        DEFAULT_TABS.forEach(def => { s.tabs[def.id] = createTab(def, DEFAULT_NAMES); });
    }

    Object.keys(s.tabs).forEach(k => {
        const t = s.tabs[k];
        if (!t.passed) t.passed = {};
        if (typeof t.seq !== 'number') t.seq = 0;
        if (!Array.isArray(t.students)) t.students = [];
    });

    if (s.date !== todayStr()) {
        s.date = todayStr();
        Object.keys(s.tabs).forEach(k => {
            s.tabs[k].passed = {};
            s.tabs[k].seq = 0;
        });
    }

    if (!s.tabs[s.activeTab]) s.activeTab = Object.keys(s.tabs)[0];
    if (!Array.isArray(s.history)) s.history = [];
    if (typeof s.soundOn !== 'boolean') s.soundOn = true;

    return s;
}

function save() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
        toast('本地存储空间不足');
    }
}

/* ==========================================================================
   4. URL 参数解析
   ========================================================================== */
function parseUrlParams() {
    try {
        const params = new URLSearchParams(location.search);
        const taskName = params.get('task');
        if (taskName) {
            let targetId = null;
            for (const id in state.tabs) {
                if (state.tabs[id].name === taskName) {
                    targetId = id; break;
                }
            }
            if (targetId) {
                state.activeTab = targetId;
            } else {
                const newId = 'custom_' + Date.now();
                const sourceStudents = state.tabs[DEFAULT_TABS[0].id]
                    ? JSON.parse(JSON.stringify(state.tabs[DEFAULT_TABS[0].id].students))
                    : createTab({id:newId,name:taskName}, DEFAULT_NAMES).students;
                state.tabs[newId] = {
                    id: newId, name: taskName, students: sourceStudents,
                    passed: {}, seq: 0
                };
                state.activeTab = newId;
            }
            save();
            history.replaceState({}, document.title, location.pathname);
        }
    } catch (e) {}
}

/* ==========================================================================
   5. 拼音排序
   ========================================================================== */
function detectPinyin() {
    try {
        if (window.pinyinPro && typeof window.pinyinPro.pinyin === 'function') {
            const r = window.pinyinPro.pinyin('张', { toneType: 'none', type: 'array' });
            if (Array.isArray(r) && r.length && /^[a-z]/i.test(r[0])) return true;
        }
    } catch (e) {}
    return false;
}

function fullPinyin(name) {
    if (pinyinCache.has(name)) return pinyinCache.get(name);
    let v = String(name).toLowerCase();
    if (pinyinReady) {
        try {
            const arr = window.pinyinPro.pinyin(name, { toneType: 'none', type: 'array' });
            if (Array.isArray(arr) && arr.length) v = arr.join('').toLowerCase();
        } catch (e) {}
    }
    pinyinCache.set(name, v);
    return v;
}

function sortPending(tab) {
    const pending = tab.students.filter(s => !tab.passed[s.id]);
    if (!pinyinReady) return pending;
    return pending.slice().sort((a, b) => {
        const pa = fullPinyin(a.name);
        const pb = fullPinyin(b.name);
        if (pa !== pb) return pa < pb ? -1 : 1;
        return a.id - b.id;
    });
}

/* ==========================================================================
   6. 点击特效合集
   ========================================================================== */
const fxLayer = document.createElement('div');
fxLayer.id = 'fxLayer';
document.body.appendChild(fxLayer);

function fxStars(x, y) {
    const n = 9;
    for (let i = 0; i < n; i++) {
        const el = document.createElement('div');
        el.className = 'fx-item';
        el.textContent = i % 2 ? '⭐' : '✨';
        el.style.left = x + 'px'; el.style.top  = y + 'px';
        el.style.fontSize = (14 + Math.random() * 14) + 'px';
        fxLayer.appendChild(el);
        const ang = (Math.PI * 2 / n) * i + Math.random() * 0.6;
        const dist = 55 + Math.random() * 55;
        el.animate([
            { transform: 'translate(-50%,-50%) scale(0) rotate(0deg)', opacity: 1 },
            { transform: `translate(calc(-50% + ${Math.cos(ang)*dist}px), calc(-50% + ${Math.sin(ang)*dist}px)) scale(1.25) rotate(${Math.random()*360}deg)`, opacity: 0 }
        ], { duration: 620 + Math.random() * 240, easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => el.remove();
    }
}

function fxHearts(x, y) {
    for (let i = 0; i < 6; i++) {
        const el = document.createElement('div');
        el.className = 'fx-item';
        el.textContent = i % 2 ? '💖' : '💕';
        el.style.left = (x + (Math.random() - .5) * 70) + 'px';
        el.style.top  = y + 'px';
        el.style.fontSize = (14 + Math.random() * 12) + 'px';
        fxLayer.appendChild(el);
        el.animate([
            { transform: 'translate(-50%,-50%) scale(0.3)', opacity: 0 },
            { transform: 'translate(-50%,-50%) scale(1)', opacity: 1, offset: .22 },
            { transform: `translate(calc(-50% + ${(Math.random()-.5)*46}px), calc(-50% - ${85 + Math.random()*65}px)) scale(0.75)`, opacity: 0 }
        ], { duration: 880 + Math.random() * 300, easing: 'ease-out', delay: i * 45 }).onfinish = () => el.remove();
    }
}

function fxConfetti(x, y) {
    const colors = ['#FF8FA3','#FFB86B','#FFD93D','#7ED9A0','#6EC6FF','#B39DDB'];
    for (let i = 0; i < 18; i++) {
        const el = document.createElement('div');
        el.className = 'fx-item';
        el.style.left = x + 'px'; el.style.top  = y + 'px';
        el.style.width  = (6 + Math.random() * 8) + 'px';
        el.style.height = (8 + Math.random() * 8) + 'px';
        el.style.background = colors[i % colors.length];
        el.style.borderRadius = Math.random() > .5 ? '3px' : '50%';
        fxLayer.appendChild(el);
        const ang = Math.random() * Math.PI * 2;
        const dist = 60 + Math.random() * 95;
        el.animate([
            { transform: 'translate(-50%,-50%) rotate(0deg)', opacity: 1 },
            { transform: `translate(calc(-50% + ${Math.cos(ang)*dist}px), calc(-50% + ${Math.sin(ang)*dist + 45}px)) rotate(${Math.random()*720}deg)`, opacity: 0 }
        ], { duration: 850 + Math.random() * 400, easing: 'cubic-bezier(.15,.7,.3,1)' }).onfinish = () => el.remove();
    }
}

function fxRipple(x, y) {
    const colors = ['#FF8FA3', '#FFB86B', '#7ED9A0'];
    for (let i = 0; i < 3; i++) {
        const el = document.createElement('div');
        el.className = 'fx-item';
        el.style.left = x + 'px'; el.style.top  = y + 'px';
        el.style.width  = '24px'; el.style.height = '24px';
        el.style.borderRadius = '50%';
        el.style.border = '4px solid ' + colors[i];
        fxLayer.appendChild(el);
        el.animate([
            { transform: 'translate(-50%,-50%) scale(0.4)', opacity: .9 },
            { transform: 'translate(-50%,-50%) scale(6)', opacity: 0 }
        ], { duration: 700, easing: 'ease-out', delay: i * 110 }).onfinish = () => el.remove();
    }
}

function fxSparkles(x, y) {
    for (let i = 0; i < 11; i++) {
        const el = document.createElement('div');
        el.className = 'fx-item';
        el.textContent = '✨';
        el.style.left = (x + (Math.random() - .5) * 105) + 'px';
        el.style.top  = (y + (Math.random() - .5) * 105) + 'px';
        el.style.fontSize = (12 + Math.random() * 14) + 'px';
        fxLayer.appendChild(el);
        el.animate([
            { transform: 'translate(-50%,-50%) scale(0) rotate(0deg)', opacity: 1 },
            { transform: 'translate(-50%,-50%) scale(1.2) rotate(200deg)', opacity: 0 }
        ], { duration: 480 + Math.random() * 320, easing: 'ease-out', delay: Math.random() * 110 }).onfinish = () => el.remove();
    }
}

function fxBounce(x, y, cardEl) {
    if (!cardEl) return;
    cardEl.animate([
        { transform: 'scale(1) rotate(0deg)' },
        { transform: 'scale(1.18) rotate(-4deg)', offset: .35 },
        { transform: 'scale(0.92) rotate(3deg)',  offset: .7 },
        { transform: 'scale(1) rotate(0deg)' }
    ], { duration: 430, easing: 'ease-out' });
}

function fxRainbow(x, y) {
    for (let i = 0; i < 2; i++) {
        const el = document.createElement('div');
        el.className = 'fx-item';
        el.style.left = x + 'px'; el.style.top  = y + 'px';
        el.style.width  = '34px'; el.style.height = '34px';
        el.style.borderRadius = '50%';
        el.style.background = 'conic-gradient(#FF8FA3,#FFB86B,#FFD93D,#7ED9A0,#6EC6FF,#B39DDB,#FF8FA3)';
        el.style.opacity = '.85';
        fxLayer.appendChild(el);
        el.animate([
            { transform: 'translate(-50%,-50%) scale(0.25) rotate(0deg)', opacity: .9 },
            { transform: 'translate(-50%,-50%) scale(4.5) rotate(200deg)', opacity: 0 }
        ], { duration: 800, easing: 'ease-out', delay: i * 150 }).onfinish = () => el.remove();
    }
}

function fxEmojiPop(x, y) {
    const emojis = ['😍', '🎉', '👍', '✨', '🌟', '🥳', '💯'];
    const el = document.createElement('div');
    el.className = 'fx-item';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = x + 'px'; el.style.top  = y + 'px';
    el.style.fontSize = '42px';
    fxLayer.appendChild(el);
    el.animate([
        { transform: 'translate(-50%,-50%) scale(0) rotate(-35deg)', opacity: 0 },
        { transform: 'translate(-50%,-50%) scale(1.5) rotate(6deg)', opacity: 1, offset: .35 },
        { transform: 'translate(-50%,-50%) scale(1) rotate(0deg)',   opacity: 1, offset: .68 },
        { transform: 'translate(-50%,-50%) scale(0.55) rotate(22deg)', opacity: 0 }
    ], { duration: 900, easing: 'ease-out' }).onfinish = () => el.remove();
}

function fxFirework(x, y) {
    for(let i=0; i<25; i++) {
        const el = document.createElement('div');
        el.className = 'fx-item';
        el.style.left = x + 'px'; el.style.top = y + 'px';
        el.style.width = '6px'; el.style.height = '6px';
        el.style.background = `hsl(${Math.random()*360}, 100%, 60%)`;
        el.style.borderRadius = '50%';
        el.style.boxShadow = '0 0 8px currentColor';
        fxLayer.appendChild(el);
        const ang = Math.random() * Math.PI * 2;
        const dist = 60 + Math.random() * 100;
        el.animate([
            { transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
            { transform: `translate(calc(-50% + ${Math.cos(ang)*dist}px), calc(-50% + ${Math.sin(ang)*dist}px)) scale(0)`, opacity: 0 }
        ], { duration: 700 + Math.random()*300, easing: 'ease-out' }).onfinish = () => el.remove();
    }
}

function fxEmojiRain(x, y) {
    const emojis = ['🎈','🍬','🌈','🌟','🎁','🍭'];
    for(let i=0; i<12; i++) {
        const el = document.createElement('div');
        el.className = 'fx-item';
        el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        el.style.left = (x + (Math.random()-0.5)*200) + 'px';
        el.style.top = '-40px';
        el.style.fontSize = (20 + Math.random()*20) + 'px';
        fxLayer.appendChild(el);
        el.animate([
            { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
            { transform: `translateY(${window.innerHeight + 80}px) rotate(${Math.random()*360}deg)`, opacity: 0.8 }
        ], { duration: 1200 + Math.random()*800, easing: 'linear', delay: Math.random()*300 }).onfinish = () => el.remove();
    }
}

function fxTextPop(x, y) {
    const words = ['太棒了', '真厉害', '666', '满分', '优秀', '漂亮'];
    const el = document.createElement('div');
    el.className = 'fx-item';
    el.textContent = words[Math.floor(Math.random()*words.length)];
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.fontSize = '32px'; el.style.fontWeight = '900';

    el.style.textShadow = '2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff';
    fxLayer.appendChild(el);
    el.animate([
        { transform: 'translate(-50%,-50%) scale(0.2)', opacity: 0 },
        { transform: 'translate(-50%,-50%) scale(1.2)', opacity: 1, offset: .4 },
        { transform: 'translate(-50%,-50%) scale(1)', opacity: 1, offset: .6 },
        { transform: 'translate(-50%, -150%) scale(0.9)', opacity: 0 }
    ], { duration: 1000, easing: 'ease-out' }).onfinish = () => el.remove();
}

function fxBubble(x, y) {
    for(let i=0; i<8; i++) {
        const el = document.createElement('div');
        el.className = 'fx-item';
        el.style.left = (x + (Math.random()-0.5)*100) + 'px';
        el.style.top = y + 'px';
        const size = 10 + Math.random()*25;
        el.style.width = size + 'px'; el.style.height = size + 'px';
