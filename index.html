<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>班级打卡 · 谁还没交一眼看清</title>

<!-- 拼音库：异步加载，失败自动回退 -->
<script async src="https://cdn.jsdelivr.net/npm/pinyin-pro@3/dist/index.js" onload="window.__pyLoadOk=true" onerror="window.__pyLoadFail=true"></script>
<!-- 二维码生成库 -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
/* ==========================================================================
   1. 设计变量 —— 糖果暖色系
   ========================================================================== */
:root{
    --bg:         #FFF9F3;
    --ink:        #5A4A42;
    --ink-soft:   #8A7568;
    --muted:      #B3A094;

    --pink:       #FF8FA3;
    --pink-soft:  #FFD9E0;
    --orange:     #FFB86B;
    --green:      #7ED9A0;
    --green-soft: #E2F8EA;

    --card:       #FFFFFF;
    --line:       #F2E8DE;
    --danger:     #E5674E;

    --radius:     18px;
    --shadow:     0 2px 6px rgba(255,143,163,.10), 0 6px 18px rgba(255,143,163,.08);
    --shadow-sm:  0 1px 3px rgba(140,110,90,.10);
}

/* ==========================================================================
   2. 基础重置
   ========================================================================== */
*{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

html, body{
    height: 100%;
    overflow: hidden;
}

body{
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB",
                 "Source Han Sans SC", "Noto Sans CJK SC", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-font-smoothing: antialiased;
    background-color: var(--bg);
    background-image:
        radial-gradient(circle at 8% 12%,  rgba(255,214,224,.55) 0%, transparent 38%),
        radial-gradient(circle at 92% 14%, rgba(255,228,196,.45) 0%, transparent 34%),
        radial-gradient(circle at 88% 88%, rgba(201,228,255,.45) 0%, transparent 38%),
        radial-gradient(circle at 12% 92%, rgba(214,245,214,.40) 0%, transparent 34%);
    background-attachment: fixed;
}

button, input, textarea{
    font-family: inherit;
    color: inherit;
    -webkit-user-select: auto;
    user-select: auto;
}

button{
    border: none;
    background: none;
    cursor: pointer;
    touch-action: manipulation;
}

/* ==========================================================================
   3. 整体骨架
   ========================================================================== */
.app{
    width: 100%;
    max-width: 1920px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px 14px 12px;
    overflow: hidden;
}

/* ---------- 3.1 顶栏 ---------- */
.topbar{
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 48px;
}

.tabs-wrap{
    flex: none;
    display: flex;
    gap: 5px;
    align-items: center;
}
.tabs{
    display: flex;
    gap: 4px;
    padding: 4px;
    background: #FFF1E6;
    border-radius: 16px;
    box-shadow: inset 0 1px 2px rgba(255,184,107,.18);
    overflow-x: auto;
    scrollbar-width: none;
    max-width: 60vw;
}
.tabs::-webkit-scrollbar{ display: none; }

.tab{
    height: 42px;
    padding: 0 20px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 800;
    color: var(--muted);
    letter-spacing: .5px;
    transition: background .18s ease, color .18s ease, transform .12s ease;
    white-space: nowrap;
}
.tab:active{ transform: scale(.95); }
.tab.active{
    background: linear-gradient(135deg, #FF9FAE 0%, #FF8FA3 100%);
    color: #fff;
    box-shadow: 0 3px 10px rgba(255,143,163,.40);
}

.add-tab-btn{
    width: 42px;
    height: 42px;
    flex: none;
    border-radius: 12px;
    background: #FFF1E6;
    color: var(--pink);
    font-size: 22px;
    font-weight: bold;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-sm);
}
.add-tab-btn:active{ transform: scale(.92); }

.progress-wrap{
    flex: 1;
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    padding: 0 6px;
}

.prog-text{
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .5px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
}
.prog-text .num{ color: var(--pink); font-size: 24px; }

.prog-bar{
    flex: 1;
    min-width: 60px;
    height: 16px;
    background: #FFEBE0;
    border-radius: 99px;
    overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(255,143,163,.15);
}
.prog-fill{
    height: 100%;
    width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, #FFB86B 0%, #FF8FA3 60%, #FF7E96 100%);
    transition: width .5s cubic-bezier(.34,.9,.32,1);
    box-shadow: 0 0 8px rgba(255,143,163,.5);
}

.icon-btn{
    flex: none;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: #fff;
    box-shadow: var(--shadow-sm);
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .12s ease, background .18s ease;
}
.icon-btn:active{ transform: scale(.9); }
.icon-btn.off{ background: #F5ECE4; opacity: .7; }

/* ---------- 3.2 棋盘：左右两列 ---------- */
.board{
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 12px;
    flex-direction: row;
}

.column{
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    border-radius: 24px;
    padding: 10px 12px 12px;
    transition: background .2s ease;
}

.pending-col{
    background: #FFFFFF;
    box-shadow: inset 0 0 0 2.5px #FFE3E9, 0 6px 20px rgba(255,143,163,.10);
}
.passed-col{
    background: #F4FCF6;
    box-shadow: inset 0 0 0 2.5px #CFF0D9, 0 6px 20px rgba(126,217,160,.12);
}

.col-head{
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 6px 8px;
    margin-bottom: 6px;
    border-bottom: 2px dashed;
}
.pending-col .col-head{ border-color: #FFE3E9; }
.passed-col .col-head{ border-color: #D6F0DE; }

.col-title{
    font-size: 16px;
    font-weight: 800;
    letter-spacing: .5px;
    display: flex;
    align-items: center;
    gap: 6px;
}
.pending-col .col-title{ color: #E76B87; }
.passed-col .col-title{ color: #3E9E68; }

.col-count{
    font-size: 15px;
    font-weight: 800;
    padding: 2px 12px;
    border-radius: 99px;
    font-variant-numeric: tabular-nums;
}
.pending-col .col-count{ background: #FFE9EE; color: #E76B87; }
.passed-col .col-count{ background: #D8F4E1; color: #3E9E68; }

/* 网格 */
.grid{
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
    gap: 8px;
    align-content: start;
    padding: 2px;
    scrollbar-width: none;
}
.grid::-webkit-scrollbar{ display: none; }

/* ---------- 3.3 卡片（变大版） ---------- */
.card{
    position: relative;
    height: 92px;
    border-radius: 20px;
    background: var(--card);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 8px 6px;
    transition: transform .12s ease, box-shadow .16s ease;
    will-change: transform;
    overflow: hidden;
}
.card:active{ transform: scale(.93); }

.card::before{
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: var(--stripe, #FFD9E0);
    opacity: .9;
}

.avatar{
    width: 40px;
    height: 40px;
    border-radius: 50%;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    overflow: hidden;
    background: #FFD9E0;
    box-shadow: inset 0 -2px 4px rgba(0,0,0,.06);
}
.avatar img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.avatar.txt{
    color: #6A5548;
    font-size: 18px;
    letter-spacing: 0;
}

.cname{
    font-size: 17px;
    font-weight: 800;
    color: var(--ink);
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    letter-spacing: .2px;
}
.cname.long{ font-size: 14px; }

.passed-col .card{
    height: 82px;
    background: #FFFFFF;
    box-shadow: 0 1px 3px rgba(126,217,160,.18), 0 3px 10px rgba(126,217,160,.10);
}
.passed-col .card::before{ background: var(--green); height: 4px; }
.passed-col .avatar{ width: 34px; height: 34px; font-size: 17px; }
.passed-col .cname{ font-size: 15px; color: #3E7A55; }
.passed-col .cname.long{ font-size: 13px; }

body.edit-mode .pending-col .card{
    box-shadow: 0 0 0 3px var(--orange), var(--shadow);
}
body.edit-mode .passed-col .card{
    box-shadow: 0 0 0 3px var(--orange), var(--shadow-sm);
}

.empty-tip{
    grid-column: 1 / -1;
    padding: 48px 12px;
    text-align: center;
    color: var(--muted);
    font-size: 16px;
    font-weight: 700;
    line-height: 1.8;
}
.empty-tip .big{ font-size: 40px; display: block; margin-bottom: 8px; }

/* ---------- 3.4 右侧底部区域（时钟 & 麦克风） ---------- */
.right-dash{
    flex: none;
    margin-top: 10px;
    background: rgba(255,255,255,0.6);
    border-radius: 18px;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-sm);
    border: 1px solid #E6F6EC;
}

.big-clock{
    font-size: 54px;
    font-weight: 900;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    line-height: 1;
    text-shadow: 0 2px 4px rgba(90,74,66,.1);
}

.mic-box{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}
.mic-btn{
    background: #FFF1E6;
    color: #C97B4E;
    font-size: 15px;
    font-weight: 800;
    padding: 8px 16px;
    border-radius: 12px;
    transition: all .2s;
}
.mic-btn.active{
    background: linear-gradient(135deg, #FF9FAE 0%, #FF8FA3 100%);
    color: #fff;
    box-shadow: 0 3px 10px rgba(255,143,163,.4);
}
.wave-bars{
    display: flex;
    gap: 5px;
    height: 36px;
    align-items: flex-end;
}
.wave-bar{
    width: 8px;
    height: 10%;
    background: var(--pink);
    border-radius: 4px;
    transition: height 0.08s ease-out;
}

/* ---------- 3.5 底部工具栏 ---------- */
.bottombar{
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
}

.tb{
    height: 50px;
    padding: 0 22px;
    border-radius: 15px;
    background: #fff;
    box-shadow: var(--shadow-sm);
    font-size: 16px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: .3px;
    white-space: nowrap;
    transition: transform .12s ease, background .16s ease;
}
.tb:active{ transform: scale(.95); }
.tb.primary{
    background: linear-gradient(135deg, #FF9FAE 0%, #FF8FA3 100%);
    color: #fff;
    box-shadow: 0 3px 12px rgba(255,143,163,.40);
}
.tb.more{
    width: 50px;
    padding: 0;
    font-size: 24px;
    margin-left: auto;
    line-height: 1;
}

/* ==========================================================================
   4. 点击特效层
   ========================================================================== */
#fxLayer{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    overflow: hidden;
}

.fx-item{
    position: fixed;
    pointer-events: none;
    will-change: transform, opacity;
    font-size: 20px;
    line-height: 1;
    z-index: 9999;
}

/* ==========================================================================
   5. 弹窗通用
   ========================================================================== */
.modal{
    position: fixed;
    inset: 0;
    background: rgba(90,74,66,.42);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
}
.modal.active{ display: flex; }

.modal-card{
    width: 100%;
    max-width: 520px;
    max-height: 88vh;
    background: #fff;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 24px 70px rgba(90,74,66,.32);
    animation: popIn .22s cubic-bezier(.2,1.2,.4,1);
}
@keyframes popIn{
    from{ transform: scale(.94); opacity: 0; }
    to  { transform: scale(1);   opacity: 1; }
}

.modal-head{
    flex: none;
    padding: 18px 20px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}
.modal-head h3{
    font-size: 18px;
    font-weight: 800;
    letter-spacing: .3px;
    color: var(--ink);
}
.modal-head .x{
    width: 40px;
    height: 40px;
    flex: none;
    border-radius: 50%;
    background: #FFF1E6;
    color: var(--ink-soft);
    font-size: 22px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-body{
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 4px 20px 16px;
    -webkit-overflow-scrolling: touch;
}

.modal-foot{
    flex: none;
    display: flex;
    gap: 10px;
    padding: 12px 20px 18px;
    border-top: 1px solid var(--line);
}

.btn-main, .btn-ghost{
    flex: 1;
    height: 50px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: .3px;
}
.btn-main{
    background: linear-gradient(135deg, #FF9FAE 0%, #FF8FA3 100%);
    color: #fff;
    box-shadow: 0 3px 10px rgba(255,143,163,.35);
}
.btn-ghost{ background: #FFF1E6; color: var(--ink); }
.btn-main:active, .btn-ghost:active{ transform: scale(.98); }

.field{ margin-bottom: 14px; }
.field label{
    display: block;
    font-size: 14px;
    font-weight: 800;
    color: var(--ink-soft);
    margin-bottom: 6px;
    letter-spacing: .3px;
}
.field input[type=text],
.field input[type=date],
.field textarea{
    width: 100%;
    padding: 12px 14px;
    border: 2px solid var(--line);
    border-radius: 13px;
    font-size: 16px;
    background: #FFFCF9;
    outline: none;
    transition: border-color .16s ease;
}
.field input:focus, .field textarea:focus{ border-color: var(--pink); }
.field textarea{ resize: vertical; min-height: 90px; line-height: 1.5; }

/* ==========================================================================
   6. 菜单弹层
   ========================================================================== */
.menu{
    position: fixed;
    inset: 0;
    background: rgba(90,74,66,.32);
    display: none;
    z-index: 90;
}
.menu.active{ display: block; }

.menu-panel{
    position: absolute;
    right: 14px;
    bottom: 76px;
    width: 244px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 18px 50px rgba(90,74,66,.32);
    padding: 8px;
    overflow: hidden;
    animation: menuIn .18s cubic-bezier(.2,1.1,.4,1);
}
@keyframes menuIn{
    from{ transform: translateY(10px) scale(.96); opacity: 0; }
    to  { transform: translateY(0) scale(1); opacity: 1; }
}

.menu-item{
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    height: 50px;
    padding: 0 14px;
    border-radius: 13px;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    overflow: hidden;
    text-align: left;
}
.menu-item:active{ background: #FFF1E6; }
.menu-item .ico{
    width: 22px;
    font-size: 18px;
    text-align: center;
    flex: none;
}
.menu-item.danger{ color: var(--danger); }

.reset-fill{
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 0%;
    background: #FDE6E1;
    pointer-events: none;
    transition: width .1s linear;
}
.menu-item.pressing .reset-fill{
    width: 100%;
    transition: width 1.5s linear;
}
.menu-item > *:not(.reset-fill){ position: relative; z-index: 1; }

/* ==========================================================================
   7. 名单编辑
   ========================================================================== */
.roster-list{
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 10px;
}
.roster-row{
    display: flex;
    gap: 6px;
    align-items: center;
}
.roster-row input{
    height: 44px;
    padding: 0 10px;
    border: 2px solid var(--line);
    border-radius: 11px;
    font-size: 15px;
    background: #FFFCF9;
    outline: none;
    min-width: 0;
}
.roster-row input:focus{ border-color: var(--pink); }
.roster-row .ri-sid{ width: 66px; text-align: center; flex: none; font-variant-numeric: tabular-nums; }
.roster-row .ri-name{ flex: 1; }
.roster-row .del{
    width: 44px;
    height: 44px;
    flex: none;
    border-radius: 11px;
    background: #FDEDEA;
    color: var(--danger);
    font-size: 22px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
}

.add-row{
    width: 100%;
    height: 48px;
    border-radius: 13px;
    background: #FFF1E6;
    color: #C97B4E;
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 14px;
}

.bulk-box{
    background: #FFFAF5;
    border-radius: 13px;
    padding: 12px;
    margin-bottom: 6px;
    border: 1.5px dashed #FFE3C4;
}
.bulk-box summary{
    font-size: 14px;
    font-weight: 800;
    color: #C97B4E;
    cursor: pointer;
    outline: none;
    margin-bottom: 2px;
}
.bulk-box textarea{
    width: 100%;
    min-height: 120px;
    margin-top: 10px;
    padding: 10px;
    border: 2px solid var(--line);
    border-radius: 11px;
    font-size: 15px;
    line-height: 1.6;
    background: #fff;
    outline: none;
    resize: vertical;
}
.bulk-box button{
    margin-top: 8px;
    height: 44px;
    padding: 0 20px;
    border-radius: 11px;
    background: linear-gradient(135deg, #FF9FAE 0%, #FF8FA3 100%);
    color: #fff;
    font-size: 15px;
    font-weight: 800;
}

/* ==========================================================================
   8. 记录 / 历史 / 头像 / 备份
   ========================================================================== */
.report-box{
    background: #FFFAF5;
    border-radius: 16px;
    padding: 16px;
}
.report-title{
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 10px;
}
.report-meta{
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.8;
    padding-bottom: 10px;
    border-bottom: 2px dashed var(--line);
    margin-bottom: 12px;
}
.report-meta b{ color: var(--ink); font-weight: 800; }

.report-sec{ margin-bottom: 14px; }
.report-sec h4{
    font-size: 14px;
    font-weight: 800;
    margin-bottom: 8px;
    letter-spacing: .3px;
}
.report-sec.ok h4{ color: #3E9E68; }
.report-sec.no h4{ color: #E76B87; }
.tags{ display: flex; flex-wrap: wrap; gap: 6px; }
.tag{
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    background: #F4ECE4;
    color: var(--ink);
}
.report-sec.ok .tag{ background: #E2F8EA; color: #3E8A5C; }
.report-sec.no .tag{ background: #FFE9EE; color: #D9567A; }
.tag img{ width: 18px; height: 18px; border-radius: 50%; object-fit: cover; }

/* 历史 */
.his-row{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 6px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background .2s;
    border-radius: 8px;
}
.his-row:active{ background: #FFF1E6; }
.his-row:last-child{ border-bottom: none; }
.his-date{
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    width: 85px;
    flex: none;
}
.his-name{
    flex: 1;
    font-size: 16px;
    font-weight: 800;
    min-width: 0;

<script>
(function () {
'use strict';

/* ==========================================================================
   1. 常量与数据结构
   ========================================================================== */
const STORAGE_KEY  = 'daka_v5';
const DATA_VERSION = 5;

const DEFAULT_TABS = [
    { id: 'morning',    name: '早读' },
    { id: 'homework',   name: '作业' },
    { id: 'recitation', name: '背诵' }
];

const DEFAULT_NAMES = [
    '郭津杭', '李思蕊', '刘承晔', '刘恩山', '刘翰璋',
    '刘昊哲', '刘铭浩', '刘依牧', '刘怡甯', '刘羽默',
    '刘振凯', '刘子霖', '刘梓颖桦', '王溪芮', '许钰涵',
    '杨淇淋', '杨熙硕', '杨惜雅', '张晨旭', '张美兰',
    '张恬伊', '张熙若霖', '张栩飒', '张钰澍', '张悦晴',
    '张运达', '张泽航', '张梓栋', '张梓濠'
];

const EMOJIS = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮',
                '🐷','🐸','🐵','🐔','🐧','🐦','🐤','🦄','🐝','🦋','🐞','🐢',
                '🐬','🐳','🦖','🦕','🐙','🦉'];

const CANDY = [
    '#FFB3C1', '#FFC98F', '#FFE08A', '#9BE3B4',
    '#9CCEFF', '#C6B2F0', '#8FE0D8', '#FF9E9E'
];

let state = null;
let pinyinReady = false;
const pinyinCache = new Map();
const undoStack = [];
let editMode = false;
let editingStudentId = null;
let audioCtx = null;

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

const elPendingGrid = $('#pendingGrid');
const elPassedGrid  = $('#passedGrid');
const elPendingCnt  = $('#pendingCount');
const elPassedCnt   = $('#passedCount');
const elProgText    = $('#progText');
const elProgFill    = $('#progFill');
const elBigClock    = $('#bigClock');
const elTabs        = $('#tabs');
const elSoundBtn    = $('#soundBtn');

/* ==========================================================================
   2. 通用工具
   ========================================================================== */
function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' +
           String(d.getMonth() + 1).padStart(2, '0') + '-' +
           String(d.getDate()).padStart(2, '0');
}

function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

let toastTimer = null;
function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

function reduceMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function openModal(id)  { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

function currentTab() {
    return state.tabs[state.activeTab] || Object.values(state.tabs)[0];
}

function candyOf(id) {
    return CANDY[(Math.max(1, id) - 1) % CANDY.length];
}

/* ==========================================================================
   3. 状态初始化 / 持久化
   ========================================================================== */
function createTab(def, names) {
    return {
        id: def.id,
        name: def.name,
        students: names.map((n, i) => ({
            id: i + 1,
            name: n,
            sid: String(i + 1).padStart(2, '0'),
            avatarType: 'text',
            avatarData: ''
        })),
        passed: {},
        seq: 0
    };
}

function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
    } catch (e) { return null; }
}

function initState() {
    let s = loadState();

    if (!s || !s.tabs) {
        s = {
            version: DATA_VERSION,
            activeTab: DEFAULT_TABS[0].id,
            soundOn: true,
            date: todayStr(),
            tabs: {},
            history: []
        };
        DEFAULT_TABS.forEach(def => { s.tabs[def.id] = createTab(def, DEFAULT_NAMES); });
    }

    // 补齐结构
    Object.keys(s.tabs).forEach(k => {
        const t = s.tabs[k];
        if (!t.passed) t.passed = {};
        if (typeof t.seq !== 'number') t.seq = 0;
        if (!Array.isArray(t.students)) t.students = [];
    });

    // 跨天自动清空
    if (s.date !== todayStr()) {
        s.date = todayStr();
        Object.keys(s.tabs).forEach(k => {
            s.tabs[k].passed = {};
            s.tabs[k].seq = 0;
        });
    }

    if (!s.tabs[s.activeTab]) s.activeTab = Object.keys(s.tabs)[0];
    if (!Array.isArray(s.history)) s.history = [];
    if (typeof s.soundOn !== 'boolean') s.soundOn = true;

    return s;
}

function save() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
        toast('本地存储空间不足');
    }
}

/* ==========================================================================
   4. URL 参数解析
   ========================================================================== */
function parseUrlParams() {
    try {
        const params = new URLSearchParams(location.search);
        const taskName = params.get('task');
        if (taskName) {
            let targetId = null;
            for (const id in state.tabs) {
                if (state.tabs[id].name === taskName) {
                    targetId = id; break;
                }
            }
            if (targetId) {
                state.activeTab = targetId;
            } else {
                const newId = 'custom_' + Date.now();
                const sourceStudents = state.tabs[DEFAULT_TABS[0].id] 
                    ? JSON.parse(JSON.stringify(state.tabs[DEFAULT_TABS[0].id].students))
                    : createTab({id:newId,name:taskName}, DEFAULT_NAMES).students;
                state.tabs[newId] = {
                    id: newId, name: taskName, students: sourceStudents,
                    passed: {}, seq: 0
                };
                state.activeTab = newId;
            }
            save();
            history.replaceState({}, document.title, location.pathname);
        }
    } catch (e) {}
}

/* ==========================================================================
   5. 拼音排序
   ========================================================================== */
function detectPinyin() {
    try {
        if (window.pinyinPro && typeof window.pinyinPro.pinyin === 'function') {
            const r = window.pinyinPro.pinyin('张', { toneType: 'none', type: 'array' });
            if (Array.isArray(r) && r.length && /^[a-z]/i.test(r[0])) return true;
        }
    } catch (e) {}
    return false;
}

function fullPinyin(name) {
    if (pinyinCache.has(name)) return pinyinCache.get(name);
    let v = String(name).toLowerCase();
    if (pinyinReady) {
        try {
            const arr = window.pinyinPro.pinyin(name, { toneType: 'none', type: 'array' });
            if (Array.isArray(arr) && arr.length) v = arr.join('').toLowerCase();
        } catch (e) {}
    }
    pinyinCache.set(name, v);
    return v;
}

function sortPending(tab) {
    const pending = tab.students.filter(s => !tab.passed[s.id]);
    if (!pinyinReady) return pending;
    return pending.slice().sort((a, b) => {
        const pa = fullPinyin(a.name);
        const pb = fullPinyin(b.name);
        if (pa !== pb) return pa < pb ? -1 : 1;
        return a.id - b.id;
    });
}

/* ==========================================================================
   6. 点击特效合集（共 14 种）
   ========================================================================== */
const fxLayer = document.createElement('div');
fxLayer.id = 'fxLayer';
document.body.appendChild(fxLayer);

// 1. 星星四散
function fxStars(x, y) {
    const n = 9;
    for (let i = 0; i < n; i++) {
        const el = document.createElement('div');
        el.className = 'fx-item';
        el.textContent = i % 2 ? '⭐' : '✨';
        el.style.left = x + 'px'; el.style.top  = y + 'px';

/* ==========================================================================
   7. 麦克风音浪控制
   ========================================================================== */
let micStream = null;
let audioAnalyser = null;
let micDataArray = null;
let micRaf = null;

function toggleMic() {
    const btn = $('#micBtn');
    if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
        if (micRaf) cancelAnimationFrame(micRaf);
        btn.textContent = '🎤 开启音浪';
        btn.classList.remove('active');
        document.querySelectorAll('.wave-bar').forEach(b => b.style.height = '10%');
        return;
    }
    
    if (location.protocol === 'file:') {
        toast('本地文件无法使用麦克风，请部署到网上(HTTPS)后使用');
        return;
    }

    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        micStream = stream;
        const ctx = getAudioCtx();
        const source = ctx.createMediaStreamSource(stream);
        audioAnalyser = ctx.createAnalyser();
        audioAnalyser.fftSize = 256;
        source.connect(audioAnalyser);
        micDataArray = new Uint8Array(audioAnalyser.frequencyBinCount);
        
        btn.textContent = '⏹ 关闭音浪';
        btn.classList.add('active');
        
        updateWave();
    }).catch(err => {
        console.error(err);
        toast('无法访问麦克风：' + (err.message || '请检查权限'));
    });
}

function updateWave() {
    if (!audioAnalyser) return;
    audioAnalyser.getByteFrequencyData(micDataArray);
    let sum = 0;
    // 取人声主要频段
    for (let i = 0; i < 30; i++) {
        sum += micDataArray[i];
    }
    let vol = sum / 30; // 0 ~ 255
    
    const bars = document.querySelectorAll('.wave-bar');
    bars.forEach((bar, i) => {
        let h = 10 + (vol / 255) * 90 * (0.6 + Math.random()*0.6);
        if (h > 100) h = 100;
        bar.style.height = h + '%';
    });
    
    micRaf = requestAnimationFrame(updateWave);
}

function renderTabs() {
    const frag = document.createDocumentFragment();

}

function renderProgress() {

    elProgText.innerHTML = '已交 <span class="num">' + done + '</span> / ' + total;

function makeAvatarEl(student) {
    const box = document.createElement('div');
    box.className = 'avatar';

    if (student.avatarType === 'image' && student.avatarData) {
        const img = document.createElement('img');
        img.src = student.avatarData;
        img.alt = '';
        img.onerror = function () {
            this.remove();
            box.textContent = student.name.charAt(0);
            box.classList.add('txt');
            box.style.background = candyOf(student.id);
        };
        box.appendChild(img);
        return box;
    }

    if (student.avatarType === 'emoji' && student.avatarData) {
        box.style.background = candyOf(student.id);
        box.style.fontSize = '22px';
        box.textContent = student.avatarData;
        return box;
    }

    box.classList.add('txt');
    box.style.background = candyOf(student.id);
    box.textContent = student.name.charAt(0);
    return box;
}

function makeCard(student, isPassed) {
    const btn = document.createElement('button');
    btn.className = 'card';
    btn.type = 'button';
    btn.dataset.id = student.id;
    btn.style.setProperty('--stripe', candyOf(student.id));

    btn.appendChild(makeAvatarEl(student));

    const nm = document.createElement('span');
    nm.className = 'cname' + (student.name.length >= 5 ? ' long' : '');
    nm.textContent = student.name;
    btn.appendChild(nm);

    btn.addEventListener('click', () => {
        if (editMode) openAvatarModal(student.id);

        else setPassed(student.id, true);
    });

    return btn;
}

function renderPending() {
    const tab = currentTab();
    const list = sortPending(tab);

    elPendingGrid.innerHTML = '';
    elPendingCnt.textContent = list.length;

    if (list.length === 0) {
        const tip = document.createElement('div');
        tip.className = 'empty-tip';
        if (tab.students.length === 0) {
            tip.innerHTML = '<span class="big">📝</span>名单还是空的<br>去「⋯ → 名单管理」添加学生吧';
        } else {
            tip.innerHTML = '<span class="big">🎉</span>全部交齐啦！';
        }
        elPendingGrid.appendChild(tip);
        return;
    }

    const frag = document.createDocumentFragment();
    list.forEach(s => frag.appendChild(makeCard(s, false)));

function renderPassed() {
    const tab = currentTab();
    const list = tab.students
        .filter(s => tab.passed[s.id])
        .sort((a, b) => (tab.passed[a.id].seq || 0) - (tab.passed[b.id].seq || 0));

    elPassedGrid.innerHTML = '';
    elPassedCnt.textContent = list.length;

    if (list.length === 0) {
        const tip = document.createElement('div');
        tip.className = 'empty-tip';
        tip.innerHTML = '<span class="big">🍬</span>还没有人交呢';
        elPassedGrid.appendChild(tip);
        return;
    }

    const frag = document.createDocumentFragment();
    list.forEach(s => frag.appendChild(makeCard(s, true)));
    elPassedGrid.appendChild(frag);
}

function render() {
    renderTabs();
    renderProgress();
    renderPending();
    renderPassed();
}

/* ==========================================================================
   9. 打卡核心 + FLIP
   ========================================================================== */
function pushUndo(tab) {
    undoStack.push({
        tabId: tab.id,
        passed: JSON.parse(JSON.stringify(tab.passed)),
        seq: tab.seq
    });
    if (undoStack.length > 60) undoStack.shift();
}

function setPassed(id, passed) {
    const tab = currentTab();
    const fromEl = passed
        ? elPendingGrid.querySelector('.card[data-id="' + id + '"]')
        : elPassedGrid.querySelector('.card[data-id="' + id + '"]');
    const fromRect = fromEl ? fromEl.getBoundingClientRect() : null;
    const cx = fromRect ? fromRect.left + fromRect.width / 2 : window.innerWidth / 2;
    const cy = fromRect ? fromRect.top + fromRect.height / 2 : window.innerHeight / 2;

    pushUndo(tab);

    if (passed) {
        if (!tab.passed[id]) {
            tab.seq += 1;
            tab.passed[id] = { time: Date.now(), seq: tab.seq };
        }
    } else {
        delete tab.passed[id];
    }

    const allDone = tab.students.length > 0 && tab.students.every(s => tab.passed[s.id]);
    save();

    renderProgress();
    renderPending();
    renderPassed();

    const toEl = passed
        ? elPassedGrid.querySelector('.card[data-id="' + id + '"]')
        : elPendingGrid.querySelector('.card[data-id="' + id + '"]');

    if (fromRect && toEl && !reduceMotion()) {
        const toRect = toEl.getBoundingClientRect();
        if (toRect.width && toRect.height) {
            const dx = fromRect.left - toRect.left;
            const dy = fromRect.top  - toRect.top;
            const sx = fromRect.width  / toRect.width;
            const sy = fromRect.height / toRect.height;
            try {
                toEl.animate([
                    { transform: `translate(${dx}px,${dy}px) scale(${sx},${sy})`, opacity: .92 },
                    { transform: 'translate(0,0) scale(1,1)', opacity: 1 }
                ], { duration: 460, easing: 'cubic-bezier(.22,.9,.3,1)' });
            } catch (e) {}
        }
    }

    if (passed) {
        spawnEffect(cx, cy, fromEl);
        playDing();
        if (allDone) setTimeout(playFanfare, 380);
    } else {
        fxRipple(cx, cy);
    }
}

function switchTab(tabId) {
    if (state.activeTab === tabId) return;
    if (!state.tabs[tabId]) return;
    state.activeTab = tabId;
    save();
    render();
}

function undo() {
    const last = undoStack.pop();
    if (!last) { toast('没有可以撤销的操作了'); return; }
    const tab = state.tabs[last.tabId];
    if (!tab) return;
    if (state.activeTab !== last.tabId) state.activeTab = last.tabId;
    tab.passed = last.passed;
    tab.seq = last.seq;
    save();
    render();
    toast('已撤销');
}

/* ==========================================================================
   10. 音效
   ========================================================================== */
function getAudioCtx() {
    if (audioCtx) {
        if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        return audioCtx;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { audioCtx = new AC(); } catch (e) { return null; }
    return audioCtx;
}

function playDing() {
    if (!state.soundOn) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const t = ctx.currentTime;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(880, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.30, t + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.33);
}

function playFanfare() {
    if (!state.soundOn) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const notes = [523.25, 659.25, 783.99];
    const t0 = ctx.currentTime;
    notes.forEach((freq, i) => {
        const t = t0 + i * 0.14;
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.24, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t + 0.45);
    });
}

function updateRosterNumbers() {
    $$('#rosterList .roster-row').forEach((row, i) => {
        const sid = row.querySelector('.ri-sid');
        if (sid && !sid.value.trim()) sid.value = String(i + 1).padStart(2, '0');
    });
}

function saveRoster() {
    const tab = currentTab();
    const rows = $$('#rosterList .roster-row');
    if (rows.length === 0 && !confirm('名单将变为空，确定吗？')) return;

    const oldById = new Map(tab.students.map(s => [s.id, s]));
    const newStudents = [];
    const usedNames = new Set();
    let maxId = 0;
    tab.students.forEach(s => { if (s.id > maxId) maxId = s.id; });

    rows.forEach((row, i) => {
        const nameInput = row.querySelector('.ri-name');
        const sidInput  = row.querySelector('.ri-sid');
        const name = (nameInput.value || '').trim();
        if (!name) return;

        let finalName = name, n = 2;
        while (usedNames.has(finalName)) { finalName = name + '(' + n + ')'; n++; }
        usedNames.add(finalName);

        const rawId = row.dataset.id;
        let student;

        if (rawId && oldById.has(Number(rawId))) {
            student = Object.assign({}, oldById.get(Number(rawId)));
            student.name = finalName;
        } else {
            maxId += 1;
            student = { id: maxId, name: finalName, sid: '', avatarType: 'text', avatarData: '' };
        }
        student.id = Number(student.id);
        student.sid = (sidInput.value || '').trim() || String(i + 1).padStart(2, '0');
        newStudents.push(student);
    });

    const keepIds = new Set(newStudents.map(s => s.id));
    Object.keys(tab.passed).forEach(k => { if (!keepIds.has(Number(k))) delete tab.passed[k]; });

    tab.students = newStudents;
    save(); render(); closeModal('rosterModal'); toast('名单已保存');
}

function bulkImport() {
    const text = $('#bulkInput').value;
    const lines = text.split('\n').map(l => l.trim()).filter(l => l !== '');
    if (lines.length === 0) { toast('请先粘贴名单'); return; }
    if (lines.length > 100) { toast('一次最多导入 100 人'); return; }

    const box = $('#rosterList');
    box.innerHTML = '';
    const frag = document.createDocumentFragment();

    lines.forEach((line, i) => {
        let sid = '', name = line;
        const m = line.match(/^(\d{1,4})\s*[\.、,，:：\s]\s*(.+)$/);
        if (m) { sid = m[1]; name = m[2].trim(); }

        const row = document.createElement('div');
        row.className = 'roster-row';

        const sidInput = document.createElement('input');
        sidInput.type = 'text'; sidInput.className = 'ri-sid';
        sidInput.value = sid || String(i + 1).padStart(2, '0');
        sidInput.maxLength = 6;

        const nameInput = document.createElement('input');
        nameInput.type = 'text'; nameInput.className = 'ri-name';
        nameInput.value = name; nameInput.maxLength = 12;

        const del = document.createElement('button');
        del.className = 'del'; del.type = 'button'; del.textContent = '×';
        del.addEventListener('click', () => { row.remove(); updateRosterNumbers(); });

        row.appendChild(sidInput); row.appendChild(nameInput); row.appendChild(del);
        frag.appendChild(row);
    });

    box.appendChild(frag);
    $('#bulkInput').value = '';
    toast('已导入 ' + lines.length + ' 人，记得点保存');
}

function handleAvatarFile(event) {
    const input = event.target;
    const file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    if (!file.type || file.type.indexOf('image/') !== 0) { toast('请选择图片文件'); return; }

    const tab = currentTab();
    const student = tab.students.find(s => s.id === editingStudentId);
    if (!student) return;

    const reader = new FileReader();
    reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
            try {
                const MAX = 128;
                const w = img.naturalWidth || img.width;
                const h = img.naturalHeight || img.height;
                const side = Math.min(w, h);
                const sx = (w - side) / 2, sy = (h - side) / 2;

                const canvas = document.createElement('canvas');
                canvas.width = MAX; canvas.height = MAX;
                canvas.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, MAX, MAX);

                student.avatarType = 'image';
                student.avatarData = canvas.toDataURL('image/jpeg', 0.78);

                save(); render(); closeModal('avatarModal'); toast('头像已更新');
            } catch (err) { toast('图片处理失败'); }
        };
        img.onerror = function () { toast('图片读取失败'); };
        img.src = e.target.result;
    };
    reader.onerror = function () { toast('文件读取失败'); };
    reader.readAsDataURL(file);
}

function resetAvatar() {
    const tab = currentTab();
    const student = tab.students.find(s => s.id === editingStudentId);

    student.avatarType = 'text'; student.avatarData = '';

   14. 记录 / 历史（支持删除） / CSV

function buildRecordHTML(tab, date, isHistory, records) {
    let passed, pending;

    if (isHistory) {
        passed = records.filter(r => r.passed);
        pending = records.filter(r => !r.passed);
    } else {
        passed = tab.students.filter(s => tab.passed[s.id]);
        pending = tab.students.filter(s => !tab.passed[s.id]);
    }

    let html = '';
    html += '<div class="report-title">' + esc(isHistory ? '' : tab.name) + ' 打卡记录</div>';
    html += '<div class="report-meta">';
    html += '📅 日期：<b>' + esc(date) + '</b><br>';
    html += '📊 已交 <b>' + passed.length + '</b> 人 / 未交 <b>' + pending.length +
            '</b> 人 / 共 <b>' + (passed.length + pending.length) + '</b> 人';
    html += '</div>';

    html += '<div class="report-sec ok"><h4>✅ 已完成（' + passed.length + '）</h4><div class="tags">';
    if (passed.length === 0) {
        html += '<span class="tag">无</span>';
    } else {
        passed.sort((a, b) => {
            const ta = isHistory ? a.time : tab.passed[a.id]?.time;
            const tb = isHistory ? b.time : tab.passed[b.id]?.time;
            return (ta || 0) - (tb || 0);
        }).forEach(s => {
            const t = isHistory ? s.time : tab.passed[s.id].time;
            const timeStr = t ? new Date(t).toTimeString().slice(0, 5) : '';
            html += '<span class="tag">' + esc(s.name) + (timeStr ? ' · ' + timeStr : '') + '</span>';
        });
    }
    html += '</div></div>';

    html += '<div class="report-sec no"><h4>❌ 未完成（' + pending.length + '）</h4><div class="tags">';
    if (pending.length === 0) {
        html += '<span class="tag">无</span>';
    } else {
        pending.forEach(s => { html += '<span class="tag">' + esc(s.name) + '</span>'; });
    }
    html += '</div></div>';
    return html;
}

function csvCell(v) {
    const s = String(v == null ? '' : v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCSV() {
    const tab = currentTab();
    const rows = [['日期', '姓名', '学号', '时间', '状态']];

    tab.students.forEach(s => {
        const p = tab.passed[s.id];
        rows.push([
            state.date, s.name, s.sid || '',
            p && p.time ? new Date(p.time).toTimeString().slice(0, 8) : '',
            p ? '已交' : '未交'
        ]);
    });

    const csv = '\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
    try {
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = '打卡_' + tab.name + '_' + state.date + '.csv';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        toast('CSV已导出（用Excel查看，恢复数据请用备份）');
    } catch (e) { toast('导出失败'); }
}

/* ==========================================================================
   16. 备份恢复
   ========================================================================== */
function openBackup() { $('#backupArea').value = ''; openModal('backupModal'); }

function copyBackup() {
    const payload = JSON.stringify(state);
    const ta = $('#backupArea');
    ta.value = payload;
    const done = () => toast('已复制，去粘贴到备忘录吧');
    const fail = () => {
        ta.focus(); ta.select(); ta.setSelectionRange(0, payload.length);
        toast('请长按输入框手动复制');
    };
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(payload).then(done).catch(fail);
    } else {
        try {
            ta.focus(); ta.select(); ta.setSelectionRange(0, payload.length);
            if (document.execCommand('copy')) done(); else fail();
        } catch (e) { fail(); }
    }
}

function restoreBackup() {
    const raw = ($('#backupArea').value || '').trim();
    if (!raw) { toast('请先把备份文字粘贴进来'); return; }
    let parsed;
    try { parsed = JSON.parse(raw); } catch (e) { alert('数据解析失败'); return; }
    if (!parsed || !parsed.tabs) { alert('数据格式不正确'); return; }
    if (!confirm('恢复后将覆盖当前所有数据，确定继续吗？')) return;

    try {
        const newState = {
            version: DATA_VERSION,
            activeTab: parsed.activeTab || Object.keys(parsed.tabs)[0],
            soundOn: typeof parsed.soundOn === 'boolean' ? parsed.soundOn : true,
            date: parsed.date || todayStr(),
            tabs: {},
            history: Array.isArray(parsed.history) ? parsed.history : []
        };

        Object.keys(parsed.tabs).forEach(k => {
            const t = parsed.tabs[k];
            newState.tabs[k] = {
                id: k, name: t.name || '未命名',
                students: Array.isArray(t.students) ? t.students.map((s, i) => ({
                    id: Number(s.id) || (i + 1),
                    name: String(s.name || '').trim() || ('学生' + (i + 1)),
                    sid: String(s.sid || (i + 1)).padStart(2, '0'),
                    avatarType: s.avatarType || 'text',
                    avatarData: s.avatarData || ''
                })) : [],
                passed: t.passed || {},
                seq: typeof t.seq === 'number' ? t.seq : 0
            };
        });

        state = newState;
        save(); renderSoundBtn(); render();
        closeModal('backupModal'); toast('数据恢复成功');
    } catch (e) { alert('恢复失败：' + e.message); }
}

    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => { doReset(); cancelResetPress(); }, 1500);
}

function cancelResetPress() {
    clearTimeout(resetTimer); resetTimer = null;
    const item = $('#resetItem');
    const fill = item.querySelector('.reset-fill');
    item.classList.remove('pressing');
    fill.style.transition = 'none'; fill.style.width = '0%';
    void fill.offsetWidth;
    fill.style.transition = '';
}

function doReset() {
    const tab = currentTab();
    pushUndo(tab);
    tab.passed = {}; tab.seq = 0;
    save(); render(); toast('已重置「' + tab.name + '」');
}

function tickClock() {
    const d = new Date();
    elBigClock.textContent = String(d.getHours()).padStart(2, '0') + ':' +
        String(d.getMinutes()).padStart(2, '0') + ':' +
        String(d.getSeconds()).padStart(2, '0');

    const t = todayStr();
    if (t !== state.date) {
        state.date = t;
        Object.keys(state.tabs).forEach(k => {
            state.tabs[k].passed = {};
            state.tabs[k].seq = 0;
        });
        save(); render(); toast('新的一天，打卡记录已重置');
    }
}

function boot() {
    state = initState();
    parseUrlParams(); // 处理扫码参数
    renderSoundBtn();
    pinyinReady = detectPinyin();
    render();

    tickClock();
    setInterval(tickClock, 1000);

    if (!pinyinReady) {
        let tries = 0;
        const timer = setInterval(() => {
            tries++;
            if (detectPinyin()) {
                pinyinReady = true;
                clearInterval(timer);
                pinyinCache.clear();
                render();
            } else if (tries >= 40) {
                clearInterval(timer);
            }
        }, 100);
    }
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
} else {
    boot();
}

})();
</script>
</body>
</html>
