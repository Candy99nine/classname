        fxLayer.appendChild(el);
        el.animate([
            { transform: 'translate(-50%,-50%) scale(0.5)', opacity: 1 },
            { transform: `translate(calc(-50% + ${(Math.random()-0.5)*50}px), calc(-50% - ${100+Math.random()*100}px)) scale(1.2)`, opacity: 0 }
        ], { duration: 1000 + Math.random()*500, easing: 'ease-out', delay: i*60 }).onfinish = () => el.remove();
    }
}

function fxLightning(x, y) {
    const el = document.createElement('div');
    el.className = 'fx-item';
    el.textContent = '⚡';
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.fontSize = '50px';
    fxLayer.appendChild(el);
    el.animate([
        { transform: 'translate(-50%,-50%) scale(0) rotate(-20deg)', opacity: 0 },
        { transform: 'translate(-50%,-50%) scale(1.5) rotate(10deg)', opacity: 1, offset: .3 },
        { transform: 'translate(-50%,-50%) scale(1) rotate(-5deg)', opacity: 1, offset: .6 },
        { transform: 'translate(-50%,-50%) scale(0.5) rotate(0deg)', opacity: 0 }
    ], { duration: 600, easing: 'ease-in-out' }).onfinish = () => el.remove();
}

function fxSpiral(x, y) {
    for(let i=0; i<6; i++) {
        const el = document.createElement('div');
        el.className = 'fx-item';
        el.textContent = '⭐';
        el.style.left = x + 'px'; el.style.top = y + 'px';
        el.style.fontSize = '24px';
        fxLayer.appendChild(el);
        const ang = i * (Math.PI * 2 / 6);
        el.animate([
            { transform: `translate(-50%,-50%) scale(0.5) rotate(0deg)`, opacity: 1 },
            { transform: `translate(calc(-50% + ${Math.cos(ang)*80}px), calc(-50% + ${Math.sin(ang)*80}px)) scale(1.2) rotate(180deg)`, opacity: 0.8, offset: 0.5 },
            { transform: `translate(calc(-50% + ${Math.cos(ang+2)*150}px), calc(-50% + ${Math.sin(ang+2)*150}px)) scale(0) rotate(360deg)`, opacity: 0 }
        ], { duration: 800, easing: 'ease-out' }).onfinish = () => el.remove();
    }
}

const FX_FNS = [
    fxStars, fxHearts, fxConfetti, fxRipple,
    fxSparkles, fxBounce, fxRainbow, fxEmojiPop,
    fxFirework, fxEmojiRain, fxTextPop, fxBubble,
    fxLightning, fxSpiral
];

function spawnEffect(x, y, cardEl) {
    try {
        const fn = FX_FNS[Math.floor(Math.random() * FX_FNS.length)];
        fn(x, y, cardEl);
    } catch (e) {}
}

/* ==========================================================================
   7. 舞台：音浪 / 双模式 / 声控进度 / 烟花 / 气球
   ========================================================================== */
const MAX_BARS = 48;
const WAVE_THEMES = [
    { name: '糖果', colors: ['#FF8FA3', '#FFB86B', '#FFD93D', '#7ED9A0', '#6EC6FF'] },
    { name: '霓虹', colors: ['#FF5FA2', '#B46BFF', '#5C9BFF', '#31E1D6', '#8CFF9B'] },
    { name: '极光', colors: ['#7ED9A0', '#31E1D6', '#6EC6FF', '#B46BFF', '#FF8FA3'] },
    { name: '火焰', colors: ['#FFD93D', '#FFB86B', '#FF8A5B', '#FF6B6B', '#FF3D6E'] },
    { name: '海洋', colors: ['#6EC6FF', '#4FA8FF', '#8C7BFF', '#C06BFF', '#FF8FA3'] }
];

let waveThemeIdx = 0;
let micStream = null;
let audioAnalyser = null;
let micDataArray = null;

let waveCanvas = null, waveCtx = null;
let waveW = 0, waveH = 0, waveDPR = 1;
let barCount = 24;
let barLevels = new Float32Array(MAX_BARS);
let barPeaks  = new Float32Array(MAX_BARS);
const barTargets = new Float32Array(MAX_BARS);
let waveParticles = [];
let waveLevel = 0;
let micLevel = 0;
let waveRunning = false;
let waveRaf = null;
let lastFrameT = 0;
let lastBurstT = 0;
let badgeTextCache = '';

/* 舞台模式 */
let stageMode = 'wave';
let dualMode = 'read';
let progValue = 0;
let progSaved = false;
let progSaveTimer = null;

/* DOM 引用 */
let waveStage, dualLayer, progLayer, balloonLayer;
let dualStarsBox, dualMoonEl, dualValEl;
let progFillEl, progSwimmerEl;
let dualStarEls = [];
let modeBtns = [];

/* 烟花 */
let fwParticles = [];
let fwTimer = 0;

/* 气球 */
let balloonEls = [];

/* --- 颜色工具 --- */
function hexToRgb(hex) {
    let h = String(hex).replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const n = parseInt(h, 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function rgbToHex(r, g, b) {
    const f = v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0');
    return '#' + f(r) + f(g) + f(b);
}
function mixHex(a, b, t) {
    const A = hexToRgb(a), B = hexToRgb(b);
    return rgbToHex(A.r + (B.r - A.r) * t, A.g + (B.g - A.g) * t, A.b + (B.b - A.b) * t);
}
function themeColor(theme, t) {
    const cols = theme.colors;
    const seg = cols.length - 1;
    const p = Math.max(0, Math.min(1, t)) * seg;
    const i = Math.min(seg - 1, Math.floor(p));
    return mixHex(cols[i], cols[i + 1], p - i);
}

/* --- 进度持久化 --- */
function loadProg() {
    try {
        const raw = localStorage.getItem(PROG_KEY);
        if (!raw) return;
        const o = JSON.parse(raw);
        if (o.date === todayStr()) {
            progValue = Math.max(0, Math.min(100, Number(o.value) || 0));
            progSaved = !!o.saved;
        }
    } catch (e) {}
}
function saveProg() {
    try {
        localStorage.setItem(PROG_KEY, JSON.stringify({
            date: todayStr(), value: progValue, saved: progSaved
        }));
    } catch (e) {}
}
function throttledSaveProg() {
    if (progSaveTimer) return;
    progSaveTimer = setTimeout(() => {
        progSaveTimer = null;
        saveProg();
    }, 2000);
}

/* --- 初始化舞台 --- */
function initStage() {
    waveCanvas = $('#waveCanvas');
    waveCtx = waveCanvas.getContext('2d');
    waveStage = $('#waveStage');
    dualLayer = $('#dualLayer');
    progLayer = $('#progLayer');
    balloonLayer = $('#balloonLayer');
    dualStarsBox = $('#dualStars');
    dualMoonEl = $('#dualMoon');
    dualValEl = $('#dualVal');
    progFillEl = $('#progFillBar');
    progSwimmerEl = $('#progSwimmer');
    modeBtns = $$('.mode-btn');

    resizeWave();
    if (window.ResizeObserver) {
        try { new ResizeObserver(resizeWave).observe(waveStage); } catch (e) {}
    }
    window.addEventListener('resize', resizeWave);

    buildDualStars();
    loadProg();
    updateProgressUI();

    bindStageEvents();
    startStageLoop();
}

function buildDualStars() {
    if (!dualStarsBox) return;
    dualStarsBox.innerHTML = '';
    dualStarEls = [];
    for (let i = 0; i < 36; i++) {
        const s = document.createElement('i');
        s.style.left = (Math.random() * 92 + 4) + '%';
        s.style.top = (Math.random() * 78 + 8) + '%';
        dualStarsBox.appendChild(s);
        dualStarEls.push(s);
    }
}

function bindStageEvents() {
    modeBtns.forEach(btn => {
        btn.addEventListener('click', () => setStageMode(btn.dataset.mode));
    });
    $$('.dual-sub button').forEach(btn => {
        btn.addEventListener('click', () => {
            dualMode = btn.dataset.dual;
            $$('.dual-sub button').forEach(b => b.classList.toggle('active', b === btn));
            badgeTextCache = '';
        });
    });
    const resetBtn = $('#progReset');
    if (resetBtn) resetBtn.addEventListener('click', resetProgress);
}

function setStageMode(mode) {
    if (stageMode === mode) return;
    stageMode = mode;
    waveStage.dataset.mode = mode;

    if (waveCtx) waveCtx.clearRect(0, 0, waveW, waveH);
    fwParticles.length = 0;
    fwTimer = 0;

    if (mode !== 'balloon') {
        balloonEls.forEach(b => b.el.remove());
        balloonEls.length = 0;
    }

    dualLayer.style.display = mode === 'dual' ? 'block' : 'none';
    progLayer.style.display = mode === 'progress' ? 'block' : 'none';
    balloonLayer.style.display = mode === 'balloon' ? 'block' : 'none';

    modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    badgeTextCache = '';
    updateWaveBadge();
    if (mode === 'progress') updateProgressUI();
}

function resizeWave() {
    if (!waveCanvas) return;
    const rect = waveCanvas.getBoundingClientRect();
    waveDPR = Math.min(window.devicePixelRatio || 1, 2);
    waveW = Math.max(1, Math.round(rect.width));
    waveH = Math.max(1, Math.round(rect.height));
    waveCanvas.width  = Math.round(waveW * waveDPR);
    waveCanvas.height = Math.round(waveH * waveDPR);
    waveCtx.setTransform(waveDPR, 0, 0, waveDPR, 0, 0);
    barCount = Math.max(10, Math.min(MAX_BARS, Math.floor(waveW / 20)));
}

function startStageLoop() {
    if (waveRunning) return;
    waveRunning = true;
    lastFrameT = 0;
    waveRaf = requestAnimationFrame(stageLoop);
}

function stageLoop(now) {
    if (!waveRunning) return;
    if (!lastFrameT) lastFrameT = now;
    let dt = (now - lastFrameT) / 16.667;
    if (dt > 3) dt = 3;
    if (dt < 0.2) dt = 0.2;
    lastFrameT = now;

    let freqData = null;
    if (audioAnalyser && micDataArray) {
        audioAnalyser.getByteFrequencyData(micDataArray);
        freqData = micDataArray;
    }

    updateMicLevel(freqData);

    if (stageMode === 'wave') {
        stepWaveBars(freqData, now, dt);
        drawWave();
    } else if (stageMode === 'firework') {
        renderFirework(now, dt);
    } else if (stageMode === 'dual') {
        renderDual();
    } else if (stageMode === 'progress') {
        renderProgress(dt);
    } else if (stageMode === 'balloon') {
        renderBalloon(now, dt);
    }

    updateWaveBadge();
    waveRaf = requestAnimationFrame(stageLoop);
}

function updateMicLevel(freqData) {
    if (freqData) {
        let sum = 0;
        const n = Math.min(64, freqData.length);
        for (let i = 0; i < n; i++) sum += freqData[i];
        const raw = sum / n / 255;
        micLevel += (raw - micLevel) * 0.25;
    } else {
        const t = performance.now() / 1000;
        const sim = 0.06 + 0.04 * Math.sin(t * 1.2) + 0.02 * Math.sin(t * 3.1);
        micLevel += (sim - micLevel) * 0.08;
    }
    if (micLevel < 0) micLevel = 0;
    if (micLevel > 1) micLevel = 1;
}

/* --- 音浪柱 --- */
function stepWaveBars(freqData, now, dt) {
    const live = !!freqData;

    if (live) {
        const bins = freqData.length;
        const top = Math.min(bins, 72);
        for (let k = 0; k < barCount; k++) {
            const a = Math.floor(Math.pow(k / barCount, 1.7) * top);
            const b = Math.max(a + 1, Math.floor(Math.pow((k + 1) / barCount, 1.7) * top));
            let sum = 0, cnt = 0;
            for (let j = a; j < b && j < bins; j++) { sum += freqData[j]; cnt++; }
            const v = cnt ? (sum / cnt) / 255 : 0;
            barTargets[k] = Math.min(1, Math.pow(v, 0.8) * 1.45);
        }
    } else {
        for (let k = 0; k < barCount; k++) {
            const v = 0.05 + 0.05 * (0.5 + 0.5 * Math.sin(now / 640 + k * 0.42));
            barTargets[k] = v;
        }
    }

    for (let k = 0; k < barCount; k++) {
        const t = barTargets[k];
        const cur = barLevels[k];
        const up = live ? 0.62 : 0.10;
        const down = live ? 0.15 : 0.06;
        barLevels[k] = cur + (t - cur) * Math.min(1, (t > cur ? up : down) * dt);
        if (barLevels[k] >= barPeaks[k]) barPeaks[k] = barLevels[k];
        else barPeaks[k] = Math.max(0, barPeaks[k] - 0.010 * dt);
    }

    let total = 0;
    for (let k = 0; k < barCount; k++) total += barLevels[k];
    const avg = total / barCount;
    waveLevel += (avg - waveLevel) * Math.min(1, 0.20 * dt);

    if (live && waveLevel > 0.32) {
        const n = Math.min(4, Math.floor(waveLevel * 6));
        for (let i = 0; i < n; i++) {
            if (Math.random() > 0.6) continue;
            waveParticles.push({
                x: Math.random() * waveW,
                y: waveH - 8,
                vx: (Math.random() - 0.5) * 0.9,
                vy: -(0.7 + Math.random() * 2.0),
                r: 1.2 + Math.random() * 2.6,
                life: 1,
                t: Math.random()
            });
        }
    }
    for (let i = waveParticles.length - 1; i >= 0; i--) {
        const p = waveParticles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 0.025 * dt;
        p.life -= 0.011 * dt;
        if (p.life <= 0 || p.y < -30) waveParticles.splice(i, 1);
    }
    if (waveParticles.length > 180) waveParticles.splice(0, waveParticles.length - 180);

    if (live && waveLevel > 0.6 && now - lastBurstT > 1500) {
        lastBurstT = now;
        burstWave();
    }
}

function burstWave() {
    const x = window.innerWidth * (0.2 + Math.random() * 0.6);
    const y = window.innerHeight * (0.18 + Math.random() * 0.35);
    fxConfetti(x, y);
    if (Math.random() < 0.55) fxFirework(x, y);
    if (Math.random() < 0.25) fxTextPop(x, y);
}

function roundRectPath(ctx, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
}

function drawBar(ctx, x, w, h, ph, color, intensity, baseY) {
    const y = baseY - h;
    const r = Math.min(w / 2, 4);

    const g = ctx.createLinearGradient(0, y, 0, baseY);
    g.addColorStop(0, mixHex(color, '#FFFFFF', 0.45));
    g.addColorStop(0.55, color);
    g.addColorStop(1, mixHex(color, '#FFFFFF', 0.12));

    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 5 + intensity * 16;
    ctx.fillStyle = g;
    roundRectPath(ctx, x, y, w, h, r);
    ctx.fill();
    ctx.restore();

    const py = baseY - ph - 3;
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#FFFFFF';
    ctx.shadowColor = color;
    ctx.shadowBlur = 7;
    roundRectPath(ctx, x, py, w, 2.4, 1.2);
    ctx.fill();
    ctx.restore();
}

function drawWave() {
    if (!waveCtx || waveW <= 0 || waveH <= 0) return;
    const ctx = waveCtx;
    const W = waveW, H = waveH;
    ctx.clearRect(0, 0, W, H);

    const theme = WAVE_THEMES[waveThemeIdx];
    const baseY = H - 9;
    const maxH = H - 30;
    const cx = W / 2;
    const gap = Math.max(1.5, W / 300);
    const usable = W * 0.94;
    const barW = Math.max(2, (usable / 2 - gap * (barCount - 1)) / barCount);
    if (barW <= 0) return;

    ctx.save();
    ctx.globalAlpha = 0.5;
    const lg = ctx.createLinearGradient(0, 0, W, 0);
    lg.addColorStop(0, 'rgba(255,143,163,0)');
    lg.addColorStop(0.5, 'rgba(255,143,163,0.65)');
    lg.addColorStop(1, 'rgba(255,143,163,0)');
    ctx.fillStyle = lg;
    ctx.fillRect(0, baseY + 1, W, 1.5);
    ctx.restore();

    for (let k = 0; k < barCount; k++) {
        const idx = Math.min(MAX_BARS - 1, k);
        const ratio = Math.max(0, Math.min(1, barLevels[idx]));
        const peakR = Math.max(0, Math.min(1, barPeaks[idx]));
        const color = themeColor(theme, k / Math.max(1, barCount - 1));
        const offset = gap * 0.5 + k * (barW + gap);
        const h = Math.max(3, ratio * maxH);
        const ph = Math.max(3, peakR * maxH);

        drawBar(ctx, cx + offset, barW, h, ph, color, ratio, baseY);
        drawBar(ctx, cx - offset - barW, barW, h, ph, color, ratio, baseY);
    }

    for (let i = 0; i < waveParticles.length; i++) {
        const p = waveParticles[i];
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life) * 0.9;
        ctx.fillStyle = themeColor(theme, p.t);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

/* --- 双模式 --- */
function renderDual() {
    if (!dualStarEls.length) return;
    const level = micLevel;
    if (dualMode === 'read') {
        const on = Math.round(level * dualStarEls.length);
        dualStarEls.forEach((s, i) => {
            const lit = i < on;
            s.style.opacity = lit ? 1 : 0.12;
            s.style.transform = `scale(${lit ? 1.5 : 1})`;
        });
        dualMoonEl.style.opacity = 0.06;
        dualValEl.textContent = Math.round(level * 100) + '%';
    } else {
        dualStarEls.forEach(s => { s.style.opacity = 0.15; s.style.transform = 'scale(1)'; });
        const q = 1 - level;
        dualMoonEl.style.opacity = (0.2 + 0.8 * q).toFixed(2);
        dualValEl.textContent = '安静 ' + Math.round(q * 100) + '%';
    }
}

/* --- 声控进度 --- */
function renderProgress(dt) {
    const level = micLevel;

    if (!progSaved && level > 0.08) {
        const k = 0.005;
        progValue = Math.min(100, progValue + level * dt * k);
        if (progValue >= 100) {
            progValue = 100;
            progSaved = true;
            saveProg();
            onProgressComplete();
        }
        throttledSaveProg();
    }

    updateProgressUI();
}

function updateProgressUI() {
    if (!progFillEl || !progSwimmerEl) return;
    progFillEl.style.width = progValue + '%';
    progSwimmerEl.style.left = Math.max(3, Math.min(97, progValue)) + '%';
}

function onProgressComplete() {
    toast('🏝 声浪进度已满，已自动存入今日记录');
    const tab = currentTab();
    if (!tab.students.length) return;
    const records = tab.students.map(s => ({
        name: s.name,
        sid: s.sid,
        passed: !!tab.passed[s.id],
        time: tab.passed[s.id] ? tab.passed[s.id].time : null
    }));
    state.history.unshift({
        id: Date.now(), date: state.date, project: tab.name,
        total: tab.students.length,
        passed: records.filter(r => r.passed).length,
        records: records
    });
    if (state.history.length > 300) state.history.length = 300;
    save();
    celebrateAllDone(true);
}

function resetProgress() {
    progValue = 0;
    progSaved = false;
    saveProg();
    updateProgressUI();
    toast('声浪进度已重置');
}

/* --- 烟花 --- */
function spawnFireworkBurst() {
    const cx = waveW * (0.2 + Math.random() * 0.6);
    const cy = waveH * (0.2 + Math.random() * 0.4);
    const hue = Math.random() * 360;
    const n = 30 + Math.floor(micLevel * 30);
    for (let i = 0; i < n; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 1 + Math.random() * 3;
        fwParticles.push({
            x: cx, y: cy,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            life: 1,
            decay: 0.008 + Math.random() * 0.012,
            hue: hue + (Math.random() - 0.5) * 60,
            r: 1.5 + Math.random() * 2
        });
    }
}

function renderFirework(now, dt) {
    const ctx = waveCtx;
    const W = waveW, H = waveH;
    ctx.clearRect(0, 0, W, H);

    fwTimer -= dt;
    if (micLevel > 0.18 && fwTimer <= 0) {
        fwTimer = 22 - micLevel * 18;
        spawnFireworkBurst();
        if (micLevel > 0.55 && Math.random() < 0.55) spawnFireworkBurst();
    }

    for (let i = fwParticles.length - 1; i >= 0; i--) {
        const p = fwParticles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 0.03 * dt;
        p.vx *= 0.99;
        p.vy *= 0.99;
        p.life -= p.decay * dt;
        if (p.life <= 0) { fwParticles.splice(i, 1); continue; }

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        const c = `hsl(${p.hue}, 100%, 65%)`;
        ctx.fillStyle = c;
        ctx.shadowColor = c;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
    if (fwParticles.length > 400) fwParticles.splice(0, fwParticles.length - 400);
}

/* --- 气球 --- */
function spawnBalloon() {
    if (!balloonLayer) return;
    const el = document.createElement('div');
    el.className = 'balloon';
    el.textContent = ['🎈','🎈','🩷','💛','💙','💜'][Math.floor(Math.random() * 6)];
    el.style.left = (Math.random() * 90 + 5) + '%';
    balloonLayer.appendChild(el);
    balloonEls.push({
        el,
        y: 0,
        speed: 0.6 + Math.random() * 0.8,
        rot: (Math.random() - 0.5) * 20,
        phase: Math.random() * 6.28
    });
}

function renderBalloon(now, dt) {
    const level = micLevel;
    if (level > 0.15 && Math.random() < level * 0.09 * dt) {
        spawnBalloon();
    }

    for (let i = balloonEls.length - 1; i >= 0; i--) {
        const b = balloonEls[i];
        b.y += b.speed * (0.5 + level * 2.5) * dt;
        b.rot += Math.sin(now / 800 + b.phase) * 0.3 * dt;
        b.el.style.transform = `translateY(${-b.y}px) rotate(${b.rot}deg)`;
        if (b.y > waveH + 40) {
            b.el.remove();
            balloonEls.splice(i, 1);
        }
    }

    if (balloonEls.length > 40) {
        const extra = balloonEls.splice(0, balloonEls.length - 40);
        extra.forEach(b => b.el.remove());
    }
}

/* --- 徽章文字 --- */
function updateWaveBadge() {
    const el = $('#waveBadge');
    if (!el) return;
    let txt = '';

    if (stageMode === 'progress') {
        if (progSaved) txt = '🏝 已到达！';
        else {
            const remainMin = Math.max(0, Math.ceil((100 - progValue) / 100 * 20));
            txt = progValue >= 99 ? '🏝 即将到达' : `进度 ${Math.round(progValue)}% · 约剩 ${remainMin} 分钟`;
        }
    } else if (stageMode === 'dual') {
        txt = dualMode === 'read' ? '📣 读书模式' : '🌙 安静模式';
    } else if (stageMode === 'firework') {
        if (micLevel > 0.55) txt = '🎆 烟花齐放';
        else if (micLevel > 0.2) txt = '🎆 热闹起来';
        else txt = '🎆 声音大点';
    } else if (stageMode === 'balloon') {
        if (micLevel > 0.45) txt = '🎈 气球升空';
        else if (micLevel > 0.18) txt = '🎈 气球飘起来';
        else txt = '🎈 声音再大点';
    } else {
        if (!audioAnalyser) {
            txt = '🎤 点击开启音浪';
        } else if (waveLevel < 0.10) txt = '🌙 很安静';
        else if (waveLevel < 0.26) txt = '🙂 刚刚好';
        else if (waveLevel < 0.48) txt = '😄 有点热闹';
        else if (waveLevel < 0.68) txt = '🔥 很嗨';
        else txt = '💥 爆表啦';
    }

    if (txt !== badgeTextCache) {
        badgeTextCache = txt;
        el.textContent = txt;
    }
}

/* --- 麦克风开关 --- */
function toggleMic() {
    if (micStream) { stopMic(); return; }

    if (location.protocol === 'file:') {
        toast('本地文件无法使用麦克风，请部署到 HTTPS 后使用');
        return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        toast('当前浏览器不支持麦克风');
        return;
    }

    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        micStream = stream;
        const ctx = getAudioCtx();
        if (!ctx) throw new Error('音频引擎未就绪');
        if (ctx.state === 'suspended') ctx.resume().catch(() => {});

        const src = ctx.createMediaStreamSource(stream);
        audioAnalyser = ctx.createAnalyser();
        audioAnalyser.fftSize = 512;
        audioAnalyser.smoothingTimeConstant = 0.55;
        src.connect(audioAnalyser);
        micDataArray = new Uint8Array(audioAnalyser.frequencyBinCount);

        const btn = $('#micBtn');
        if (btn) { btn.textContent = '⏹'; btn.classList.add('active'); }
        if (waveStage) waveStage.classList.add('live');
        badgeTextCache = '';
        toast('音浪已开启，喊起来吧！');

/* ==========================================================================
   9. 打卡核心 + FLIP
   ========================================================================== */
function pushUndo(tab) {
    undoStack.push({
        tabId: tab.id,
        passed: JSON.parse(JSON.stringify(tab.passed)),
        seq: tab.seq
    });
    if (undoStack.length > 60) undoStack.shift();
}

function celebrateAllDone(silent) {
    if (reduceMotion()) return;
    const w = window.innerWidth, h = window.innerHeight;
    const spots = [[w * 0.18, h * 0.30], [w * 0.5, h * 0.20], [w * 0.82, h * 0.30]];
    spots.forEach((p, i) => {
        setTimeout(() => {
            fxConfetti(p[0], p[1]);
            fxFirework(p[0], p[1]);
        }, i * 220);
    });
    if (!silent) setTimeout(() => toast('🎉 全部交齐，太棒啦！'), 200);
}

function setPassed(id, passed) {
    const tab = currentTab();
    const fromEl = passed
        ? elPendingGrid.querySelector('.card[data-id="' + id + '"]')
        : elPassedGrid.querySelector('.card[data-id="' + id + '"]');
    const fromRect = fromEl ? fromEl.getBoundingClientRect() : null;
    const cx = fromRect ? fromRect.left + fromRect.width / 2 : window.innerWidth / 2;
    const cy = fromRect ? fromRect.top + fromRect.height / 2 : window.innerHeight / 2;

    pushUndo(tab);

    if (passed) {
        if (!tab.passed[id]) {
            tab.seq += 1;
            tab.passed[id] = { time: Date.now(), seq: tab.seq };
        }
    } else {
        delete tab.passed[id];
    }

    const allDone = tab.students.length > 0 && tab.students.every(s => tab.passed[s.id]);
    save();

    renderProgressBar();
    renderPending();
    renderPassed();

    const toEl = passed
        ? elPassedGrid.querySelector('.card[data-id="' + id + '"]')
        : elPendingGrid.querySelector('.card[data-id="' + id + '"]');

    if (fromRect && toEl && !reduceMotion()) {
        const toRect = toEl.getBoundingClientRect();
        if (toRect.width && toRect.height) {
            const dx = fromRect.left - toRect.left;
            const dy = fromRect.top  - toRect.top;
            const sx = fromRect.width  / toRect.width;
            const sy = fromRect.height / toRect.height;
            try {
                toEl.animate([
                    { transform: `translate(${dx}px,${dy}px) scale(${sx},${sy})`, opacity: .92 },
                    { transform: 'translate(0,0) scale(1,1)', opacity: 1 }
                ], { duration: 460, easing: 'cubic-bezier(.22,.9,.3,1)' });
            } catch (e) {}
        }
    }

    if (passed) {
        spawnEffect(cx, cy, fromEl);
        playDing();
        if (allDone) setTimeout(() => { playFanfare(); celebrateAllDone(); }, 380);
    } else {
        fxRipple(cx, cy);
    }
}

function switchTab(tabId) {
    if (state.activeTab === tabId) return;
    if (!state.tabs[tabId]) return;
    state.activeTab = tabId;
    save();
    render();
}

function undo() {
    const last = undoStack.pop();
    if (!last) { toast('没有可以撤销的操作了'); return; }
    const tab = state.tabs[last.tabId];
    if (!tab) return;
    if (state.activeTab !== last.tabId) state.activeTab = last.tabId;
    tab.passed = last.passed;
    tab.seq = last.seq;
    save();
    render();
    toast('已撤销');
}

/* ==========================================================================
   10. 音效
   ========================================================================== */
function getAudioCtx() {
    if (audioCtx) {
        if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        return audioCtx;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { audioCtx = new AC(); } catch (e) { return null; }
    return audioCtx;
}

function playDing() {
    if (!state.soundOn) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const t = ctx.currentTime;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(880, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.30, t + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.33);
}

function playFanfare() {
    if (!state.soundOn) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const notes = [523.25, 659.25, 783.99];
    const t0 = ctx.currentTime;
    notes.forEach((freq, i) => {
        const t = t0 + i * 0.14;
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.24, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t + 0.45);
    });
}

function renderSoundBtn() {
    if (state.soundOn) { elSoundBtn.textContent = '🔊'; elSoundBtn.classList.remove('off'); }
    else { elSoundBtn.textContent = '🔇'; elSoundBtn.classList.add('off'); }
}

    $$('#rosterList .roster-row').forEach((row, i) => {
        const sid = row.querySelector('.ri-sid');

function saveRoster() {
    const tab = currentTab();
    const rows = $$('#rosterList .roster-row');
    if (rows.length === 0 && !confirm('名单将变为空，确定吗？')) return;

    const oldById = new Map(tab.students.map(s => [s.id, s]));
    const newStudents = [];
    const usedNames = new Set();
    let maxId = 0;
    tab.students.forEach(s => { if (s.id > maxId) maxId = s.id; });

    rows.forEach((row, i) => {
        const nameInput = row.querySelector('.ri-name');
        const sidInput  = row.querySelector('.ri-sid');
        const name = (nameInput.value || '').trim();
        if (!name) return;

        let finalName = name, n = 2;
        while (usedNames.has(finalName)) { finalName = name + '(' + n + ')'; n++; }
        usedNames.add(finalName);

        const rawId = row.dataset.id;
        let student;

        if (rawId && oldById.has(Number(rawId))) {
            student = Object.assign({}, oldById.get(Number(rawId)));
            student.name = finalName;
        } else {
            maxId += 1;
            student = { id: maxId, name: finalName, sid: '', avatarType: 'text', avatarData: '' };
        }
        student.id = Number(student.id);
        student.sid = (sidInput.value || '').trim() || String(i + 1).padStart(2, '0');
        newStudents.push(student);
    });

    const keepIds = new Set(newStudents.map(s => s.id));
    Object.keys(tab.passed).forEach(k => { if (!keepIds.has(Number(k))) delete tab.passed[k]; });

    tab.students = newStudents;
    save(); render(); closeModal('rosterModal'); toast('名单已保存');
}

function handleAvatarFile(event) {
    const input = event.target;
    const file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    if (!file.type || file.type.indexOf('image/') !== 0) { toast('请选择图片文件'); return; }

    const tab = currentTab();
    const student = tab.students.find(s => s.id === editingStudentId);
    if (!student) return;

    const reader = new FileReader();
    reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
            try {
                const MAX = 128;
                const w = img.naturalWidth || img.width;
                const h = img.naturalHeight || img.height;
                const side = Math.min(w, h);
                const sx = (w - side) / 2, sy = (h - side) / 2;

                const canvas = document.createElement('canvas');
                canvas.width = MAX; canvas.height = MAX;
                canvas.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, MAX, MAX);

                student.avatarType = 'image';
                student.avatarData = canvas.toDataURL('image/jpeg', 0.78);

                save(); render(); closeModal('avatarModal'); toast('头像已更新');
            } catch (err) { toast('图片处理失败'); }
        };
        img.onerror = function () { toast('图片读取失败'); };
        img.src = e.target.result;
    };
    reader.onerror = function () { toast('文件读取失败'); };
    reader.readAsDataURL(file);
}

function buildRecordHTML(tab, date, isHistory, records) {
    let passed, pending;

    if (isHistory) {
        passed = records.filter(r => r.passed);
        pending = records.filter(r => !r.passed);
    } else {
        passed = tab.students.filter(s => tab.passed[s.id]);
        pending = tab.students.filter(s => !tab.passed[s.id]);
    }

    let html = '';
    html += '<div class="report-title">' + esc(isHistory ? '' : tab.name) + ' 打卡记录</div>';
    html += '<div class="report-meta">';
    html += '📅 日期：<b>' + esc(date) + '</b><br>';
    html += '📊 已交 <b>' + passed.length + '</b> 人 / 未交 <b>' + pending.length +
            '</b> 人 / 共 <b>' + (passed.length + pending.length) + '</b> 人';
    html += '</div>';

    html += '<div class="report-sec ok"><h4>✅ 已完成（' + passed.length + '）</h4><div class="tags">';
    if (passed.length === 0) {
        html += '<span class="tag">无</span>';
    } else {
        passed.sort((a, b) => {
            const ta = isHistory ? a.time : (tab.passed[a.id] && tab.passed[a.id].time);
            const tb = isHistory ? b.time : (tab.passed[b.id] && tab.passed[b.id].time);
            return (ta || 0) - (tb || 0);
        }).forEach(s => {
            const t = isHistory ? s.time : tab.passed[s.id].time;
            const timeStr = t ? new Date(t).toTimeString().slice(0, 5) : '';
            html += '<span class="tag">' + esc(s.name) + (timeStr ? ' · ' + timeStr : '') + '</span>';
        });
    }
    html += '</div></div>';

    html += '<div class="report-sec no"><h4>❌ 未完成（' + pending.length + '）</h4><div class="tags">';
    if (pending.length === 0) {
        html += '<span class="tag">无</span>';
    } else {
        pending.forEach(s => { html += '<span class="tag">' + esc(s.name) + '</span>'; });
    }
    html += '</div></div>';
    return html;
}

        delBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (confirm('确定删除这条存档吗？')) {
                state.history = state.history.filter(item => item.id !== h.id);
                save();
                openHistory();
            }
        });

        row.appendChild(dateEl);
        row.appendChild(nameEl);
        row.appendChild(numEl);
        row.appendChild(delBtn);

        row.addEventListener('click', () => {
            $('#recordTitle').textContent = h.project + ' (' + h.date + ')';
            $('#recordBody').innerHTML = buildRecordHTML(null, h.date, true, h.records);
            openModal('recordModal');
        });

        frag.appendChild(row);
    });

    box.appendChild(frag);
    openModal('historyModal');
}

function openSaveToday() {
    const tab = currentTab();
    $('#projectName').value = tab.name;
    $('#saveDate').value = state.date;
    openModal('saveModal');
    setTimeout(() => { $('#projectName').focus(); $('#projectName').select(); }, 150);
}

function confirmSaveToday() {
    const tab = currentTab();
    const project = ($('#projectName').value || '').trim() || tab.name;

    const records = tab.students.map(s => ({
        name: s.name,
        sid: s.sid,
        passed: !!tab.passed[s.id],
        time: tab.passed[s.id] ? tab.passed[s.id].time : null
    }));

    state.history.unshift({
        id: Date.now(), date: state.date, project: project,
        total: tab.students.length,
        passed: records.filter(r => r.passed).length,
        records: records
    });

    if (state.history.length > 300) state.history.length = 300;
    save(); closeModal('saveModal'); toast('已存入历史存档');
}

function csvCell(v) {
    const s = String(v == null ? '' : v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCSV() {
    const tab = currentTab();
    const rows = [['日期', '姓名', '学号', '时间', '状态']];

    tab.students.forEach(s => {
        const p = tab.passed[s.id];
        rows.push([
            state.date, s.name, s.sid || '',
            p && p.time ? new Date(p.time).toTimeString().slice(0, 8) : '',
            p ? '已交' : '未交'
        ]);
    });

    const csv = '\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
    try {
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = '打卡_' + tab.name + '_' + state.date + '.csv';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        toast('CSV已导出（用Excel查看，恢复数据请用备份）');
    } catch (e) { toast('导出失败'); }
}

/* ==========================================================================
   15. 分享 / 二维码
   ========================================================================== */
function openQRCode() {
    const box = $('#qrcodeBox');
    box.innerHTML = '';

    if (location.protocol === 'file:') {
        box.innerHTML = '<p style="color:#E5674E;font-size:15px;padding:20px;">当前是本地文件打开，无法生成扫码链接。<br>请把网页挂到网上（如GitHub Pages）后使用。</p>';
        openModal('qrcodeModal');
        return;
    }

    if (typeof QRCode === 'undefined') {
        box.innerHTML = '<p style="color:#E5674E;font-size:15px;padding:20px;">二维码组件加载失败，请检查网络。</p>';
        openModal('qrcodeModal');
        return;
    }

    const taskName = currentTab().name;
    const url = location.origin + location.pathname + '?task=' + encodeURIComponent(taskName);

    new QRCode(box, {
        text: url, width: 180, height: 180,
        colorDark: "#5A4A42", colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
    });
    openModal('qrcodeModal');
}

/* ==========================================================================
   16. 备份恢复
   ========================================================================== */
function openBackup() { $('#backupArea').value = ''; openModal('backupModal'); }

function copyBackup() {
    const payload = JSON.stringify(state);
    const ta = $('#backupArea');
    ta.value = payload;
    const done = () => toast('已复制，去粘贴到备忘录吧');
    const fail = () => {
        ta.focus(); ta.select(); ta.setSelectionRange(0, payload.length);
        toast('请长按输入框手动复制');
    };
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(payload).then(done).catch(fail);
    } else {
        try {
            ta.focus(); ta.select(); ta.setSelectionRange(0, payload.length);
            if (document.execCommand('copy')) done(); else fail();
        } catch (e) { fail(); }
    }
}

function restoreBackup() {
    const raw = ($('#backupArea').value || '').trim();
    if (!raw) { toast('请先把备份文字粘贴进来'); return; }
    let parsed;
    try { parsed = JSON.parse(raw); } catch (e) { alert('数据解析失败'); return; }
    if (!parsed || !parsed.tabs) { alert('数据格式不正确'); return; }
    if (!confirm('恢复后将覆盖当前所有数据，确定继续吗？')) return;

    try {
        const newState = {
            version: DATA_VERSION,
            activeTab: parsed.activeTab || Object.keys(parsed.tabs)[0],
            soundOn: typeof parsed.soundOn === 'boolean' ? parsed.soundOn : true,
            date: parsed.date || todayStr(),
            tabs: {},
            history: Array.isArray(parsed.history) ? parsed.history : []
        };

        Object.keys(parsed.tabs).forEach(k => {
            const t = parsed.tabs[k];
            newState.tabs[k] = {
                id: k, name: t.name || '未命名',
                students: Array.isArray(t.students) ? t.students.map((s, i) => ({
                    id: Number(s.id) || (i + 1),
                    name: String(s.name || '').trim() || ('学生' + (i + 1)),
                    sid: String(s.sid || (i + 1)).padStart(2, '0'),
                    avatarType: s.avatarType || 'text',
                    avatarData: s.avatarData || ''
                })) : [],
                passed: t.passed || {},
                seq: typeof t.seq === 'number' ? t.seq : 0
            };
        });

        state = newState;
        save(); renderSoundBtn(); render();
        closeModal('backupModal'); toast('数据恢复成功');
    } catch (e) { alert('恢复失败：' + e.message); }
}

/* ==========================================================================
   17. 长按重置
   ========================================================================== */
let resetTimer = null;
function startResetPress(e) {
    if (e && e.cancelable) e.preventDefault();
    const item = $('#resetItem');
    const fill = item.querySelector('.reset-fill');
    fill.style.transition = 'none'; fill.style.width = '0%';
    void fill.offsetWidth;
    fill.style.transition = '';
    item.classList.add('pressing');
    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => { doReset(); cancelResetPress(); }, 1500);
}

function cancelResetPress() {
    clearTimeout(resetTimer); resetTimer = null;
    const item = $('#resetItem');
    const fill = item.querySelector('.reset-fill');
    item.classList.remove('pressing');
    fill.style.transition = 'none'; fill.style.width = '0%';
    void fill.offsetWidth;
    fill.style.transition = '';
}

function doReset() {
    const tab = currentTab();
    pushUndo(tab);
    tab.passed = {}; tab.seq = 0;
    save(); render(); toast('已重置「' + tab.name + '」');
}

/* ==========================================================================
   18. 事件绑定
   ========================================================================== */
elSoundBtn.addEventListener('click', () => {
    state.soundOn = !state.soundOn; save(); renderSoundBtn();
    if (state.soundOn) playDing();
});

$('#micBtn').addEventListener('click', toggleMic);
$('#micThemeBtn').addEventListener('click', cycleWaveTheme);

$('#undoBtn').addEventListener('click', undo);
$('#saveTodayBtn').addEventListener('click', openSaveToday);
$('#csvBtn').addEventListener('click', exportCSV);

const elMenu = $('#menu');
$('#moreBtn').addEventListener('click', (e) => { e.stopPropagation(); elMenu.classList.toggle('active'); });
elMenu.addEventListener('click', (e) => { if (e.target === elMenu) elMenu.classList.remove('active'); });

$$('.menu-item[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
        const action = btn.dataset.action;
        elMenu.classList.remove('active');
        if (action === 'roster') openRoster();
        else if (action === 'avatar') toggleEditMode();
        else if (action === 'record') openRecord();
        else if (action === 'history') openHistory();
        else if (action === 'backup') openBackup();
        else if (action === 'qrcode') openQRCode();
    });
});

const resetItem = $('#resetItem');
resetItem.addEventListener('pointerdown', startResetPress);
resetItem.addEventListener('pointerup', cancelResetPress);
resetItem.addEventListener('pointerleave', cancelResetPress);
resetItem.addEventListener('pointercancel', cancelResetPress);
resetItem.addEventListener('contextmenu', e => e.preventDefault());

$$('[data-close]').forEach(btn => {
    btn.addEventListener('click', () => closeModal(btn.dataset.close));
});
$$('.modal').forEach(m => {
    m.addEventListener('click', e => { if (e.target === m) m.classList.remove('active'); });
});

$('#addTabBtn').addEventListener('click', openAddTab);
$('#confirmAddTabBtn').addEventListener('click', confirmAddTab);
$('#newTabName').addEventListener('keydown', e => { if (e.key === 'Enter') confirmAddTab(); });

$('#confirmSaveBtn').addEventListener('click', confirmSaveToday);
$('#projectName').addEventListener('keydown', e => { if (e.key === 'Enter') confirmSaveToday(); });

$('#addStudentBtn').addEventListener('click', addStudentRow);
$('#saveRosterBtn').addEventListener('click', saveRoster);
$('#bulkImportBtn').addEventListener('click', bulkImport);

$('#avatarCamera').addEventListener('change', handleAvatarFile);
$('#avatarFile').addEventListener('change', handleAvatarFile);
$('#avatarResetBtn').addEventListener('click', resetAvatar);

$('#copyBackupBtn').addEventListener('click', copyBackup);
$('#restoreBackupBtn').addEventListener('click', restoreBackup);

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        $$('.modal.active').forEach(m => m.classList.remove('active'));
        elMenu.classList.remove('active');
        if (editMode) toggleEditMode(false);
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        const active = document.activeElement;
        if (active && /input|textarea/i.test(active.tagName)) return;
        e.preventDefault(); undo();
    }
});

document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') save();
});
window.addEventListener('beforeunload', save);

/* ==========================================================================
   19. 时钟与启动
   ========================================================================== */
function tickClock() {
    const d = new Date();
    elBigClock.textContent = String(d.getHours()).padStart(2, '0') + ':' +
        String(d.getMinutes()).padStart(2, '0') + ':' +
        String(d.getSeconds()).padStart(2, '0');

    const dateEl = $('#clockDate');
    if (dateEl) {
        const wd = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
        const s = (d.getMonth() + 1) + '月' + d.getDate() + '日 · ' + wd;
        if (dateEl.textContent !== s) dateEl.textContent = s;
    }

    const t = todayStr();
    if (t !== state.date) {
        state.date = t;
        Object.keys(state.tabs).forEach(k => {
            state.tabs[k].passed = {};
            state.tabs[k].seq = 0;
        });
        progValue = 0;
        progSaved = false;
        saveProg();
        updateProgressUI();
        save(); render(); toast('新的一天，打卡记录已重置');
    }
}

function boot() {
    state = initState();
    parseUrlParams();
    renderSoundBtn();
    pinyinReady = detectPinyin();
    render();
    initStage();
    tickClock();
    setInterval(tickClock, 1000);

    if (!pinyinReady) {
        let tries = 0;
        const timer = setInterval(() => {
            tries++;
            if (detectPinyin()) {
                pinyinReady = true;
                clearInterval(timer);
                pinyinCache.clear();
                render();
            } else if (tries >= 40) {
                clearInterval(timer);
            }
        }, 100);
    }
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
} else {
    boot();
}

})();
</script>
