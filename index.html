function startRoll() {
    if (pickerRolling) return;
    const tab = currentTab();
    let pool = [];
    if (pickerTarget === 'pending') pool = tab.students.filter(s => !tab.passed[s.id]);
    else if (pickerTarget === 'passed') pool = tab.students.filter(s => tab.passed[s.id]);
    else pool = tab.students.slice();

    if (pool.length === 0) { toast('这个分组里没有人哦！'); return; }

    pickerRolling = true;
    $('#startRollBtn').textContent = '抽选中...';
    $('#startRollBtn').style.opacity = '.7';
    $('#startRollBtn').style.pointerEvents = 'none';
    $('#pickerSub').textContent = '命运的齿轮正在转动...';

    let startTime = Date.now();
    const duration = 2200;

    function rollStep() {
        const elapsed = Date.now() - startTime;
        if (elapsed < duration) {
            const speed = 50 + Math.pow(elapsed / duration, 3) * 300;
            const rand = pool[Math.floor(Math.random() * pool.length)];
            renderPickerDisplay(rand);
            pickerTimer = setTimeout(rollStep, speed);
        } else {
            pickerRolling = false;
            $('#startRollBtn').textContent = '再抽一次';
            $('#startRollBtn').style.opacity = '1';
            $('#startRollBtn').style.pointerEvents = 'auto';
            const finalStudent = pool[Math.floor(Math.random() * pool.length)];
            renderPickerDisplay(finalStudent);
            if (pickerTarget === 'pending') {
                $('#pickerSub').textContent = '😏 恭喜 ' + finalStudent.name + ' 被选中！奖励多抄写一页生字~';
            } else if (pickerTarget === 'passed') {
                $('#pickerSub').textContent = '🌟 恭喜 ' + finalStudent.name + ' 被选中！表现真棒~';
            } else {
                $('#pickerSub').textContent = '🎉 恭喜 ' + finalStudent.name + ' 被选中！';
            }
            const rect = $('#pickerDisplay').getBoundingClientRect();
            fxConfetti(rect.left + rect.width / 2, rect.top + rect.height / 2);
            fxFirework(rect.left + rect.width / 2, rect.top + rect.height / 2);
            playFanfare();
        }
    }
    rollStep();
}

function renderPickerDisplay(student) {

function saveRoster() {
    const tab = currentTab();
    const rows = $$('#rosterList .roster-row');
    if (rows.length === 0 && !confirm('名单将变为空，确定吗？')) return;
    const oldById = new Map(tab.students.map(s => [s.id, s]));
    const newStudents = [];
    const usedNames = new Set();
    let maxId = 0;
    tab.students.forEach(s => { if (s.id > maxId) maxId = s.id; });

    rows.forEach((row, i) => {
        const nameInput = row.querySelector('.ri-name');
        const sidInput  = row.querySelector('.ri-sid');
        const name = (nameInput.value || '').trim();
        if (!name) return;
        let finalName = name, n = 2;
        while (usedNames.has(finalName)) { finalName = name + '(' + n + ')'; n++; }
        usedNames.add(finalName);
        const rawId = row.dataset.id;
        let student;
        if (rawId && oldById.has(Number(rawId))) {
            student = Object.assign({}, oldById.get(Number(rawId)));
            student.name = finalName;
        } else {
            maxId += 1;
            student = { id: maxId, name: finalName, sid: '', avatarType: 'text', avatarData: '' };
        }
        student.id = Number(student.id);
        student.sid = (sidInput.value || '').trim() || String(i + 1).padStart(2, '0');
        newStudents.push(student);
    });

    const keepIds = new Set(newStudents.map(s => s.id));
    Object.keys(tab.passed).forEach(k => { if (!keepIds.has(Number(k))) delete tab.passed[k]; });
    tab.students = newStudents;
    save(); render(); closeModal('rosterModal'); toast('名单已保存');
}

function handleAvatarFile(event) {
    const input = event.target;
    const file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    if (!file.type || file.type.indexOf('image/') !== 0) { toast('请选择图片文件'); return; }
    const tab = currentTab();
    const student = tab.students.find(s => s.id === editingStudentId);
    if (!student) return;
    const reader = new FileReader();
    reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
            try {
                const MAX = 128;
                const w = img.naturalWidth || img.width;
                const h = img.naturalHeight || img.height;
                const side = Math.min(w, h);
                const sx = (w - side) / 2, sy = (h - side) / 2;
                const canvas = document.createElement('canvas');
                canvas.width = MAX; canvas.height = MAX;
                canvas.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, MAX, MAX);
                student.avatarType = 'image';
                student.avatarData = canvas.toDataURL('image/jpeg', 0.78);
                save(); render(); closeModal('avatarModal'); toast('头像已更新');
            } catch (err) { toast('图片处理失败'); }
        };
        img.onerror = function () { toast('图片读取失败'); };
        img.src = e.target.result;
    };
    reader.onerror = function () { toast('文件读取失败'); };
    reader.readAsDataURL(file);
}

function buildRecordHTML(tab, date, isHistory, records) {
    let passed, pending;
    if (isHistory) {
        passed = records.filter(r => r.passed);
        pending = records.filter(r => !r.passed);
    } else {
        passed = tab.students.filter(s => tab.passed[s.id]);
        pending = tab.students.filter(s => !tab.passed[s.id]);
    }
    let html = '';
    html += '<div class="report-title">' + esc(isHistory ? '' : tab.name) + ' 打卡记录</div>';
    html += '<div class="report-meta">';
    html += '📅 日期：<b>' + esc(date) + '</b><br>';
    html += '📊 已交 <b>' + passed.length + '</b> 人 / 未交 <b>' + pending.length + '</b> 人 / 共 <b>' + (passed.length + pending.length) + '</b> 人';
    html += '</div>';
    html += '<div class="report-sec ok"><h4>✅ 已完成（' + passed.length + '）</h4><div class="tags">';
    if (passed.length === 0) html += '<span class="tag">无</span>';
    else {
        passed.sort((a, b) => {
            const ta = isHistory ? a.time : (tab.passed[a.id] && tab.passed[a.id].time);
            const tb = isHistory ? b.time : (tab.passed[b.id] && tab.passed[b.id].time);
            return (ta || 0) - (tb || 0);
        }).forEach(s => {
            const t = isHistory ? s.time : tab.passed[s.id].time;
            const timeStr = t ? new Date(t).toTimeString().slice(0, 5) : '';
            html += '<span class="tag">' + esc(s.name) + (timeStr ? ' · ' + timeStr : '') + '</span>';
        });
    }
    html += '</div></div>';
    html += '<div class="report-sec no"><h4>❌ 未完成（' + pending.length + '）</h4><div class="tags">';
    if (pending.length === 0) html += '<span class="tag">无</span>';
    else pending.forEach(s => { html += '<span class="tag">' + esc(s.name) + '</span>'; });
    html += '</div></div>';
    return html;
}

function exportCSV() {

        const newState = {
            version: DATA_VERSION,
            activeTab: parsed.activeTab || Object.keys(parsed.tabs)[0],
            soundOn: typeof parsed.soundOn === 'boolean' ? parsed.soundOn : true,
            pinMode: typeof parsed.pinMode === 'boolean' ? parsed.pinMode : true,
            date: parsed.date || todayStr(),
            tabs: {},
            history: Array.isArray(parsed.history) ? parsed.history : []
        };
        Object.keys(parsed.tabs).forEach(k => {
            const t = parsed.tabs[k];
            newState.tabs[k] = {
                id: k, name: t.name || '未命名',
                students: Array.isArray(t.students) ? t.students.map((s, i) => ({
                    id: Number(s.id) || (i + 1),

                    sid: String(s.sid || (i + 1)).padStart(2, '0'),

                    avatarData: s.avatarData || ''

            };
        });
        state = newState;

        closeModal('backupModal'); toast('数据恢复成功');

    if (badge) { badge.textContent = state.pinMode ? '开' : '关'; badge.classList.toggle('off', !state.pinMode); }
    const btn = $('#pinBtn');
    if (btn) { btn.classList.toggle('on', !!state.pinMode); btn.title = state.pinMode ? '左侧头像固定：已开启' : '左侧头像固定：已关闭'; }
}

function togglePinMode(silent) {
    state.pinMode = !state.pinMode;
    save(); renderPinState(); render();
    if (!silent) toast(state.pinMode ? '📌 已开启固定：其他头像位置不动' : '已关闭固定：未交的卡片会自动补位');
}

function doReset() {
    const tab = currentTab();
    pushUndo(tab);
    tab.passed = {}; tab.seq = 0;
    comboCount = 0;
    save(); render(); toast('已重置「' + tab.name + '」的打卡记录');
}

/* ==========================================================================
   13. 事件绑定
   ========================================================================== */
elSoundBtn.addEventListener('click', () => { state.soundOn = !state.soundOn; save(); renderSoundBtn(); if (state.soundOn) playDing(); });
$('#micBtn').addEventListener('click', toggleMic);
$('#micThemeBtn').addEventListener('click', cycleWaveTheme);
$('#undoBtn').addEventListener('click', undo);
$('#saveTodayBtn').addEventListener('click', openSaveToday);
$('#csvBtn').addEventListener('click', exportCSV);
$('#randomBtn').addEventListener('click', openRandomModal);
$('#startRollBtn').addEventListener('click', startRoll);

$$('.picker-target button').forEach(btn => {
    btn.addEventListener('click', () => {
        if (pickerRolling) return;
        pickerTarget = btn.dataset.target;
        $$('.picker-target button').forEach(b => b.classList.toggle('active', b === btn));
    });
});

const pinBtnEl = $('#pinBtn');
if (pinBtnEl) pinBtnEl.addEventListener('click', (e) => { e.stopPropagation(); togglePinMode(); });

const elMenu = $('#menu');
$('#moreBtn').addEventListener('click', (e) => { e.stopPropagation(); elMenu.classList.toggle('active'); });
elMenu.addEventListener('click', (e) => { if (e.target === elMenu) elMenu.classList.remove('active'); });

$$('.menu-item[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
        const action = btn.dataset.action;
        elMenu.classList.remove('active');
        if (action === 'roster') openRoster();
        else if (action === 'pin') togglePinMode();
        else if (action === 'avatar') toggleEditMode();
        else if (action === 'record') openRecord();
        else if (action === 'history') openHistory();
        else if (action === 'backup') openBackup();
        else if (action === 'qrcode') openQRCode();
    });
});

$('#resetItem').addEventListener('click', () => {
    const tab = currentTab();
    if (tab.students.length === 0) return;
    if (confirm('确定要清空「' + tab.name + '」的所有打卡记录吗？\n（如果不小心点错，可以点“撤销”恢复）')) {
        doReset();
        elMenu.classList.remove('active');
    }
});

$$('[data-close]').forEach(btn => { btn.addEventListener('click', () => closeModal(btn.dataset.close)); });
$$('.modal').forEach(m => { m.addEventListener('click', e => { if (e.target === m) m.classList.remove('active'); }); });

$('#addTabBtn').addEventListener('click', openAddTab);
$('#confirmAddTabBtn').addEventListener('click', confirmAddTab);
$('#newTabName').addEventListener('keydown', e => { if (e.key === 'Enter') confirmAddTab(); });
$('#confirmSaveBtn').addEventListener('click', confirmSaveToday);
$('#projectName').addEventListener('keydown', e => { if (e.key === 'Enter') confirmSaveToday(); });
$('#addStudentBtn').addEventListener('click', addStudentRow);
$('#saveRosterBtn').addEventListener('click', saveRoster);
$('#bulkImportBtn').addEventListener('click', bulkImport);
$('#avatarCamera').addEventListener('change', handleAvatarFile);
$('#avatarFile').addEventListener('change', handleAvatarFile);
$('#avatarResetBtn').addEventListener('click', resetAvatar);
$('#copyBackupBtn').addEventListener('click', copyBackup);
$('#restoreBackupBtn').addEventListener('click', restoreBackup);

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        $$('.modal.active').forEach(m => m.classList.remove('active'));
        elMenu.classList.remove('active');
        if (editMode) toggleEditMode(false);
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        const active = document.activeElement;
        if (active && /input|textarea/i.test(active.tagName)) return;
        e.preventDefault(); undo();
    }
});

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { save(); saveProg(); } });
window.addEventListener('beforeunload', function () { save(); saveProg(); });

/* ==========================================================================
   14. 时钟与启动
   ========================================================================== */
function tickClock() {
    const d = new Date();
    elBigClock.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ':' + String(d.getSeconds()).padStart(2, '0');
    const dateEl = $('#clockDate');
    if (dateEl) {
        const wd = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
        const s = (d.getMonth() + 1) + '月' + d.getDate() + '日 · ' + wd;
        if (dateEl.textContent !== s) dateEl.textContent = s;
    }
    const t = todayStr();
    if (t !== state.date) {
        state.date = t;
        Object.keys(state.tabs).forEach(k => { state.tabs[k].passed = {}; state.tabs[k].seq = 0; });
        progRemaining = progDuration; progRunning = false; progEndAt = 0; progSaved = false; progValue = 0; progVoiceValue = 0;
        saveProg(); updateProgressUI(); comboCount = 0;
        save(); render(); toast('新的一天，打卡记录已重置');
    }
}

function boot() {
    state = initState();
    parseUrlParams();
    renderSoundBtn();
    renderPinState();
    pinyinReady = detectPinyin();
    render();
    initStage();
    startFxJanitor();
    tickClock();
    setInterval(tickClock, 1000);

    if (!pinyinReady) {
        let tries = 0;
        const timer = setInterval(() => {
            tries++;
            if (detectPinyin()) { pinyinReady = true; clearInterval(timer); pinyinCache.clear(); render(); }
            else if (tries >= 40) clearInterval(timer);
        }, 100);
    }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
</body>
</html>
