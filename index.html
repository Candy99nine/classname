<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>班级打卡 · 谁还没交一眼看清</title>

<!-- 拼音库：异步加载，失败自动回退 -->
<script async src="https://cdn.jsdelivr.net/npm/pinyin-pro@3/dist/index.js" onload="window.__pyLoadOk=true" onerror="window.__pyLoadFail=true"></script>
<!-- 二维码生成库 -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
/* ==========================================================================
   1. 设计变量 —— 糖果暖色系
   ========================================================================== */
:root{
    --bg:         #FFF9F3;
    --ink:        #5A4A42;
    --ink-soft:   #8A7568;
    --muted:      #B3A094;

    --pink:       #FF8FA3;
    --pink-soft:  #FFD9E0;
    --orange:     #FFB86B;
    --green:      #7ED9A0;
    --green-soft: #E2F8EA;

    --card:       #FFFFFF;
    --line:       #F2E8DE;
    --danger:     #E5674E;

    --radius:     18px;
    --shadow:     0 2px 6px rgba(255,143,163,.10), 0 6px 18px rgba(255,143,163,.08);
    --shadow-sm:  0 1px 3px rgba(140,110,90,.10);
}

/* ==========================================================================
   2. 基础重置
   ========================================================================== */
*{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

html, body{
    height: 100%;
    overflow: hidden;
}

body{
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB",
                 "Source Han Sans SC", "Noto Sans CJK SC", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-font-smoothing: antialiased;
    background-color: var(--bg);
    background-image:
        radial-gradient(circle at 8% 12%,  rgba(255,214,224,.55) 0%, transparent 38%),
        radial-gradient(circle at 92% 14%, rgba(255,228,196,.45) 0%, transparent 34%),
        radial-gradient(circle at 88% 88%, rgba(201,228,255,.45) 0%, transparent 38%),
        radial-gradient(circle at 12% 92%, rgba(214,245,214,.40) 0%, transparent 34%);
    background-attachment: fixed;
}

button, input, textarea{
    font-family: inherit;
    color: inherit;
    -webkit-user-select: auto;
    user-select: auto;
}

button{
    border: none;
    background: none;
    cursor: pointer;
    touch-action: manipulation;
}

/* ==========================================================================
   3. 整体骨架
   ========================================================================== */
.app{
    width: 100%;
    max-width: 1920px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px 14px 12px;
    overflow: hidden;
    position: relative;
}

/* ---------- 3.1 顶栏 ---------- */
.topbar{
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 48px;
}

.tabs-wrap{
    flex: none;
    display: flex;
    gap: 5px;
    align-items: center;
}
.tabs{
    display: flex;
    gap: 4px;
    padding: 4px;
    background: #FFF1E6;
    border-radius: 16px;
    box-shadow: inset 0 1px 2px rgba(255,184,107,.18);
    overflow-x: auto;
    scrollbar-width: none;
    max-width: 60vw;
}
.tabs::-webkit-scrollbar{ display: none; }

.tab{
    height: 42px;
    padding: 0 20px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 800;
    color: var(--muted);
    letter-spacing: .5px;
    transition: background .18s ease, color .18s ease, transform .12s ease;
    white-space: nowrap;
}
.tab:active{ transform: scale(.95); }
.tab.active{
    background: linear-gradient(135deg, #FF9FAE 0%, #FF8FA3 100%);
    color: #fff;
    box-shadow: 0 3px 10px rgba(255,143,163,.40);
}

.add-tab-btn{
    width: 42px;
    height: 42px;
    flex: none;
    border-radius: 12px;
    background: #FFF1E6;
    color: var(--pink);
    font-size: 22px;
    font-weight: bold;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-sm);
}
.add-tab-btn:active{ transform: scale(.92); }

.progress-wrap{
    flex: 1;
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    padding: 0 6px;
}

.prog-text{
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .5px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
}
.prog-text .num{ color: var(--pink); font-size: 24px; }

.prog-bar{
    flex: 1;
    min-width: 60px;
    height: 16px;
    background: #FFEBE0;
    border-radius: 99px;
    overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(255,143,163,.15);
    position: relative;
}
.topbar-fill{
    height: 100%;
    width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, #FFB86B 0%, #FF8FA3 60%, #FF7E96 100%);
    transition: width .5s cubic-bezier(.34,.9,.32,1);
    box-shadow: 0 0 8px rgba(255,143,163,.5);
}

.icon-btn{
    flex: none;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: #fff;
    box-shadow: var(--shadow-sm);
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .12s ease, background .18s ease;
}
.icon-btn:active{ transform: scale(.9); }
.icon-btn.off{ background: #F5ECE4; opacity: .7; }

/* ---------- 3.2 棋盘：左右两列 ---------- */
.board{
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 12px;
    flex-direction: row;
}

.column{
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    border-radius: 24px;
    padding: 10px 12px 12px;
    transition: background .2s ease;
}

.pending-col{
    background: #FFFFFF;
    box-shadow: inset 0 0 0 2.5px #FFE3E9, 0 6px 20px rgba(255,143,163,.10);
}
.passed-col{
    background: #F4FCF6;
    box-shadow: inset 0 0 0 2.5px #CFF0D9, 0 6px 20px rgba(126,217,160,.12);
}

.col-head{
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 6px 8px;
    margin-bottom: 6px;
    border-bottom: 2px dashed;
    gap: 8px;
}
.pending-col .col-head{ border-color: #FFE3E9; }
.passed-col .col-head{ border-color: #D6F0DE; }

.col-title{
    font-size: 16px;
    font-weight: 800;
    letter-spacing: .5px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex: none;
}
.pending-col .col-title{ color: #E76B87; }
.passed-col .col-title{ color: #3E9E68; }

.col-head-right{
    display: flex;
    align-items: center;
    gap: 6px;
    flex: none;
}

.pin-btn{
    width: 30px;
    height: 30px;
    flex: none;
    border-radius: 10px;
    font-size: 15px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F3ECE5;
    filter: grayscale(1);
    opacity: .55;
    transition: transform .18s ease, background .18s ease,
                opacity .18s ease, filter .18s ease, box-shadow .18s ease;
}
.pin-btn:active{ transform: scale(.88); }
.pin-btn.on{
    background: linear-gradient(135deg, #FF9FAE 0%, #FF8FA3 100%);
    filter: none;
    opacity: 1;
    box-shadow: 0 2px 8px rgba(255,143,163,.45);
    transform: rotate(-14deg);
}
.pin-btn.on:active{ transform: rotate(-14deg) scale(.88); }

.col-count{
    font-size: 15px;
    font-weight: 800;
    padding: 2px 12px;
    border-radius: 99px;
    font-variant-numeric: tabular-nums;
}
.pending-col .col-count{ background: #FFE9EE; color: #E76B87; }
.passed-col .col-count{ background: #D8F4E1; color: #3E9E68; }

.last-ten-tip{
    display: none;
    text-align: center;
    font-size: 15px;
    font-weight: 900;
    color: #E76B87;
    background: linear-gradient(135deg, #FFF0F3 0%, #FFE3E9 100%);
    border-radius: 14px;
    padding: 12px 10px;
    margin-bottom: 8px;
    box-shadow: 0 3px 12px rgba(255,143,163,.25);
    border: 2px dashed #FFB3C1;
    letter-spacing: .5px;
    flex: none;
}
.last-ten-tip.show{
    display: block;
    animation: pulseTip 1.2s ease-in-out infinite alternate;
}
@keyframes pulseTip{
    0% { transform: scale(1); }
    100% { transform: scale(1.03); }
}

.grid{
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
    gap: 8px;
    align-content: start;
    padding: 2px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
}
.grid::-webkit-scrollbar{ display: none; }

/* ---------- 3.3 卡片 ---------- */
.card{
    position: relative;
    height: 92px;
    border-radius: 20px;
    background: var(--card);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 8px 6px;
    transition: transform .12s ease, box-shadow .16s ease;
    overflow: hidden;
    transform: translateZ(0);
}
.card:active{ transform: scale(.93); }

.card::before{
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: var(--stripe, #FFD9E0);
    opacity: .9;
}

.avatar{
    width: 40px;
    height: 40px;
    border-radius: 50%;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    overflow: hidden;
    background: #FFD9E0;
    box-shadow: inset 0 -2px 4px rgba(0,0,0,.06);
}
.avatar img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.avatar.txt{
    color: #6A5548;
    font-size: 18px;
    letter-spacing: 0;
}

.cname{
    font-size: 17px;
    font-weight: 800;
    color: var(--ink);
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    letter-spacing: .2px;
}
.cname.long{ font-size: 14px; }

.passed-col .card{
    height: 82px;
    background: #FFFFFF;
    box-shadow: 0 1px 3px rgba(126,217,160,.18), 0 3px 10px rgba(126,217,160,.10);
}
.passed-col .card::before{ background: var(--green); height: 4px; }
.passed-col .avatar{ width: 34px; height: 34px; font-size: 17px; }
.passed-col .cname{ font-size: 15px; color: #3E7A55; }
.passed-col .cname.long{ font-size: 13px; }

body.edit-mode .pending-col .card{
    box-shadow: 0 0 0 3px var(--orange), var(--shadow);
}
body.edit-mode .passed-col .card{
    box-shadow: 0 0 0 3px var(--orange), var(--shadow-sm);
}

/* ---------- 3.3.1 左侧固定模式：已打卡的“占位卡” ---------- */
.pending-col .card.ghost{
    background: #FAF6F1;
    box-shadow: inset 0 0 0 2px #F1E7DD;
    opacity: .5;
    pointer-events: none;
    cursor: default;
}
.pending-col .card.ghost::before{ opacity: .3; }
.pending-col .card.ghost .avatar{ opacity: .55; }
.pending-col .card.ghost .cname{ color: var(--muted); }
.pending-col .card.ghost:active{ transform: translateZ(0); }

.ghost-mark{
    position: absolute;
    right: 5px;
    top: 8px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #7ED9A0;
    color: #fff;
    font-size: 12px;
    font-weight: 900;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 3px rgba(126,217,160,.5);
    z-index: 2;
}

/* 奖牌样式 */
.medal-badge{
    position: absolute;
    top: -4px;
    left: -4px;
    font-size: 22px;
    z-index: 3;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.2));
    animation: popInMedal .3s cubic-bezier(.2,1.2,.4,1) both;
}
@keyframes popInMedal{
    from{ transform: scale(0); opacity: 0; }
    to  { transform: scale(1); opacity: 1; }
}

body.edit-mode .pending-col .card.ghost{
    pointer-events: auto;
    box-shadow: 0 0 0 3px var(--orange), var(--shadow-sm);
}

.all-done-float{
    grid-column: 1 / -1;
    text-align: center;
    padding: 14px 10px;
    font-size: 15px;
    font-weight: 800;
    color: #3E9E68;
    background: #E9FBF0;
    border-radius: 14px;
    margin-top: 4px;
    letter-spacing: .5px;
}

.empty-tip{
    grid-column: 1 / -1;
    padding: 48px 12px;
    text-align: center;
    color: var(--muted);
    font-size: 16px;
    font-weight: 700;
    line-height: 1.8;
}
.empty-tip .big{ font-size: 40px; display: block; margin-bottom: 8px; }

/* ---------- 3.4 右侧底部控制台（时钟 + 音浪舞台） ---------- */
.right-dash{
    flex: none;
    margin-top: 10px;
    background: rgba(255,255,255,0.72);
    border-radius: 20px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: var(--shadow-sm);
    border: 1px solid #E6F6EC;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    position: relative;
    overflow: hidden;
}

.dash-top{
    display: flex;
    align-items: center;
    gap: 10px;
}

.clock-box{
    flex: 1;
    display: flex;
    align-items: baseline;
    gap: 10px;
    min-width: 0;
}
.big-clock{
    font-size: clamp(26px, 2.6vw, 44px);
    font-weight: 900;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    letter-spacing: 1.2px;
    line-height: 1;
    text-shadow: 0 2px 6px rgba(90,74,66,.10);
}
.clock-date{
    font-size: 12px;
    font-weight: 800;
    color: var(--muted);
    letter-spacing: .4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.mic-side{
    display: flex;
    gap: 6px;
    flex: none;
}
.mic-btn{
    width: 44px;
    height: 44px;
    border-radius: 13px;
    background: #FFF1E6;
    color: #C97B4E;
    font-size: 19px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .12s ease, background .2s ease, box-shadow .2s ease;
}
.mic-btn:active{ transform: scale(.92); }
.mic-btn.active{
    background: linear-gradient(135deg, #FF9FAE 0%, #FF8FA3 100%);
    color: #fff;
    box-shadow: 0 4px 14px rgba(255,143,163,.45);
    animation: micPulse 1.8s ease-in-out infinite;
}
@keyframes micPulse{
    0%,100%{ box-shadow: 0 4px 14px rgba(255,143,163,.45); }
    50%    { box-shadow: 0 4px 24px rgba(255,143,163,.90); }
}

.wave-stage{
    position: relative;
    width: 100%;
    height: 150px;
    border-radius: 16px;
    overflow: hidden;
    background: radial-gradient(130% 150% at 50% 115%, #FFEFF4 0%, #FFFBF7 65%, #FFFFFF 100%);
    box-shadow: inset 0 0 0 2px #FFE9EE, inset 0 -18px 26px rgba(255,143,163,.06);
    transition: box-shadow .25s ease;
    contain: paint;
}
.wave-stage.live{
    box-shadow: inset 0 0 0 2px #FFC9D6, inset 0 -18px 26px rgba(255,143,163,.12);
}
#waveCanvas{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}
.stage-dom{
    position: absolute;
    inset: 0;
    pointer-events: none;
}
.stage-dom > *{ position: absolute; }
.stage-dom button{ pointer-events: auto; }

.wave-badge{
    position: absolute;
    left: 10px;
    top: 9px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .4px;
    color: #C97B4E;
    background: rgba(255,255,255,.82);
    padding: 4px 11px;
    border-radius: 99px;
    pointer-events: none;
    white-space: nowrap;
    transition: background .25s ease, color .25s ease, box-shadow .25s ease;
    z-index: 6;
}
.wave-stage.live .wave-badge{
    color: #fff;
    background: linear-gradient(135deg, #FF9FAE 0%, #FF8FA3 100%);
    box-shadow: 0 3px 10px rgba(255,143,163,.42);
}

.mode-picker{
    position: absolute;
    left: 50%;
    bottom: 7px;
    transform: translateX(-50%);
    display: flex;
    gap: 3px;
    background: rgba(255,255,255,.78);
    padding: 4px;
    border-radius: 99px;
    z-index: 8;
    box-shadow: 0 2px 8px rgba(140,110,90,.12);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
}
.mode-btn{
    width: 30px;
    height: 26px;
    border-radius: 99px;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s ease, transform .12s ease, opacity .15s ease;
    opacity: .55;
    pointer-events: auto;
}
.mode-btn.active{
    background: linear-gradient(135deg, #FF9FAE 0%, #FF8FA3 100%);
    opacity: 1;
    box-shadow: 0 2px 6px rgba(255,143,163,.4);
    transform: scale(1.05);
}

/* ==========================================================
   双模式
   ========================================================== */
.dual-layer{
    position: absolute;
    inset: 0;
}

.dual-layer::before{
    content: '';
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse at 50% 60%, rgba(20, 24, 68, 0.92) 0%, rgba(14, 16, 44, 0.64) 36%, rgba(10, 10, 30, 0) 72%),
        radial-gradient(ellipse at 50% 55%, rgba(30, 34, 90, 0.42) 0%, transparent 60%);
    opacity: 0;
    transition: opacity .45s ease;
    pointer-events: none;
    z-index: 0;
}
.dual-layer.quiet::before{
    opacity: 1;
}

.dual-stars{
    position: absolute;
    inset: 0;
    z-index: 1;
}
.dual-stars i{
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #FFE8A8;
    box-shadow: 0 0 6px #FFE8A8, 0 0 12px rgba(255,220,120,.45);
    opacity: .15;
    transition: opacity .35s ease;
}

.dual-layer.quiet .dual-stars i{
    animation: starTwinkle 3.6s ease-in-out infinite;
    animation-delay: var(--tw, 0s);
}
@keyframes starTwinkle{
    0%, 100%{
        transform: scale(1);
        box-shadow: 0 0 6px #FFE8A8, 0 0 12px rgba(255,220,120,.45);
    }
    50%{
        transform: scale(1.45);
        box-shadow: 0 0 10px #FFF3C6, 0 0 22px rgba(255,225,120,.85);
    }
}

.dual-moon{
    position: absolute;
    left: 50%;
    top: 54%;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(var(--moon-scale, 1));
    background:
        radial-gradient(circle at 30% 28%, rgba(255,255,255,.62) 0%, rgba(255,255,255,0) 38%),
        radial-gradient(circle at 42% 64%, rgba(190,130,40,.32) 7%, rgba(190,130,40,0) 8%),
        radial-gradient(circle at 62% 38%, rgba(190,130,40,.24) 5%, rgba(190,130,40,0) 6%),
        radial-gradient(circle at 55% 74%, rgba(190,130,40,.18) 4%, rgba(190,130,40,0) 5%),
        radial-gradient(circle at 74% 58%, rgba(190,130,40,.16) 3.5%, rgba(190,130,40,0) 4.5%),
        radial-gradient(circle at 38% 38%, #FFFCE4 0%, #FFE68C 32%, #FFC849 66%, #EE9E22 100%);
    box-shadow:
        0 0 0 1px rgba(255,222,130,.55),
        0 0 14px rgba(255,214,100,.9),
        0 0 30px rgba(255,192,70,.62),
        0 0 60px rgba(255,172,50,.4),
        0 0 100px rgba(255,150,40,.2),
        inset -8px -8px 18px rgba(200,120,20,.32),
        inset 4px 4px 14px rgba(255,255,205,.42);
    opacity: .08;
    transition: opacity .35s ease, transform .35s ease;
    z-index: 3;
    will-change: opacity, transform;
}

.dual-layer.quiet .dual-moon{
    animation: moonBreath 3.4s ease-in-out infinite;
}
@keyframes moonBreath{
    0%, 100%{
        box-shadow:
            0 0 0 1px rgba(255,222,130,.55),
            0 0 14px rgba(255,214,100,.9),
            0 0 30px rgba(255,192,70,.62),
            0 0 60px rgba(255,172,50,.4),
            0 0 100px rgba(255,150,40,.2),
            inset -8px -8px 18px rgba(200,120,20,.32),
            inset 4px 4px 14px rgba(255,255,205,.42);
    }
    50%{
        box-shadow:
            0 0 0 1px rgba(255,222,130,.7),
            0 0 20px rgba(255,214,100,1),
            0 0 44px rgba(255,192,70,.85),
            0 0 84px rgba(255,172,50,.55),
            0 0 140px rgba(255,150,40,.3),
            inset -8px -8px 18px rgba(200,120,20,.32),
            inset 4px 4px 14px rgba(255,255,205,.42);
    }
}

.dual-val{
    position: absolute;
    left: 0;
    right: 0;
    top: 8px;
    text-align: center;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: .5px;
    color: #C97B4E;
    text-shadow: 0 1px 0 #fff;
    z-index: 4;
}
.dual-sub{
    position: absolute;
    right: 10px;
    top: 8px;
    display: flex;
    gap: 4px;
    z-index: 8;
    background: rgba(255,255,255,.78);
    padding: 3px;
    border-radius: 99px;
    box-shadow: 0 2px 8px rgba(140,110,90,.10);
}
.dual-sub button{
    width: 30px;
    height: 26px;
    border-radius: 99px;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: .55;
    transition: background .15s ease, opacity .15s ease;
}
.dual-sub button.active{
    background: linear-gradient(135deg, #FF9FAE 0%, #FF8FA3 100%);
    opacity: 1;
    box-shadow: 0 2px 6px rgba(255,143,163,.4);
}

.prog-layer{ position: absolute; inset: 0; }
.prog-track{
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(180deg, #EAF4FF, #D6E9FF);
    overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.06);
}
.swim-fill{
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 0;
    background: linear-gradient(90deg, rgba(110,198,255,.5), rgba(139,92,246,.5));
    border-radius: 12px;
    transition: width .3s linear;
}
.prog-swimmer{
    position: absolute;
    bottom: -2px;
    left: 3%;
    font-size: 26px;
    transform: translateX(-50%);
    transition: left .3s linear;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.15));
    z-index: 3;
}
.prog-goal{
    position: absolute;
    right: 4px;
    bottom: -2px;
    font-size: 24px;
    opacity: .8;
    z-index: 2;
}

/* 独立的倒计时小钟表 */
.prog-clock {
    position: absolute;
    right: 12px;
    top: 36px;
    background: rgba(255, 255, 255, 0.92);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    border-radius: 12px;
    padding: 6px 14px;
    font-size: 16px;
    font-weight: 900;
    color: var(--pink);
    box-shadow: 0 2px 10px rgba(255, 143, 163, 0.25);
    border: 1.5px solid #FFE9EE;
    display: none;
    align-items: center;
    gap: 6px;
    z-index: 7;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
}
.prog-clock.show {
    display: flex;
}
.prog-clock .unit {
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0;
    font-weight: 800;
}

.prog-toolbar{
    position: absolute;
    left: 10px;
    right: 10px;
    top: 8px;
    height: 26px;
    display: flex;
    align-items: center;
    gap: 5px;
    z-index: 8;
    pointer-events: none;
}
.prog-toolbar > *{ pointer-events: auto; }

.pm-switch{
    display: flex;
    gap: 2px;
    padding: 2px;
    height: 26px;
    border-radius: 99px;
    background: rgba(255,255,255,.82);
    box-shadow: 0 2px 8px rgba(140,110,90,.10);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
}
.pm-btn{
    width: 28px;
    height: 22px;
    border-radius: 99px;
    font-size: 13px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: .55;
    transition: background .15s ease, opacity .15s ease;
}
.pm-btn.active{
    background: linear-gradient(135deg, #FF9FAE 0%, #FF8FA3 100%);
    opacity: 1;
    box-shadow: 0 2px 6px rgba(255,143,163,.4);
}

.prog-setter{
    display: flex;
    align-items: center;
    gap: 3px;
    height: 26px;
    padding: 0 3px 0 8px;
    border-radius: 99px;
    background: rgba(255,255,255,.82);
    box-shadow: 0 2px 8px rgba(140,110,90,.10);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    font-size: 12px;
    font-weight: 800;
    color: #C97B4E;
}
.prog-setter *{ pointer-events: auto; }
.prog-setter input{
    width: 42px;
    height: 19px;
    padding: 0;
    border: none;
    outline: none;
    border-radius: 6px;
    background: #FFF3E6;
    color: #C97B4E;
    font-size: 12px;
    font-weight: 800;
    text-align: center;
    -moz-appearance: textfield;
}
.prog-setter input::-webkit-outer-spin-button,
.prog-setter input::-webkit-inner-spin-button{
    -webkit-appearance: none;
    margin: 0;
}
.prog-setter .ps-unit{
    font-size: 11px;
    opacity: .8;
}
.prog-setter button{
    height: 19px;
    padding: 0 9px;
    border-radius: 99px;
    background: linear-gradient(135deg, #FF9FAE 0%, #FF8FA3 100%);
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
}
.prog-setter button:active{ transform: scale(.94); }

.prog-reset{
    margin-left: auto;
    width: 26px;
    height: 26px;
    border-radius: 99px;
    font-size: 14px;
    background: rgba(255,255,255,.82);
    color: #8A7568;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(140,110,90,.10);
}
.prog-reset:active{ transform: scale(.92); }

.balloon-layer{
    position: absolute;
    inset: 0;
    overflow: hidden;
}
.balloon{
    position: absolute;
    font-size: 22px;
    bottom: -30px;
    will-change: transform;
    pointer-events: none;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.06));
}

/* ---------- 3.5 底部工具栏 ---------- */
.bottombar{
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    position: relative;
    z-index: 5;
}

.tb{
    height: 50px;
    padding: 0 18px;
    border-radius: 15px;
    background: #fff;
    box-shadow: var(--shadow-sm);
    font-size: 15px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: .3px;
    white-space: nowrap;
    transition: transform .12s ease, background .16s ease;
}
.tb:active{ transform: scale(.95); }
.tb.primary{
    background: linear-gradient(135deg, #FF9FAE 0%, #FF8FA3 100%);
    color: #fff;
    box-shadow: 0 3px 12px rgba(255,143,163,.40);
}
.tb.more{
    width: 50px;
    padding: 0;
    font-size: 24px;
    margin-left: auto;
    line-height: 1;
}
#randomBtn{
    background: #E6F7EC;
    color: #3E9E68;
}

/* ==========================================================================
   4. 点击特效层
   ========================================================================== */
#fxLayer{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    overflow: hidden;
    contain: strict;
}

.fx-item{
    position: fixed;
    pointer-events: none;
    will-change: transform, opacity;
    font-size: 20px;
    line-height: 1;
    z-index: 9999;
}

#comboLayer{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9998;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}
.combo-item{
    position: absolute;
    font-size: 60px;
    font-weight: 900;
    color: #FF8FA3;
    text-shadow: 3px 3px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 0 10px 20px rgba(255,143,163,.5);
    opacity: 0;
    transform: scale(0.5);
}

/* ==========================================================================
   5. 弹窗通用
   ========================================================================== */
.modal{
    position: fixed;
    inset: 0;
    background: rgba(90,74,66,.42);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
}
.modal.active{ display: flex; }

.modal-card{
    width: 100%;
    max-width: 520px;
    max-height: 88vh;
    background: #fff;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 24px 70px rgba(90,74,66,.32);
    animation: popIn .22s cubic-bezier(.2,1.2,.4,1);
}
@keyframes popIn{
    from{ transform: scale(.94); opacity: 0; }
    to  { transform: scale(1);   opacity: 1; }
}

.modal-head{
    flex: none;
    padding: 18px 20px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}
.modal-head h3{
    font-size: 18px;
    font-weight: 800;
    letter-spacing: .3px;
    color: var(--ink);
}
.modal-head .x{
    width: 40px;
    height: 40px;
    flex: none;
    border-radius: 50%;
    background: #FFF1E6;
    color: var(--ink-soft);
    font-size: 22px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-body{
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 4px 20px 16px;
    -webkit-overflow-scrolling: touch;
}

.modal-foot{
    flex: none;
    display: flex;
    gap: 10px;
    padding: 12px 20px 18px;
    border-top: 1px solid var(--line);
}

.btn-main, .btn-ghost{
    flex: 1;
    height: 50px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: .3px;
}
.btn-main{
    background: linear-gradient(135deg, #FF9FAE 0%, #FF8FA3 100%);
    color: #fff;
    box-shadow: 0 3px 10px rgba(255,143,163,.35);
}
.btn-ghost{ background: #FFF1E6; color: var(--ink); }
.btn-main:active, .btn-ghost:active{ transform: scale(.98); }

.field{ margin-bottom: 14px; }
.field label{
    display: block;
    font-size: 14px;
    font-weight: 800;
    color: var(--ink-soft);
    margin-bottom: 6px;
    letter-spacing: .3px;
}
.field input[type=text],
.field input[type=date],
.field textarea{
    width: 100%;
    padding: 12px 14px;
    border: 2px solid var(--line);
    border-radius: 13px;
    font-size: 16px;
    background: #FFFCF9;
    outline: none;
    transition: border-color .16s ease;
}
.field input:focus, .field textarea:focus{ border-color: var(--pink); }
.field textarea{ resize: vertical; min-height: 90px; line-height: 1.5; }

/* ==========================================================================
   6. 菜单弹层
   ========================================================================== */
.menu{
    position: fixed;
    inset: 0;
    background: rgba(90,74,66,.32);
    display: none;
    z-index: 90;
}
.menu.active{ display: block; }

.menu-panel{
    position: absolute;
    right: 14px;
    bottom: 76px;
    width: 244px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 18px 50px rgba(90,74,66,.32);
    padding: 8px;
    overflow: hidden;
    animation: menuIn .18s cubic-bezier(.2,1.1,.4,1);
}
@keyframes menuIn{
    from{ transform: translateY(10px) scale(.96); opacity: 0; }
    to  { transform: translateY(0) scale(1); opacity: 1; }
}

.menu-item{
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    height: 50px;
    padding: 0 14px;
    border-radius: 13px;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    overflow: hidden;
    text-align: left;
}
.menu-item:active{ background: #FFF1E6; }
.menu-item .ico{
    width: 22px;
    font-size: 18px;
    text-align: center;
    flex: none;
}
.menu-item.danger{ color: var(--danger); }

.pin-state{
    margin-left: auto;
    flex: none;
    font-size: 12px;
    font-weight: 800;
    padding: 3px 11px;
    border-radius: 99px;
    background: #FFE9EE;
    color: #E76B87;
    letter-spacing: .5px;
}
.pin-state.off{
    background: #F0E9E2;
    color: var(--muted);
}

/* ==========================================================================
   7. 名单编辑 / 抽签弹窗
   ========================================================================== */
.roster-list{
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 10px;
}
.roster-row{
    display: flex;
    gap: 6px;
    align-items: center;
}
.roster-row input{
    height: 44px;
    padding: 0 10px;
    border: 2px solid var(--line);
    border-radius: 11px;
    font-size: 15px;
    background: #FFFCF9;
    outline: none;
    min-width: 0;
}
.roster-row input:focus{ border-color: var(--pink); }
.roster-row .ri-sid{ width: 66px; text-align: center; flex: none; font-variant-numeric: tabular-nums; }
.roster-row .ri-name{ flex: 1; }
.roster-row .del{
    width: 44px;
    height: 44px;
    flex: none;
    border-radius: 11px;
    background: #FDEDEA;
    color: var(--danger);
    font-size: 22px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
}

.picker-content{
    text-align: center;
    padding: 20px 0;
}
.picker-display{
    width: 140px;
    height: 140px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #FFFAF5;
    border: 4px dashed #FFB3C1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 900;
    color: #E76B87;
    transition: transform .1s ease;
    position: relative;
    overflow: hidden;
}
.picker-display img{
    width: 100%; height: 100%; object-fit: cover;
}
.picker-display .av{
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    font-size: 60px;
}
.picker-sub{
    font-size: 15px;
    color: var(--ink-soft);
    margin-bottom: 16px;
    font-weight: 800;
    min-height: 22px;
}
.picker-target{
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
}
.picker-target button{
    height: 36px;
    padding: 0 20px;
    border-radius: 99px;
    font-size: 14px;
    font-weight: 800;
    background: #FFF1E6;
    color: var(--ink-soft);
}
.picker-target button.active{
    background: linear-gradient(135deg, #FF9FAE 0%, #FF8FA3 100%);
    color: #fff;
    box-shadow: 0 3px 8px rgba(255,143,163,.4);
}

.add-row{
    width: 100%;
    height: 48px;
    border-radius: 13px;
    background: #FFF1E6;
    color: #C97B4E;
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 14px;
}

.bulk-box{
    background: #FFFAF5;
    border-radius: 13px;
    padding: 12px;
    margin-bottom: 6px;
    border: 1.5px dashed #FFE3C4;
}
.bulk-box summary{
    font-size: 14px;
    font-weight: 800;
    color: #C97B4E;
    cursor: pointer;
    outline: none;
    margin-bottom: 2px;
}
.bulk-box textarea{
    width: 100%;
    min-height: 120px;
    margin-top: 10px;
    padding: 10px;
    border: 2px solid var(--line);
    border-radius: 11px;
    font-size: 15px;
    line-height: 1.6;
    background: #fff;
    outline: none;
    resize: vertical;
}
.bulk-box button{
    margin-top: 8px;
    height: 44px;
    padding: 0 20px;
    border-radius: 11px;
    background: linear-gradient(135deg, #FF9FAE 0%, #FF8FA3 100%);
    color: #fff;
    font-size: 15px;
    font-weight: 800;
}

/* ==========================================================================
   8. 记录 / 历史 / 头像 / 备份
   ========================================================================== */
.report-box{
    background: #FFFAF5;
    border-radius: 16px;
    padding: 16px;
}
.report-title{
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 10px;
}
.report-meta{
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.8;
    padding-bottom: 10px;
    border-bottom: 2px dashed var(--line);
    margin-bottom: 12px;
}
.report-meta b{ color: var(--ink); font-weight: 800; }

.report-sec{ margin-bottom: 14px; }
.report-sec h4{
    font-size: 14px;
    font-weight: 800;
    margin-bottom: 8px;
    letter-spacing: .3px;
}
.report-sec.ok h4{ color: #3E9E68; }
.report-sec.no h4{ color: #E76B87; }
.tags{ display: flex; flex-wrap: wrap; gap: 6px; }
.tag{
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    background: #F4ECE4;
    color: var(--ink);
}
.report-sec.ok .tag{ background: #E2F8EA; color: #3E8A5C; }
.report-sec.no .tag{ background: #FFE9EE; color: #D9567A; }
.tag img{ width: 18px; height: 18px; border-radius: 50%; object-fit: cover; }

.his-row{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 6px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background .2s;
    border-radius: 8px;
}
.his-row:active{ background: #FFF1E6; }
.his-row:last-child{ border-bottom: none; }
.his-date{
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    width: 85px;
    flex: none;
}
.his-name{
    flex: 1;
    font-size: 16px;
    font-weight: 800;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.his-num{
    font-size: 15px;
    font-weight: 800;
    color: #3E9E68;
    font-variant-numeric: tabular-nums;
    flex: none;
}
.empty-hint{
    text-align: center;
    color: var(--muted);
    font-size: 15px;
    padding: 30px 0;
    font-weight: 700;
    line-height: 1.9;
}

.upload-label{
    display: block;
    width: 100%;
    height: 50px;
    line-height: 50px;
    text-align: center;
    background: linear-gradient(135deg, #FF9FAE 0%, #FF8FA3 100%);
    color: #fff;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(255,143,163,.30);
}
#avatarCamera, #avatarFile{ display: none; }

.emoji-grid{
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
}
.emoji-item{
    aspect-ratio: 1;
    border-radius: 13px;
    background: #FFF6EE;
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid transparent;
}
.emoji-item.selected{
    border-color: var(--pink);
    background: #FFE9EE;
}

#toast{
    position: fixed;
    left: 50%;
    bottom: 92px;
    transform: translateX(-50%) translateY(12px);
    background: rgba(90,74,66,.93);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    padding: 10px 22px;
    border-radius: 24px;
    max-width: 78%;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s ease, transform .22s ease;
    z-index: 300;
}
#toast.show{
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* ==========================================================================
   9. 响应式
   ========================================================================== */
@media (max-width: 768px){
    .app{ padding: 8px; gap: 8px; }

    .topbar{ flex-wrap: wrap; row-gap: 8px; }
    .tabs-wrap{ width: 100%; }
    .tabs{ max-width: 85vw; }
    .progress-wrap{
        order: 3;
        flex-basis: 100%;
        width: 100%;
        padding: 0;
    }
    .icon-btn{ order: 2; margin-left: auto; width: 44px; height: 44px; font-size: 18px; }
    .tab{ padding: 0 14px; font-size: 15px; height: 38px; }
    .prog-text{ font-size: 16px; }
    .prog-text .num{ font-size: 18px; }

    .board{ flex-direction: column; gap: 8px; }
    .column{ border-radius: 20px; padding: 8px 10px 10px; }
    .col-title{ font-size: 14px; }

    .pin-btn{ width: 27px; height: 27px; font-size: 13px; border-radius: 9px; }
    .col-count{ font-size: 13px; padding: 2px 10px; }
    
    .last-ten-tip{ font-size: 13px; padding: 8px; margin-bottom: 6px; }

    .grid{ grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 6px; }
    .card{ height: 76px; border-radius: 16px; }
    .avatar{ width: 30px; height: 30px; font-size: 16px; }
    .cname{ font-size: 14px; }
    .cname.long{ font-size: 12px; }
    .passed-col .card{ height: 70px; }
    .passed-col .avatar{ width: 26px; height: 26px; font-size: 14px; }
    .passed-col .cname{ font-size: 13px; }
    .ghost-mark{ width: 15px; height: 15px; font-size: 10px; right: 4px; top: 6px; }

<body>

<div class="app">

    <!-- 顶栏 -->

        <div class="tabs-wrap">

            <!-- 右侧控制台 -->

                            <div class="dual-moon" id="dualMoon"></div>
                            <div class="dual-val" id="dualVal">0%</div>
                            <div class="dual-sub" id="dualSub">
                                <button data-dual="read" class="active" title="读书模式">📣</button>
                                <button data-dual="quiet" title="安静模式">🌙</button>
                            </div>
                        </div>

                        <!-- 鲸鱼进度（时间倒计时 / 音控倒计时） -->
                        <div class="prog-layer" id="progLayer" style="display:none;">
                            <!-- 新增的倒计时小钟表 -->
                            <div class="prog-clock" id="progClock">
                                ⏳ <span id="progClockText">05:00</span> <span class="unit">剩余</span>
                            </div>
                            
                            <div class="prog-track">
                                <div class="swim-fill" id="progFillBar"></div>
                                <div class="prog-swimmer" id="progSwimmer">🐋</div>
                                <div class="prog-goal">🏝</div>
                            </div>
                            <div class="prog-toolbar" id="progToolbar">
                                <div class="pm-switch" id="progModeSwitch">
                                    <button class="pm-btn active" data-pmode="time" title="时间倒计时">⏳</button>
                                    <button class="pm-btn" data-pmode="voice" title="音控倒计时">🎤</button>
                                </div>
                                <div class="prog-setter" id="progSetter">
                                    <input type="number" id="progMinutes" min="0.5" max="180" step="0.5" value="5" inputmode="decimal" aria-label="倒计时分钟数">
                                    <span class="ps-unit">分</span>
                                    <button id="progApply" title="按设定分钟开始倒计时">设定</button>
                                </div>

                    </div>

                        <button class="mode-btn" data-mode="dual" title="双模式">🌙</button>
                        <button class="mode-btn" data-mode="progress" title="鲸鱼倒计时">🐋</button>
                        <button class="mode-btn" data-mode="firework" title="烟花">🎆</button>
                        <button class="mode-btn" data-mode="balloon" title="气球">🎈</button>
                    </div>

                    <span class="wave-badge" id="waveBadge">🎤 点击开启音浪</span>
                </div>
            </div>
        </section>
    </main>

<script>
(function () {
'use strict';

/* ==========================================================================
   1. 常量与数据结构
   ========================================================================== */
const STORAGE_KEY  = 'daka_v5';
const DATA_VERSION = 5;
const PROG_KEY     = 'daka_prog_v1';

const DEFAULT_TABS = [
    { id: 'morning',    name: '早读' },
    { id: 'homework',   name: '作业' },
    { id: 'recitation', name: '背诵' }
];

const DEFAULT_NAMES = [
    '郭津杭', '李思蕊', '刘承晔', '刘恩山', '刘翰璋',
    '刘昊哲', '刘铭浩', '刘依牧', '刘怡甯', '刘羽默',
    '刘振凯', '刘子霖', '刘梓颖桦', '王溪芮', '许钰涵',
    '杨淇淋', '杨熙硕', '杨惜雅', '张晨旭', '张美兰',
    '张恬伊', '张熙若霖', '张栩飒', '张钰澍', '张悦晴',
    '张运达', '张泽航', '张梓栋', '张梓濠'
];

const EMOJIS = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮',
                '🐷','🐸','🐵','🐔','🐧','🐦','🐤','🦄','🐝','🦋','🐞','🐢',
                '🐬','🐳','🦖','🦕','🐙','🦉'];

const CANDY = [
    '#FFB3C1', '#FFC98F', '#FFE08A', '#9BE3B4',
    '#9CCEFF', '#C6B2F0', '#8FE0D8', '#FF9E9E'
];

let state = null;
let pinyinReady = false;
const pinyinCache = new Map();
const undoStack = [];
let editMode = false;
let editingStudentId = null;
let audioCtx = null;

let comboCount = 0;
let lastPassTime = 0;

let pickerTarget = 'pending';
let pickerRolling = false;
let pickerTimer = null;

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

const elPendingGrid = $('#pendingGrid');
const elPassedGrid  = $('#passedGrid');
const elPendingCnt  = $('#pendingCount');
const elPassedCnt   = $('#passedCount');
const elProgText    = $('#progText');
const elProgFill    = $('#progFill');
const elBigClock    = $('#bigClock');
const elTabs        = $('#tabs');
const elSoundBtn    = $('#soundBtn');
const elLastTenTip  = $('#lastTenTip');
const elComboLayer  = $('#comboLayer');

/* ==========================================================================
   2. 通用工具
   ========================================================================== */
function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' +
           String(d.getMonth() + 1).padStart(2, '0') + '-' +
           String(d.getDate()).padStart(2, '0');
}

function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

let toastTimer = null;
function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

function reduceMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function openModal(id)  { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

function currentTab() {
    return state.tabs[state.activeTab] || Object.values(state.tabs)[0];
}

function candyOf(id) {
    return CANDY[(Math.max(1, id) - 1) % CANDY.length];
}

function fmtClock(sec) {
    sec = Math.max(0, Math.ceil(sec));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function minutesText(totalSec) {
    const m = totalSec / 60;
    return Number.isInteger(m) ? String(m) : String(Math.round(m * 10) / 10);
}

/* ==========================================================================
   3. 状态初始化 / 持久化
   ========================================================================== */
function createTab(def, names) {
    return {
        id: def.id,
        name: def.name,
        students: names.map((n, i) => ({
            id: i + 1,
            name: n,
            sid: String(i + 1).padStart(2, '0'),
            avatarType: 'text',
            avatarData: ''
        })),
        passed: {},
        seq: 0
    };
}

function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
    } catch (e) { return null; }
}

function initState() {
    let s = loadState();

    if (!s || !s.tabs) {
        s = {
            version: DATA_VERSION,
            activeTab: DEFAULT_TABS[0].id,
            soundOn: true,
            pinMode: true,
            date: todayStr(),
            tabs: {},
            history: []
        };
        DEFAULT_TABS.forEach(def => { s.tabs[def.id] = createTab(def, DEFAULT_NAMES); });
    }

    Object.keys(s.tabs).forEach(k => {
        const t = s.tabs[k];
        if (!t.passed) t.passed = {};
        if (typeof t.seq !== 'number') t.seq = 0;
        if (!Array.isArray(t.students)) t.students = [];
    });

    if (s.date !== todayStr()) {
        s.date = todayStr();
        Object.keys(s.tabs).forEach(k => {
            s.tabs[k].passed = {};
            s.tabs[k].seq = 0;
        });
    }

    if (!s.tabs[s.activeTab]) s.activeTab = Object.keys(s.tabs)[0];
    if (!Array.isArray(s.history)) s.history = [];
    if (typeof s.soundOn !== 'boolean') s.soundOn = true;
    if (typeof s.pinMode !== 'boolean') s.pinMode = true;

    return s;
}

function save() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
        toast('本地存储空间不足');
    }
}

function parseUrlParams() {
    try {
        const params = new URLSearchParams(location.search);
        const taskName = params.get('task');
        if (taskName) {
            let targetId = null;
            for (const id in state.tabs) {
                if (state.tabs[id].name === taskName) {
                    targetId = id; break;
                }
            }
            if (targetId) {
                state.activeTab = targetId;
            } else {
                const newId = 'custom_' + Date.now();
                const sourceStudents = state.tabs[DEFAULT_TABS[0].id]
                    ? JSON.parse(JSON.stringify(state.tabs[DEFAULT_TABS[0].id].students))
                    : createTab({id:newId,name:taskName}, DEFAULT_NAMES).students;
                state.tabs[newId] = {
                    id: newId, name: taskName, students: sourceStudents,
                    passed: {}, seq: 0
                };
                state.activeTab = newId;
            }
            save();
            history.replaceState({}, document.title, location.pathname);
        }
    } catch (e) {}
}

/* ==========================================================================
   5. 拼音排序
   ========================================================================== */
function detectPinyin() {
    try {
        if (window.pinyinPro && typeof window.pinyinPro.pinyin === 'function') {
            const r = window.pinyinPro.pinyin('张', { toneType: 'none', type: 'array' });
            if (Array.isArray(r) && r.length && /^[a-z]/i.test(r[0])) return true;
        }
    } catch (e) {}
    return false;
}

function fullPinyin(name) {
    if (pinyinCache.has(name)) return pinyinCache.get(name);
    let v = String(name).toLowerCase();
    if (pinyinReady) {
        try {
            const arr = window.pinyinPro.pinyin(name, { toneType: 'none', type: 'array' });
            if (Array.isArray(arr) && arr.length) v = arr.join('').toLowerCase();
        } catch (e) {}
    }
    pinyinCache.set(name, v);
    return v;
}

function sortPending(tab) {
    const pending = tab.students.filter(s => !tab.passed[s.id]);
    if (!pinyinReady) return pending;
    return pending.slice().sort((a, b) => {
        const pa = fullPinyin(a.name);
        const pb = fullPinyin(b.name);
        if (pa !== pb) return pa < pb ? -1 : 1;
        return a.id - b.id;
    });
}

function sortedAll(tab) {
    const list = tab.students.slice();
    if (!pinyinReady) return list;
    return list.sort((a, b) => {
        const pa = fullPinyin(a.name);
        const pb = fullPinyin(b.name);
        if (pa !== pb) return pa < pb ? -1 : 1;
        return a.id - b.id;
    });
}

const MAX_BARS = 48;
const WAVE_THEMES = [
    { name: '糖果', colors: ['#FF8FA3', '#FFB86B', '#FFD93D', '#7ED9A0', '#6EC6FF'] }
];

let micStream = null;
let audioAnalyser = null;
let micDataArray = null;

let waveCanvas = null, waveCtx = null;
let waveW = 0, waveH = 0, waveDPR = 1;
let barCount = 24;
let barLevels = new Float32Array(MAX_BARS);
let barPeaks  = new Float32Array(MAX_BARS);
const barTargets = new Float32Array(MAX_BARS);
let waveParticles = [];
let waveLevel = 0;
let micLevel = 0;
let waveRunning = false;

let progMode      = 'time';
let progDuration  = PROG_DEFAULT_SEC;
let progRemaining = PROG_DEFAULT_SEC;
let progEndAt     = 0;
let progRunning   = false;
let progVoiceValue = 0;

function hexToRgb(hex) {
    let h = String(hex).replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const n = parseInt(h, 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function rgbToHex(r, g, b) {
    const f = v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0');
    return '#' + f(r) + f(g) + f(b);
}
function mixHex(a, b, t) {
    const A = hexToRgb(a), B = hexToRgb(b);
    return rgbToHex(A.r + (B.r - A.r) * t, A.g + (B.g - A.g) * t, A.b + (B.b - A.b) * t);
}
function themeColor(theme, t) {
    const cols = theme.colors;
    const seg = cols.length - 1;
    const p = Math.max(0, Math.min(1, t)) * seg;
    const i = Math.min(seg - 1, Math.floor(p));
    return mixHex(cols[i], cols[i + 1], p - i);
}

function loadProg() {
    try {
        const raw = localStorage.getItem(PROG_KEY);
        if (!raw) return;
        const o = JSON.parse(raw);
        if (!o || o.date !== todayStr()) return;
        if (typeof o.duration !== 'number' || o.duration <= 0) return;

        progMode = (o.mode === 'voice') ? 'voice' : 'time';
        progDuration = Math.max(PROG_MIN_SEC, Math.min(PROG_MAX_SEC, o.duration));
        progSaved = !!o.saved;
        progVoiceValue = (typeof o.voiceValue === 'number') ? Math.max(0, Math.min(100, o.voiceValue)) : 0;

        if (progMode === 'time') {
            if (o.running && typeof o.endAt === 'number') {
                progEndAt = o.endAt;
                progRemaining = Math.max(0, (progEndAt - Date.now()) / 1000);
                progRunning = progRemaining > 0;
                if (!progRunning) {
                    progRemaining = 0;
                    progSaved = true;
                }
            } else {
                progRunning = false;
                progEndAt = 0;
                progRemaining = (typeof o.remaining === 'number') ? Math.max(0, Math.min(o.remaining, progDuration)) : progDuration;
            }
        } else {
            progRunning = false;
            progEndAt = 0;
            progRemaining = progDuration;
        }
    } catch (e) {}
}

function saveProg() {
    try {
        localStorage.setItem(PROG_KEY, JSON.stringify({
            date: todayStr(),
            mode: progMode,
            duration: progDuration,
            remaining: progRemaining,
            running: progRunning,
            endAt: progEndAt,
            saved: progSaved,
            voiceValue: progVoiceValue
        }));
    } catch (e) {}
}

function throttledSaveProg() {
    if (progSaveTimer) return;
    progSaveTimer = setTimeout(() => {
        progSaveTimer = null;
        saveProg();
    }, 2000);
}

function computeProgValue() {
    if (progMode === 'time') {
        return progDuration > 0 ? Math.max(0, Math.min(100, (1 - progRemaining / progDuration) * 100)) : 0;
    }
    return progVoiceValue;
}

function setStageMode(mode) {
    if (stageMode === mode) return;
    stageMode = mode;
    if (waveStage) waveStage.dataset.mode = mode;

    if (waveCtx) waveCtx.clearRect(0, 0, waveW, waveH);
    fwParticles.length = 0;
    fwTimer = 0;

    if (mode !== 'balloon') {
        balloonEls.forEach(b => b.el.remove());
        balloonEls.length = 0;
    }

    dualLayer.style.display = mode === 'dual' ? 'block' : 'none';
    progLayer.style.display = mode === 'progress' ? 'block' : 'none';
    balloonLayer.style.display = mode === 'balloon' ? 'block' : 'none';

    modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));

        if (progMode === 'time') {
            if (!progRunning && !progSaved) {

            }
        }
        updateProgressUI();
    }

    updateWaveBadge();

function resizeWave() {
    if (!waveCanvas || !waveStage) return;
    const rect = waveCanvas.getBoundingClientRect();
    waveDPR = Math.min(window.devicePixelRatio || 1, 2);
    waveW = Math.max(1, Math.round(rect.width));
    waveH = Math.max(1, Math.round(rect.height));
    waveCanvas.width  = Math.round(waveW * waveDPR);
    waveCanvas.height = Math.round(waveH * waveDPR);
    waveCtx.setTransform(waveDPR, 0, 0, waveDPR, 0, 0);
    barCount = Math.max(10, Math.min(MAX_BARS, Math.floor(waveW / 20)));
}

function startStageLoop() {
    if (waveRunning) return;
    waveRunning = true;
    lastFrameT = 0;
    waveRaf = requestAnimationFrame(stageLoop);
}

function stageLoop(now) {
    if (!waveRunning) return;
    if (!lastFrameT) lastFrameT = now;
    let dt = (now - lastFrameT) / 16.667;
    if (dt > 3) dt = 3;
    if (dt < 0.2) dt = 0.2;
    lastFrameT = now;

    let freqData = null;
    if (audioAnalyser && micDataArray) {
        audioAnalyser.getByteFrequencyData(micDataArray);
        freqData = micDataArray;
    }

    updateMicLevel(freqData);

    if (stageMode === 'wave') {
        stepWaveBars(freqData, now, dt);
        drawWave();
    } else if (stageMode === 'firework') {
        renderFirework(now, dt);
    } else if (stageMode === 'dual') {
        renderDual();
    } else if (stageMode === 'progress') {
        renderStageProgress(dt);
    } else if (stageMode === 'balloon') {
        renderBalloon(now, dt);
    }

    updateWaveBadge();
    waveRaf = requestAnimationFrame(stageLoop);
}

function updateMicLevel(freqData) {
    if (freqData) {
        let sum = 0;
        const n = Math.min(64, freqData.length);
        for (let i = 0; i < n; i++) sum += freqData[i];
        const raw = sum / n / 255;
        micLevel += (raw - micLevel) * 0.25;
    } else {
        const t = performance.now() / 1000;
        const sim = 0.06 + 0.04 * Math.sin(t * 1.2) + 0.02 * Math.sin(t * 3.1);
        micLevel += (sim - micLevel) * 0.08;
    }
    if (micLevel < 0) micLevel = 0;
    if (micLevel > 1) micLevel = 1;
}

function stepWaveBars(freqData, now, dt) {
    const live = !!freqData;
    if (live) {
        const bins = freqData.length;
        const top = Math.min(bins, 72);
        for (let k = 0; k < barCount; k++) {
            const a = Math.floor(Math.pow(k / barCount, 1.7) * top);
            const b = Math.max(a + 1, Math.floor(Math.pow((k + 1) / barCount, 1.7) * top));
            let sum = 0, cnt = 0;
            for (let j = a; j < b && j < bins; j++) { sum += freqData[j]; cnt++; }
            const v = cnt ? (sum / cnt) / 255 : 0;
            barTargets[k] = Math.min(1, Math.pow(v, 0.8) * 1.45);
        }
    } else {
        for (let k = 0; k < barCount; k++) {
            const v = 0.05 + 0.05 * (0.5 + 0.5 * Math.sin(now / 640 + k * 0.42));
            barTargets[k] = v;
        }
    }
    for (let k = 0; k < barCount; k++) {
        const t = barTargets[k];
        const cur = barLevels[k];
        const up = live ? 0.62 : 0.10;
        const down = live ? 0.15 : 0.06;
        barLevels[k] = cur + (t - cur) * Math.min(1, (t > cur ? up : down) * dt);
        if (barLevels[k] >= barPeaks[k]) barPeaks[k] = barLevels[k];
        else barPeaks[k] = Math.max(0, barPeaks[k] - 0.010 * dt);
    }
    let total = 0;
    for (let k = 0; k < barCount; k++) total += barLevels[k];
    const avg = total / barCount;
    waveLevel += (avg - waveLevel) * Math.min(1, 0.20 * dt);
}

function roundRectPath(ctx, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
}

function drawBar(ctx, x, w, h, ph, color, intensity, baseY) {
    const y = baseY - h;
    const r = Math.min(w / 2, 4);
    const g = ctx.createLinearGradient(0, y, 0, baseY);
    g.addColorStop(0, mixHex(color, '#FFFFFF', 0.45));
    g.addColorStop(0.55, color);
    g.addColorStop(1, mixHex(color, '#FFFFFF', 0.12));
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 5 + intensity * 16;
    ctx.fillStyle = g;
    roundRectPath(ctx, x, y, w, h, r);
    ctx.fill();
    ctx.restore();
}

function drawWave() {
    if (!waveCtx || waveW <= 0 || waveH <= 0) return;
    const ctx = waveCtx;
    const W = waveW, H = waveH;
    ctx.clearRect(0, 0, W, H);
    const theme = WAVE_THEMES[waveThemeIdx];
    const baseY = H - 9;
    const maxH = H - 30;
    const cx = W / 2;
    const gap = Math.max(1.5, W / 300);
    const usable = W * 0.94;
    const barW = Math.max(2, (usable / 2 - gap * (barCount - 1)) / barCount);
    if (barW <= 0) return;
    for (let k = 0; k < barCount; k++) {
        const idx = Math.min(MAX_BARS - 1, k);
        const ratio = Math.max(0, Math.min(1, barLevels[idx]));
        const peakR = Math.max(0, Math.min(1, barPeaks[idx]));
        const color = themeColor(theme, k / Math.max(1, barCount - 1));
        const offset = gap * 0.5 + k * (barW + gap);
        const h = Math.max(3, ratio * maxH);
        const ph = Math.max(3, peakR * maxH);
        drawBar(ctx, cx + offset, barW, h, ph, color, ratio, baseY);
        drawBar(ctx, cx - offset - barW, barW, h, ph, color, ratio, baseY);
    }
}

function renderDual() {
    if (!dualStarEls.length) return;
    const level = micLevel;
    if (dualMode === 'read') {
        const on = Math.round(level * dualStarEls.length);
        dualStarEls.forEach((s, i) => {
            const lit = i < on;
            s.style.opacity = lit ? 1 : 0.12;
            s.style.transform = `scale(${lit ? 1.5 : 1})`;
        });
        dualMoonEl.style.opacity = 0.06;
        dualValEl.textContent = Math.round(level * 100) + '%';
    } else {
        const q = 1 - level;
        const starOp = (0.32 + 0.45 * q).toFixed(2);
        dualStarEls.forEach(s => { s.style.opacity = starOp; });
        dualMoonEl.style.opacity = (0.35 + 0.65 * q).toFixed(2);
        dualMoonEl.style.setProperty('--moon-scale', (1 + q * 0.12).toFixed(3));
        dualValEl.textContent = '安静 ' + Math.round(q * 100) + '%';
    }
}

function startProgress(seconds) {
    progDuration = Math.max(PROG_MIN_SEC, Math.min(PROG_MAX_SEC, Math.round(seconds)));
    progRemaining = progDuration;
    progEndAt = Date.now() + progDuration * 1000;
    progRunning = true;
    progSaved = false;
    progValue = 0;
    saveProg();
    updateProgressUI();
    if (progMinutesInput && document.activeElement !== progMinutesInput) {
        progMinutesInput.value = minutesText(progDuration);
    }
    badgeTextCache = '';
}

function renderStageProgress(dt) {
    if (progMode === 'time') {
        if (progRunning) {
            progRemaining = Math.max(0, (progEndAt - Date.now()) / 1000);
            if (progRemaining <= 0) {
                progRemaining = 0;
                progRunning = false;
                progSaved = true;
                progValue = 100;
                saveProg();
                updateProgressUI();
                onProgressComplete();
                return;
            }
            throttledSaveProg();
        }
        progValue = progDuration > 0 ? Math.max(0, Math.min(100, (1 - progRemaining / progDuration) * 100)) : 0;
    } else {
        if (!progSaved && micLevel > 0.05) {
            const baseRate = 100 / (progDuration * 60);
            const volFactor = Math.max(0.2, micLevel / 0.15);
            progVoiceValue = Math.min(100, progVoiceValue + baseRate * volFactor * dt);
            if (progVoiceValue >= 100) {
                progVoiceValue = 100;
                progSaved = true;
                progValue = 100;
                saveProg();
                updateProgressUI();
                onProgressComplete();
                return;
            }
            throttledSaveProg();
        }
        progValue = progVoiceValue;
    }
    updateProgressUI();
}

function updateProgressUI() {
    if (!progFillEl || !progSwimmerEl) return;
    const w = Math.max(0, Math.min(100, progValue));
    const wStr = w.toFixed(1) + '%';
    if (progFillEl.style.width !== wStr) progFillEl.style.width = wStr;
    const posStr = Math.max(3, Math.min(97, w)).toFixed(1) + '%';
    if (progSwimmerEl.style.left !== posStr) progSwimmerEl.style.left = posStr;

    // 更新倒计时小钟表
    const clockEl = $('#progClock');
    const clockTextEl = $('#progClockText');
    if (clockEl && clockTextEl) {
        if (progSaved) {
            clockTextEl.textContent = '00:00';
            clockEl.classList.remove('show');
        } else {
            let remainSec = 0;
            if (progMode === 'time') {
                remainSec = progRemaining;
            } else {
                remainSec = (1 - progVoiceValue / 100) * progDuration;
            }
            clockTextEl.textContent = fmtClock(remainSec);
            clockEl.classList.add('show');
        }
    }
}

function onProgressComplete() {
    toast('🏝 鲸鱼到达终点，已自动存入今日记录');
    const tab = currentTab();
    if (!tab.students.length) return;
    const records = tab.students.map(s => ({
        name: s.name,
        sid: s.sid,
        passed: !!tab.passed[s.id],
        time: tab.passed[s.id] ? tab.passed[s.id].time : null
    }));
    state.history.unshift({
        id: Date.now(), date: state.date, project: tab.name,
        total: tab.students.length,
        passed: records.filter(r => r.passed).length,
        records: records
    });
    if (state.history.length > 300) state.history.length = 300;
    save();
    celebrateAllDone(true);
}

function resetProgress() {
    if (progMode === 'time') {
        progRemaining = progDuration;
        progEndAt = Date.now() + progDuration * 1000;
        progRunning = true;
        progSaved = false;
        progValue = 0;
        saveProg();
        updateProgressUI();
        badgeTextCache = '';
        toast('⏳ 倒计时已重新开始：' + minutesText(progDuration) + ' 分钟');
    } else {
        progVoiceValue = 0;
        progValue = 0;
        progSaved = false;
        saveProg();
        updateProgressUI();
        badgeTextCache = '';
        toast('🎤 音控进度已重置，喊起来吧！');
    }
}

function applyProgMinutes() {
    if (!progMinutesInput) return;
    let m = parseFloat(progMinutesInput.value);
    if (!isFinite(m) || m <= 0) {
        toast('请输入大于 0 的分钟数');
        progMinutesInput.value = minutesText(progDuration);
        return;
    }
    m = Math.min(PROG_MAX_SEC / 60, Math.max(PROG_MIN_SEC / 60, m));
    progMinutesInput.value = String(Math.round(m * 10) / 10);
    const newSec = Math.round(m * 60);
    progDuration = newSec;

    if (progMode === 'time') {
        startProgress(progDuration);
        toast('⏳ 已设定倒计时 ' + (Math.round(m * 10) / 10) + ' 分钟，鲸鱼出发啦');
    } else {
        progVoiceValue = 0;
        progValue = 0;
        progSaved = false;
        updateProgressUI();
        saveProg();
        toast('🎤 已设定音控目标 ' + (Math.round(m * 10) / 10) + ' 分钟，喊起来吧');
    }

    if (stageMode !== 'progress') {
        setStageMode('progress');
    }
}

function spawnFireworkBurst() {
    const cx = waveW * (0.2 + Math.random() * 0.6);
    const cy = waveH * (0.2 + Math.random() * 0.4);
    const hue = Math.random() * 360;
    const n = 30 + Math.floor(micLevel * 30);
    for (let i = 0; i < n; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 1 + Math.random() * 3;
        fwParticles.push({
            x: cx, y: cy,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            life: 1,
            decay: 0.008 + Math.random() * 0.012,
            hue: hue + (Math.random() - 0.5) * 60,
            r: 1.5 + Math.random() * 2
        });
    }
}

function renderFirework(now, dt) {
    const ctx = waveCtx;
    const W = waveW, H = waveH;
    ctx.clearRect(0, 0, W, H);
    fwTimer -= dt;
    if (micLevel > 0.18 && fwTimer <= 0) {
        fwTimer = 22 - micLevel * 18;
        spawnFireworkBurst();
        if (micLevel > 0.55 && Math.random() < 0.55) spawnFireworkBurst();
    }
    for (let i = fwParticles.length - 1; i >= 0; i--) {
        const p = fwParticles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 0.03 * dt;
        p.vx *= 0.99;
        p.vy *= 0.99;
        p.life -= p.decay * dt;
        if (p.life <= 0) { fwParticles.splice(i, 1); continue; }
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        const c = `hsl(${p.hue}, 100%, 65%)`;
        ctx.fillStyle = c;
        ctx.shadowColor = c;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
    if (fwParticles.length > 400) fwParticles.splice(0, fwParticles.length - 400);
}

function spawnBalloon() {
    if (!balloonLayer) return;
    const el = document.createElement('div');
    el.className = 'balloon';
    el.textContent = ['🎈','🎈','🩷','💛','💙','💜'][Math.floor(Math.random() * 6)];
    el.style.left = (Math.random() * 90 + 5) + '%';
    balloonLayer.appendChild(el);
    balloonEls.push({
        el, y: 0, speed: 0.6 + Math.random() * 0.8, rot: (Math.random() - 0.5) * 20, phase: Math.random() * 6.28
    });
}

function renderBalloon(now, dt) {
    const level = micLevel;
    if (level > 0.15 && Math.random() < level * 0.09 * dt) spawnBalloon();
    for (let i = balloonEls.length - 1; i >= 0; i--) {
        const b = balloonEls[i];
        b.y += b.speed * (0.5 + level * 2.5) * dt;
        b.rot += Math.sin(now / 800 + b.phase) * 0.3 * dt;
        b.el.style.transform = `translateY(${-b.y}px) rotate(${b.rot}deg)`;
        if (b.y > waveH + 40) { b.el.remove(); balloonEls.splice(i, 1); }
    }
    if (balloonEls.length > 40) {
        const extra = balloonEls.splice(0, balloonEls.length - 40);
        extra.forEach(b => b.el.remove());
    }
}

function updateWaveBadge() {
    if (!waveBadgeEl) return;
    let txt = '';
    if (stageMode === 'progress') {
        if (progSaved) {
            txt = '🏝 已到达！';
        } else if (progMode === 'time') {
            if (progRunning) {
                txt = '⏳ 剩余 ' + fmtClock(progRemaining);
            } else {
                txt = '⏳ 点击 ↺ 开始 · ' + minutesText(progDuration) + ' 分钟';
            }
        } else {
            const remainMin = Math.max(0, Math.ceil((100 - progValue) / 100 * progDuration / 60));
            txt = progValue >= 99 ? '🏝 即将到达' : `🎤 音控 ${Math.round(progValue)}% · 约剩 ${remainMin} 分钟`;
        }
    } else if (stageMode === 'dual') {
        txt = dualMode === 'read' ? '📣 读书模式' : '🌙 安静模式';
    } else if (stageMode === 'firework') {
        if (micLevel > 0.55) txt = '🎆 烟花齐放';

    } else if (stageMode === 'balloon') {
        if (micLevel > 0.45) txt = '🎈 气球升空';
        else if (micLevel > 0.18) txt = '🎈 气球飘起来';
        else txt = '🎈 声音再大点';
    } else {
        if (!audioAnalyser) txt = '🎤 点击开启音浪';
        else if (waveLevel < 0.10) txt = '🌙 很安静';
        else if (waveLevel < 0.26) txt = '🙂 刚刚好';
        else if (waveLevel < 0.48) txt = '😄 有点热闹';
        else if (waveLevel < 0.68) txt = '🔥 很嗨';
        else txt = '💥 爆表啦';
    }
    if (txt !== badgeTextCache) {
        badgeTextCache = txt;
        waveBadgeEl.textContent = txt;
    }
}

function toggleMic() {
    if (micStream) { stopMic(); return; }
    if (location.protocol === 'file:') { toast('本地文件无法使用麦克风，请部署到 HTTPS 后使用'); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('当前浏览器不支持麦克风'); return; }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        micStream = stream;
        const ctx = getAudioCtx();
        if (!ctx) throw new Error('音频引擎未就绪');
        if (ctx.state === 'suspended') ctx.resume().catch(() => {});
        const src = ctx.createMediaStreamSource(stream);
        audioAnalyser = ctx.createAnalyser();
        audioAnalyser.fftSize = 512;
        audioAnalyser.smoothingTimeConstant = 0.55;
        src.connect(audioAnalyser);
        micDataArray = new Uint8Array(audioAnalyser.frequencyBinCount);
        const btn = $('#micBtn');
        if (btn) { btn.textContent = '⏹'; btn.classList.add('active'); }
        if (waveStage) waveStage.classList.add('live');
        badgeTextCache = '';
        toast('音浪已开启，喊起来吧！');
    }).catch(err => {
        const m = (err && err.name === 'NotAllowedError') ? '麦克风权限被拒绝' : ((err && err.message) || '未知错误');
        toast('无法开启麦克风：' + m);
    });
}

function stopMic() {
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    audioAnalyser = null;
    micDataArray = null;
    waveParticles.length = 0;
    for (let i = 0; i < MAX_BARS; i++) { barLevels[i] = 0; barPeaks[i] = 0; }
    waveLevel = 0;
    micLevel = 0;
    const btn = $('#micBtn');
    if (btn) { btn.textContent = '🎤'; btn.classList.remove('active'); }
    if (waveStage) waveStage.classList.remove('live');
    if (waveBadgeEl) { waveBadgeEl.textContent = '🎤 点击开启音浪'; badgeTextCache = ''; }
}

function cycleWaveTheme() {
    waveThemeIdx = (waveThemeIdx + 1) % WAVE_THEMES.length;
    toast('音浪配色：' + WAVE_THEMES[waveThemeIdx].name);
}

function renderProgress() {

function makeAvatarEl(student) {
    const box = document.createElement('div');

        box.textContent = student.avatarData;
        return box;
    }
    box.classList.add('txt');
    box.style.background = candyOf(student.id);
    box.textContent = student.name.charAt(0);
    return box;
}

function makeCard(student, isPassed, rank) {
    const btn = document.createElement('button');
    btn.className = 'card';
    btn.type = 'button';
    btn.dataset.id = student.id;
    btn.style.setProperty('--stripe', candyOf(student.id));

    if (rank && rank <= 3) {
        const medal = document.createElement('span');
        medal.className = 'medal-badge';
        medal.textContent = rank === 1 ? '🥇' : (rank === 2 ? '🥈' : '🥉');
        btn.appendChild(medal);
    }

    btn.appendChild(makeAvatarEl(student));
    const nm = document.createElement('span');
    nm.className = 'cname' + (student.name.length >= 5 ? ' long' : '');

    btn.appendChild(nm);

    btn.addEventListener('click', () => {
        if (editMode) openAvatarModal(student.id);
        else if (isPassed) setPassed(student.id, false);

}

function makeGhostCard(student) {
    const btn = document.createElement('button');
    btn.className = 'card ghost';
    btn.type = 'button';
    btn.dataset.id = student.id;
    btn.dataset.ghost = '1';
    btn.style.setProperty('--stripe', candyOf(student.id));
    btn.appendChild(makeAvatarEl(student));

function renderPending() {
    const tab = currentTab();
    elPendingGrid.innerHTML = '';

    if (tab.students.length === 0) {
        elPendingCnt.textContent = 0;
        elLastTenTip.classList.remove('show');
        const tip = document.createElement('div');
        tip.className = 'empty-tip';
        tip.innerHTML = '<span class="big">📝</span>名单还是空的<br>去「⋯ → 名单管理」添加学生吧';
        elPendingGrid.appendChild(tip);
        return;
    }

    if (state.pinMode) {
        const all = sortedAll(tab);
        const pendingCount = all.filter(s => !tab.passed[s.id]).length;
        elPendingCnt.textContent = pendingCount;
        const frag = document.createDocumentFragment();
        all.forEach(s => {
            frag.appendChild(tab.passed[s.id] ? makeGhostCard(s) : makeCard(s, false));
        });
        elPendingGrid.appendChild(frag);

        if (pendingCount > 0 && pendingCount <= 10) {
            elLastTenTip.textContent = pendingCount === 1 ? '👀 就剩你 1 个了！加油吧💪' : `💪 就剩你们 ${pendingCount} 个了！加油吧💪`;
            elLastTenTip.classList.add('show');
        } else {
            elLastTenTip.classList.remove('show');
        }

        if (pendingCount === 0) {

            tip.className = 'all-done-float';

        return;
    }

    const list = sortPending(tab);
    elPendingCnt.textContent = list.length;
    if (list.length === 0) {

function renderPassed() {

/* ==========================================================================
   9. 打卡核心
   ========================================================================== */
function pushUndo(tab) {
    undoStack.push({ tabId: tab.id, passed: JSON.parse(JSON.stringify(tab.passed)), seq: tab.seq });
    if (undoStack.length > 60) undoStack.shift();
}

function celebrateAllDone(silent) {
    if (reduceMotion()) return;
    const w = window.innerWidth, h = window.innerHeight;
    const spots = [[w * 0.18, h * 0.30], [w * 0.5, h * 0.20], [w * 0.82, h * 0.30]];
    spots.forEach((p, i) => {
        setTimeout(() => { fxConfetti(p[0], p[1]); fxFirework(p[0], p[1]); }, i * 220);
    });
    if (!silent) setTimeout(() => toast('🎉 全部交齐，太棒啦！'), 200);
}

function setPassed(id, passed) {
    const tab = currentTab();
    const fromEl = passed ? elPendingGrid.querySelector('.card[data-id="' + id + '"]:not(.ghost)') : elPassedGrid.querySelector('.card[data-id="' + id + '"]');
    const fromRect = fromEl ? fromEl.getBoundingClientRect() : null;
    const cx = fromRect ? fromRect.left + fromRect.width / 2 : window.innerWidth / 2;
    const cy = fromRect ? fromRect.top + fromRect.height / 2 : window.innerHeight / 2;

    pushUndo(tab);
    if (passed) {
        if (!tab.passed[id]) { tab.seq += 1; tab.passed[id] = { time: Date.now(), seq: tab.seq }; }
    } else {
        delete tab.passed[id];
    }
    const allDone = tab.students.length > 0 && tab.students.every(s => tab.passed[s.id]);
    save();

    if (passed) {
        const now = Date.now();
        if (now - lastPassTime < 2000) {
            comboCount++;
            if (comboCount >= 3) { showCombo(comboCount); playDing(600 + comboCount * 100); }
        } else comboCount = 1;
        lastPassTime = now;
    }

    renderProgress(); renderPending(); renderPassed();

    const toEl = passed ? elPassedGrid.querySelector('.card[data-id="' + id + '"]') : elPendingGrid.querySelector('.card[data-id="' + id + '"]:not(.ghost)');
    if (fromRect && toEl && !reduceMotion()) {
        const toRect = toEl.getBoundingClientRect();
        if (toRect.width && toRect.height) {
            const dx = fromRect.left - toRect.left;
            const dy = fromRect.top  - toRect.top;
            const sx = fromRect.width  / toRect.width;
            const sy = fromRect.height / toRect.height;
            try {
                toEl.animate([
                    { transform: `translate(${dx}px,${dy}px) scale(${sx},${sy})`, opacity: .92 },
                    { transform: 'translate(0,0) scale(1,1)', opacity: 1 }
                ], { duration: 460, easing: 'cubic-bezier(.22,.9,.3,1)' });
            } catch (e) {}
        }
    }

    if (passed && state.pinMode) {
        const ghostEl = elPendingGrid.querySelector('.card.ghost[data-id="' + id + '"]');
        if (ghostEl && !reduceMotion()) {
            try {
                ghostEl.animate([{ transform: 'scale(.86)', opacity: 0 }, { transform: 'scale(1)', opacity: .5 }], { duration: 320, easing: 'cubic-bezier(.22,.9,.3,1)' });
            } catch (e) {}
        }
    }

    if (passed) {
        spawnEffect(cx, cy);
        if (comboCount < 3) playDing();
        if (allDone) setTimeout(() => { playFanfare(); celebrateAllDone(); }, 380);
    } else {
        fxRipple(cx, cy);
        comboCount = 0;
    }
}

function undo() {
    const last = undoStack.pop();
    if (!last) { toast('没有可以撤销的操作了'); return; }
    const tab = state.tabs[last.tabId];
    if (!tab) return;
    if (state.activeTab !== last.tabId) state.activeTab = last.tabId;
    tab.passed = last.passed; tab.seq = last.seq;
    save(); render(); toast('已撤销');
}

/* ==========================================================================
   10. 音效
   ========================================================================== */
function getAudioCtx() {
    if (audioCtx) {
        if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        return audioCtx;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { audioCtx = new AC(); } catch (e) { return null; }
    return audioCtx;
}

function playDing(freq) {
    if (!state.soundOn) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const t = ctx.currentTime;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(freq || 880, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.30, t + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.33);
}

function playFanfare() {
    if (!state.soundOn) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const notes = [523.25, 659.25, 783.99, 1046.50];
    const t0 = ctx.currentTime;
    notes.forEach((freq, i) => {
        const t = t0 + i * 0.12;
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.24, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t + 0.5);
    });
}

    else { elSoundBtn.textContent = '🔇'; elSoundBtn.classList.add('off'); }
}
